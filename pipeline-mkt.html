<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>KAMI <b style="color:#c8192b;">MKT</b> System</title>
<style>
:root{
  --bg:#edecea;--s1:#ffffff;--s2:#f4f2ee;--s3:#e9e6e0;--b:#d8d4cd;
  --t1:#111827;--t2:#4b5563;--t3:#9ca3af;
  --ac:#c8192b;--ac2:#a5141f;
  --hbg:#1c1c1c;--hb:#2e2e2e;--ht1:#f0f0f0;--ht2:#a0a0a0;--ht3:#5e5e5e;
}
[data-theme="dark"]{
  --bg:#0f1117;--s1:#1a1d27;--s2:#21242f;--s3:#282b38;--b:#2e3244;
  --t1:#e8eaf0;--t2:#9aa0b8;--t3:#5a6278;
  --ac:#e8374a;--ac2:#c8192b;
  --hbg:#0a0c12;--hb:#1a1d27;--ht1:#e8eaf0;--ht2:#9aa0b8;--ht3:#5a6278;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
/* TOOLTIPS — acessíveis via hover e teclado (focus) */
.tip{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--b);color:var(--t3);font-size:10px;font-weight:800;cursor:default;flex-shrink:0;line-height:1;}
.tip:focus{outline:2px solid var(--ac);outline-offset:2px;}
#tip-popup{position:fixed;background:#1c1c1c;color:#fff;font-size:11px;font-weight:400;padding:8px 12px;border-radius:8px;white-space:pre-wrap;max-width:260px;min-width:120px;z-index:99999;pointer-events:none;line-height:1.5;text-align:left;box-shadow:0 4px 16px rgba(0,0,0,.3);display:none;}

/* DARK MODE overrides para elementos com cores hardcoded */
[data-theme="dark"] .modal{background:var(--s1);border-color:var(--b);}
[data-theme="dark"] .mbody{background:var(--s1);}
[data-theme="dark"] .mhead{background:var(--s1);border-color:var(--b);}
[data-theme="dark"] .mtabs{background:var(--s2);}
[data-theme="dark"] .mtab{color:var(--t2);}
[data-theme="dark"] .mtab.on{color:var(--ac);border-bottom-color:var(--ac);}
[data-theme="dark"] .overlay{background:rgba(0,0,0,.75);}
[data-theme="dark"] .card{background:var(--s1);border-color:var(--b);}
[data-theme="dark"] .fbar,.filters{background:var(--s1);}
[data-theme="dark"] .fsel,.fsearch{background:var(--s2);color:var(--t1);border-color:var(--b);}
[data-theme="dark"] .stats{background:var(--s1);}
[data-theme="dark"] .khead{background:var(--s2);}
[data-theme="dark"] .kcol{background:var(--s2);}
[data-theme="dark"] .kcards{background:var(--s2);}
[data-theme="dark"] .tag{filter:brightness(.85);}
[data-theme="dark"] .dash-wrap{background:var(--bg);}
[data-theme="dark"] .dash-kpi-card{background:var(--s1);border-color:var(--b);}
[data-theme="dark"] .utbl tr:nth-child(even){background:var(--s2);}
[data-theme="dark"] .utbl td,.utbl th{border-color:var(--b);color:var(--t2);}
[data-theme="dark"] select option{background:var(--s2);color:var(--t1);}
[data-theme="dark"] input[type="date"],[data-theme="dark"] input[type="time"]{color-scheme:dark;}
[data-theme="dark"] .tip{background:var(--s3);color:var(--t2);}
[data-theme="dark"] .auto-rule-card{background:var(--s1);border-color:var(--b);}
[data-theme="dark"] .portal-section{background:var(--s1);}
[data-theme="dark"] .portal-item-card{background:var(--s1);}
[data-theme="dark"] .portal-entry-card{background:var(--s1);}

@media(max-width:768px){
  .sidebar{width:54px;}
  .sidebar .sidebar-brand-name,.sidebar .sidebar-item span:not(.sidebar-item-icon):not(.sidebar-item-chevron),.sidebar .sidebar-section-label,.sidebar .sidebar-user-info,.sidebar .sidebar-sub,.sidebar .sidebar-item-chevron{display:none;}
  .sidebar .sidebar-brand{justify-content:center;padding:14px 0;}
  .sidebar .sidebar-item{justify-content:center;padding:10px 0;}
  .sidebar .sidebar-user{justify-content:center;padding:8px 0;}
  .kcol{min-width:280px;width:280px;}
  .modal{max-width:98vw!important;margin:4px;}
  .mbody{padding:12px!important;}
  .r2,.r3{grid-template-columns:1fr!important;}
  .fbar{flex-wrap:wrap;gap:6px;padding:8px 12px;}
  .fsel{font-size:11px;padding:5px 6px;}
  .dash-wrap{padding:12px!important;}
}
@media(max-width:480px){
  .modal{max-width:100vw!important;margin:0;border-radius:12px 12px 0 0;position:fixed;bottom:0;left:0;right:0;}
  .mhead{padding:12px 14px 8px;}
  .mbody{padding:10px 12px!important;max-height:70vh!important;}
  .mfoot{padding:10px 12px;}
  .mtabs{overflow-x:auto;flex-wrap:nowrap;}
  .mtab{white-space:nowrap;font-size:11px;padding:8px 10px;}
  .btn{font-size:11px;padding:5px 10px;}
  .r2,.r3{grid-template-columns:1fr!important;}
  .hright{gap:4px;}
  .btn-icon{width:26px;height:26px;font-size:12px;}
  .ch-group{grid-template-columns:repeat(2,1fr)!important;}
}
@media print{
  .header,.pipe-tabs,.fbar,.mfoot,.btn-icon,.kadd,.kcol-menu-btn,
  [data-action="export-csv1"],[data-action="export-csv2"],[data-action="print-dashboard"],
  #notif-panel,.overlay{display:none!important;}
  html,body,#root{height:auto!important;overflow:visible!important;}
  .dash-wrap{overflow:visible!important;padding:20px!important;}
  .dash-kpi-card{break-inside:avoid;}
  body{background:#fff!important;}
}
body{background:var(--bg);color:var(--t1);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;display:flex;flex-direction:column;}
#root{flex:1;min-height:0;display:flex;flex-direction:row;overflow:hidden;}
.content-wrap{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
/* SIDEBAR */
.sidebar{width:240px;flex-shrink:0;background:var(--hbg);display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden;}
.sidebar-brand{padding:20px 18px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.sidebar-brand-k{width:34px;height:34px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#111;flex-shrink:0;letter-spacing:-1px;}
.sidebar-brand-name{font-size:14px;font-weight:700;color:var(--ht1);letter-spacing:-.2px;line-height:1.25;}
.sidebar-brand-name b{color:var(--ac);font-weight:700;}
.sidebar-sep{height:1px;background:var(--hb);margin:0 14px;flex-shrink:0;}
.sidebar-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;border:none;background:none;color:var(--ht3);cursor:pointer;font-size:13px;font-weight:500;text-align:left;width:100%;font-family:'Inter',inherit;transition:.12s;white-space:nowrap;letter-spacing:-.1px;}
.sidebar-item.on{background:var(--ac);color:#fff;font-weight:600;}
.sidebar-item:not(.on):hover{background:rgba(255,255,255,.07);color:var(--ht1);}
.sidebar-item-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.8;}
.sidebar-item.on .sidebar-item-icon{opacity:1;}
.sidebar-section-label{font-size:10px;font-weight:600;color:var(--ht3);text-transform:uppercase;letter-spacing:1.2px;padding:12px 14px 4px;opacity:.5;}
.sidebar-sub{display:flex;flex-direction:column;gap:1px;margin-left:12px;padding-left:12px;border-left:1px solid rgba(255,255,255,.1);}
.sidebar-sub .sidebar-item{font-size:13px;padding:9px 12px;font-weight:500;background:none;color:var(--ht3);border-radius:6px;}
.sidebar-sub .sidebar-item:not(.on):hover{background:rgba(255,255,255,.07);color:var(--ht1);}
.sidebar-sub .sidebar-item.on{background:var(--ac);color:#fff;font-weight:600;}
.sidebar-sub .sidebar-sub .sidebar-item{font-size:12px;padding:8px 10px;background:none;color:var(--ht3);border-radius:6px;}
.sidebar-sub .sidebar-sub .sidebar-item:not(.on):hover{background:rgba(255,255,255,.07);color:var(--ht1);}
.sidebar-sub .sidebar-sub .sidebar-item.on{background:var(--ac);color:#fff;font-weight:600;}
.sidebar-item-chevron{margin-left:auto;opacity:.4;transition:transform .2s;font-size:11px;line-height:1;}
.sidebar-item-chevron.open{transform:rotate(90deg);opacity:.7;}
.sidebar-toggle{width:100%;display:flex;align-items:center;justify-content:flex-end;padding:6px 10px 2px;flex-shrink:0;}
.sidebar-toggle-btn{background:none;border:none;color:var(--ht3);cursor:pointer;padding:6px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:.12s;opacity:.6;}
.sidebar-toggle-btn:hover{background:rgba(255,255,255,.07);opacity:1;}
.sidebar.collapsed{width:54px;}
.sidebar.collapsed .sidebar-brand-name,
.sidebar.collapsed .sidebar-item span:not(.sidebar-item-icon):not(.sidebar-item-chevron),
.sidebar.collapsed .sidebar-section-label,
.sidebar.collapsed .sidebar-user-info,
.sidebar.collapsed .sidebar-sub,
.sidebar.collapsed .sidebar-item-chevron{display:none;}
.sidebar.collapsed .sidebar-brand{justify-content:center;padding:20px 0 16px;}
.sidebar.collapsed .sidebar-item{justify-content:center;padding:10px 0;}
.sidebar.collapsed .sidebar-user{justify-content:center;padding:8px 0;}
.sidebar.collapsed .sidebar-toggle{justify-content:center;padding:6px 0 2px;}
.sidebar.collapsed .sidebar-nav{padding:10px 6px;}
.sidebar.collapsed .sidebar-footer{padding:10px 6px 16px;}
.sidebar-footer{padding:10px 8px 16px;border-top:1px solid var(--hb);flex-shrink:0;display:flex;flex-direction:column;gap:1px;}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px 14px 10px;}
.sidebar-user-info{flex:1;min-width:0;}
.sidebar-user-name{font-size:13px;font-weight:600;color:var(--ht1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-user-role{font-size:11px;color:var(--ht3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--t3);}

/* HEADER — kept minimal for compat */
.vtabs{display:flex;background:rgba(255,255,255,.07);border-radius:8px;padding:2px;gap:1px;}
.vbtn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:6px;border:none;background:none;color:var(--t2);cursor:pointer;font-size:12px;font-weight:600;transition:.12s;font-family:inherit;}
.vbtn.on{background:var(--t1);color:var(--s1);}
.vbtn:not(.on):hover{background:var(--s3);color:var(--t1);}
.btn{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.12s;font-family:inherit;}
.btn-p{background:var(--ac);color:#fff;}
.btn-p:hover{background:var(--ac2);}
.btn-o{background:transparent;color:var(--t2);border:1px solid var(--b);}
.btn-o:hover{background:var(--s3);color:var(--t1);}
.btn-d{background:rgba(220,38,38,.1);color:#dc2626;border:1px solid rgba(220,38,38,.25);margin-right:auto;}
.btn-d:hover{background:#dc2626;color:#fff;}
.btn-icon{background:rgba(255,255,255,.08);border:1px solid var(--hb);color:var(--ht2);width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:.12s;flex-shrink:0;}
.btn-icon:hover{background:var(--ac);color:#fff;border-color:var(--ac);}

/* FILTERS */
.filters{display:flex;gap:6px;align-items:center;padding:7px 20px;background:var(--s1);border-bottom:1px solid var(--b);flex-shrink:0;flex-wrap:wrap;}
.flabel{font-size:10px;color:var(--t3);font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;}
.fsel,.fsearch{background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t1);padding:5px 9px;font-size:12px;outline:none;font-family:inherit;transition:border-color .12s;}
.fsel:focus,.fsearch:focus{border-color:var(--ac);}
.fsearch{width:170px;}
.fsearch::placeholder{color:var(--t3);}
.fsel option{background:var(--s1);}
.fclr{font-size:11px;color:var(--ac);cursor:pointer;padding:4px 7px;border-radius:5px;transition:.12s;}
.fclr:hover{background:rgba(200,25,43,.08);}

/* STATS */
.stats{display:flex;gap:18px;padding:5px 20px;background:var(--s1);border-bottom:1px solid var(--b);flex-shrink:0;}
.stat{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3);}
.stat strong{color:var(--t1);font-weight:700;}
.sdot{width:6px;height:6px;border-radius:50%;}

/* CLIENTES */
.clist{display:flex;flex-direction:column;gap:0;border:1px solid var(--b);border-radius:12px;overflow:hidden;background:var(--s1);}
.clist-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 120px 80px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--b);cursor:pointer;transition:.1s;gap:12px;}
.clist-row:last-child{border-bottom:none;}
.clist-row:hover{background:var(--s2);}
.clist-head{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;cursor:default!important;background:var(--s2)!important;}
.clist-head:hover{background:var(--s2)!important;}
.chealth{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.chealth-active{background:#dcfce7;color:#166534;}
.chealth-at_risk{background:#fef3c7;color:#92400e;}
.chealth-inactive{background:#f3f4f6;color:#6b7280;}
.chealth-churned{background:#fee2e2;color:#991b1b;}
.ctag{display:inline-flex;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;background:var(--s3);color:var(--t2);}
.ctype-pj{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;background:#ede9fe;color:#5b21b6;}
.ctype-pf{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;background:#e0f2fe;color:#0369a1;}
.cmodal-section{margin-bottom:20px;}
.cmodal-section-label{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--b);}
.cmodal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cmodal-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.cfield label{font-size:11px;font-weight:600;color:var(--t2);display:block;margin-bottom:4px;}
.cfield input,.cfield select,.cfield textarea{width:100%;background:var(--s2);border:1px solid var(--b);border-radius:7px;color:var(--t1);padding:8px 10px;font-size:12px;font-family:inherit;outline:none;transition:.15s;}
.cfield input:focus,.cfield select:focus,.cfield textarea:focus{border-color:var(--ac);}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg);}}
.cfield textarea{resize:vertical;min-height:72px;}
[data-theme="dark"] .ctype-pj{background:#2e1065;color:#a78bfa;}
[data-theme="dark"] .ctype-pf{background:#0c4a6e;color:#7dd3fc;}
[data-theme="dark"] .chealth-active{background:#14532d;color:#86efac;}
[data-theme="dark"] .chealth-at_risk{background:#451a03;color:#fbbf24;}
[data-theme="dark"] .chealth-inactive{background:#1f2937;color:#9ca3af;}
[data-theme="dark"] .chealth-churned{background:#450a0a;color:#fca5a5;}

/* TOAST */
#kami-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);background:#1c1c1c;color:#fff;font-size:12px;font-weight:600;padding:9px 18px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:9999;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;display:flex;align-items:center;gap:8px;font-family:inherit;}
#kami-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
#kami-toast .toast-undo-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:6px;color:#fff;cursor:pointer;font-size:11px;font-weight:700;padding:3px 12px;font-family:inherit;margin-left:4px;}
#kami-toast .toast-undo-btn:hover{background:rgba(255,255,255,.3);}
#kami-toast.toast-ok{background:#166534;}
#kami-toast.toast-warn{background:#92400e;}
#kami-toast.toast-err{background:#991b1b;}

/* BUSCA GLOBAL */
#kami-gsearch{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;}
.gs-box{width:560px;max-width:92vw;background:var(--s1);border:1px solid var(--b);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden;}
#gs-input{width:100%;box-sizing:border-box;background:var(--s1);border:none;border-bottom:1px solid var(--b);color:var(--t1);padding:14px 18px;font-size:14px;font-family:inherit;outline:none;}
#gs-results{max-height:46vh;overflow-y:auto;padding:6px;}
.gs-hint{font-size:11px;color:var(--t3);padding:14px;text-align:center;}
.gs-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;cursor:pointer;}
.gs-item:hover,.gs-item.sel{background:var(--s2);}
.gs-type{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#fff;background:var(--ac);border-radius:4px;padding:2px 7px;flex-shrink:0;min-width:60px;text-align:center;}
.gs-type-req{background:#8b5cf6;}
.gs-type-portal{background:#0e7490;}
.gs-label{font-size:13px;color:var(--t1);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gs-sub{font-size:10px;color:var(--t3);flex-shrink:0;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* MAIN */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* KANBAN */
.kanban{display:flex;gap:10px;padding:14px 20px 20px;overflow-x:auto;overflow-y:hidden;flex:1;align-items:flex-start;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;cursor:grab;}
.kanban.kb-dragging{cursor:grabbing;user-select:none;}
.kcol.kcollapsed{width:44px!important;min-width:44px!important;flex-shrink:0;}
.kcol.kcollapsed .kcards,.kcol.kcollapsed .kadd,.kcol.kcollapsed .kcol-menu-btn{display:none!important;}
.kcol.kcollapsed .khead{flex-direction:column;writing-mode:vertical-rl;align-items:center;gap:8px;padding:12px 8px;cursor:default;}
.kcol.kcollapsed .ktitle{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;}
.kcol.kcollapsed .kdot{flex-shrink:0;}
.kcol.kcollapsed .kcount{writing-mode:horizontal-tb;}
.kcol.kcollapsed [data-colcol]{writing-mode:horizontal-tb;transform:none;margin-top:auto;font-size:16px;padding:4px 6px;color:var(--t2);}
.kcol{scroll-snap-align:start;}
.kcol{flex-shrink:0;width:248px;background:var(--s2);border:1px solid var(--b);border-top:3px solid var(--kcol-color,var(--b));border-radius:12px;display:flex;flex-direction:column;max-height:100%;}
.khead{display:flex;align-items:center;gap:7px;padding:10px 12px;border-bottom:1px solid var(--b);flex-shrink:0;}
.kdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.ktitle{font-size:11px;font-weight:700;letter-spacing:.3px;flex:1;color:var(--t2);}
.kcount{background:var(--s3);border-radius:20px;padding:1px 7px;font-size:10px;color:var(--t3);font-weight:700;}
.kadd{background:none;border:none;color:var(--t3);cursor:pointer;width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;transition:.12s;flex-shrink:0;}
.kadd:hover{background:var(--ac);color:#fff;}
.kcards{padding:7px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:5px;min-height:60px;}
.kcards.dover{background:rgba(200,25,43,.05);border-radius:8px;}
.kempty{display:flex;flex-direction:column;align-items:center;padding:18px 8px;gap:6px;opacity:.6;}
.kempty-icon{font-size:20px;}
.kempty-txt{font-size:10px;color:var(--t3);text-align:center;line-height:1.4;}

/* CARD */
.card{background:var(--s1);border:1px solid var(--b);border-left:4px solid var(--b);border-radius:10px;padding:14px 14px 11px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.11);border-left-color:var(--ac);}
.card.dragging{opacity:.35;}
.ctitle{font-size:13px;font-weight:700;line-height:1.45;margin-bottom:9px;color:var(--t1);}
.ctags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px;}
.tag{padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.2px;}
.t-p{background:#ede9fe;color:#6d28d9;}
.t-r{background:#fce7f3;color:#be185d;}
.t-c{background:#cffafe;color:#0e7490;}
.t-s{background:#e0e7ff;color:#4338ca;}
.t-v{background:#fef3c7;color:#b45309;}
.t-st{background:#f3e8ff;color:#7e22ce;}
.t-top{background:#dcfce7;color:#166534;}
.t-mid{background:#fef9c3;color:#a16207;}
.t-bot{background:#fee2e2;color:#dc2626;}
/* request tags */
.t-bu{background:#ede9fe;color:#5b21b6;}
.t-ot{background:#e0f2fe;color:#0369a1;}
.t-via-w{background:#dcfce7;color:#15803d;}
.t-via-e{background:#e0e7ff;color:#3730a3;}
.cdates{display:flex;gap:8px;font-size:10px;color:var(--t3);margin-bottom:7px;}
.cdate{display:flex;align-items:center;gap:3px;}
.cinds{display:flex;gap:4px;align-items:center;}
.ind{width:7px;height:7px;border-radius:50%;}
.ind-on{background:#16a34a;opacity:.9;}
.ind-off{background:#d1d5db;}
.ind-blue{background:#3b82f6;opacity:.9;}
.ind-label{font-size:9px;color:var(--t3);margin-left:2px;}
/* avatars */
.avatars{display:flex;gap:3px;margin-top:7px;}
.avatar{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;border:2px solid var(--s1);flex-shrink:0;}
/* request card extras */
.cname{font-size:10px;color:var(--t3);margin-top:6px;display:flex;align-items:center;gap:4px;}
.cclip{font-size:10px;color:#3b82f6;margin-top:4px;}

/* LIST */
.listwrap{flex:1;overflow:auto;padding:14px 20px;}
.ltbl{width:100%;border-collapse:collapse;font-size:12px;}
.ltbl th{padding:7px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;background:var(--s1);border-bottom:1px solid var(--b);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap;}
.ltbl th:hover{color:var(--t1);}
.ltbl td{padding:9px 12px;border-bottom:1px solid var(--b);vertical-align:middle;}
.ltbl tr:hover td{background:var(--s2);cursor:pointer;}
.sbadge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;}
.sa{display:inline-block;margin-left:3px;opacity:.5;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.overlay.hide{display:none!important;}
.modal-box{background:var(--s1);border:1px solid var(--b);border-radius:14px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.15);padding:24px;}
.modal{background:var(--s1);border:1px solid var(--b);border-radius:14px;width:100%;max-width:700px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.15);}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b);flex-shrink:0;}
.mhead-t{font-size:14px;font-weight:700;color:var(--t1);}
.mclose{width:26px;height:26px;border-radius:6px;border:none;background:var(--s2);color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.12s;}
.mclose:hover{background:#ef4444;color:#fff;}
.mtabs{display:flex;padding:0 18px;border-bottom:1px solid var(--b);flex-shrink:0;background:var(--s2);}
.mtab{padding:9px 14px;border:none;background:none;color:var(--t3);cursor:pointer;font-size:12px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.12s;font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
.mtab.on{color:var(--ac);border-bottom-color:var(--ac);}
.mtab:not(.on):hover{color:var(--t1);}
.mbody{overflow-y:auto;flex:1;padding:16px 18px;background:var(--s1);}
.tpane{display:none;flex-direction:column;gap:12px;}
.tpane.on{display:flex;}
.mfoot{padding:12px 18px;border-top:1px solid var(--b);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;background:var(--s2);}
/* btn-o dentro de modal usa cores claras */
.modal .btn-o{background:var(--s1);color:var(--t2);border:1px solid var(--b);}
.modal .btn-o:hover{background:var(--s2);color:var(--t1);}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.4px;text-transform:uppercase;}
.fg input,.fg select,.fg textarea{background:var(--s2);border:1px solid var(--b);border-radius:7px;color:var(--t1);padding:8px 11px;font-size:12px;outline:none;font-family:inherit;width:100%;transition:border-color .12s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--ac);}
.fg textarea{resize:vertical;min-height:95px;line-height:1.55;}
.fg select option{background:var(--s1);}
.fg input[type=file]{padding:6px 10px;cursor:pointer;}
.fg .req{color:#dc2626;margin-left:2px;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
/* checkbox group */
.cbgroup{display:flex;flex-direction:column;gap:6px;background:var(--s2);border:1px solid var(--b);border-radius:7px;padding:10px 12px;}
.cbitem{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
.cbitem input[type=checkbox]{accent-color:var(--ac);width:14px;height:14px;cursor:pointer;flex-shrink:0;}
.cbitem-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;flex-shrink:0;}
.cbitem-name{font-size:12px;color:var(--t1);}
/* detail view inside modal */
.detail-section{display:flex;flex-direction:column;gap:10px;}
.detail-row{display:flex;flex-direction:column;gap:3px;}
.detail-label{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.4px;text-transform:uppercase;}
.detail-val{font-size:13px;color:var(--t1);background:var(--s2);border:1px solid var(--b);border-radius:7px;padding:8px 11px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.detail-val.mono{font-family:monospace;font-size:12px;}
.detail-val a{color:var(--ac);text-decoration:none;}
.detail-val a:hover{text-decoration:underline;}
/* DASHBOARD */
.dash-wrap{height:100vh;overflow-y:auto;padding:20px;box-sizing:border-box;}
.dash-grid{display:grid;gap:14px;margin-bottom:16px;}
.dash-card{background:var(--s1);border:1px solid var(--b);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.dash-card-title{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.dash-section-label{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--b);}
.kpi-num{font-size:30px;font-weight:800;line-height:1;}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:4px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bar-row:last-child{margin-bottom:0;}
.bar-label{font-size:11px;color:var(--t2);width:130px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:6px;background:var(--b);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.bar-val{font-size:11px;color:var(--t3);width:22px;text-align:right;flex-shrink:0;font-weight:700;}
.resp-tbl{width:100%;border-collapse:collapse;}
.resp-tbl th{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.4px;text-transform:uppercase;padding:6px 10px;text-align:center;border-bottom:1px solid var(--b);}
.resp-tbl th:first-child{text-align:left;}
.resp-tbl td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--b);font-size:12px;}
.resp-tbl td:first-child{text-align:left;}
.resp-tbl tr:last-child td{border-bottom:none;}
.cell-badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;}
.cell-af{background:#e0e7ff;color:#4338ca;}
.cell-prog{background:#fef3c7;color:#b45309;}
.cell-rev{background:#cffafe;color:#0e7490;}
.cell-done{background:#dcfce7;color:#166534;}
.cell-tot{background:#fee2e2;color:#dc2626;font-size:12px;}
.dash-empty{color:var(--t3);font-size:12px;text-align:center;padding:24px 0;}
.ch-group{display:flex;flex-wrap:wrap;gap:5px;background:var(--s2);border:1px solid var(--b);border-radius:7px;padding:8px 10px;}
.ch-item{display:flex;align-items:center;gap:4px;cursor:pointer;padding:3px 7px;border-radius:5px;transition:.1s;user-select:none;}
.ch-item:hover{background:var(--s3);}
.ch-item input[type=checkbox]{accent-color:var(--ac);width:12px;height:12px;cursor:pointer;flex-shrink:0;}
.ch-item-name{font-size:11px;color:var(--t2);}
.t-ch{background:#ccfbf1;color:#0f766e;}
/* AVATAR */
.u-av-btn{background:none;border:none;padding:0;cursor:pointer;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.u-av-btn:hover::after{content:'✎';position:absolute;inset:0;background:rgba(0,0,0,.45);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;pointer-events:none;}
.u-av-btn img,.u-av-btn div{pointer-events:none;}
/* AI MODAL */
.ai-spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(0,0,0,.12);border-top-color:var(--ac);border-radius:50%;animation:ai-spin .6s linear infinite;vertical-align:middle;margin-right:4px;}
@keyframes ai-spin{to{transform:rotate(360deg)}}
.ai-preview-item{background:var(--s2);border:1px solid var(--b);border-radius:7px;padding:8px 12px;display:flex;align-items:center;gap:8px;}
/* LOGIN */
/* ── LOGIN CENTRALIZADO ── */
.login-wrap{position:fixed;inset:0;background:#1a1a1a;display:flex;align-items:center;justify-content:center;z-index:9999;overflow:hidden;}
.login-left{width:100%;max-width:400px;display:flex;flex-direction:column;position:relative;z-index:2;}
.login-left-body{display:flex;flex-direction:column;}
.login-card{width:100%;}
.login-topbar{display:flex;align-items:center;gap:8px;margin-bottom:48px;}
.login-topbar img{height:28px;width:auto;}
.login-topbar-brand{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.3px;}
.login-topbar-brand span{color:#c8192b;}
.login-avatar{width:72px;height:72px;background:rgba(255,255,255,.08);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 32px;font-size:28px;border:2px solid rgba(255,255,255,.12);}
.login-card{display:flex;flex-direction:column;gap:14px;flex:1;}
.login-field{display:flex;flex-direction:column;gap:5px;}
.login-field label{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.4);}
.login-field input{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;font-size:14px;color:#fff;font-family:inherit;outline:none;transition:border .18s;}
.login-field input::placeholder{color:rgba(255,255,255,.25);}
.login-field input:focus{border-color:rgba(200,25,43,.6);background:rgba(200,25,43,.06);}
.login-btn{background:linear-gradient(135deg,#c8192b,#9b1223);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:.3px;transition:opacity .18s;margin-top:6px;}
.login-btn:hover{opacity:.88;}
.login-remember{display:flex;align-items:center;gap:8px;cursor:pointer;}
.login-remember input{accent-color:#c8192b;width:13px;height:13px;cursor:pointer;}
.login-remember span{font-size:12px;color:rgba(255,255,255,.35);}
.login-forgot{background:none;border:none;color:rgba(255,255,255,.3);font-size:12px;font-family:inherit;cursor:pointer;text-decoration:underline;text-align:center;margin-top:4px;padding:0;}
.login-forgot:hover{color:rgba(255,255,255,.6);}
.login-err{font-size:12px;color:#fca5a5;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);border-radius:8px;padding:8px 12px;text-align:center;}
.login-err.hide{display:none;}
.login-forgot-msg{margin-top:10px;background:rgba(254,249,195,.08);border:1px solid rgba(253,230,138,.2);border-radius:8px;padding:10px 14px;font-size:12px;color:rgba(255,255,255,.5);line-height:1.5;display:none;}
/* Painel direito — visual */
.login-right{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:40px;}
.login-right-bg{position:absolute;inset:0;background:linear-gradient(135deg,#1a1a1a 0%,#222222 40%,#1e1e1e 100%);}
.login-right-blob1{position:absolute;width:70%;height:70%;top:-10%;right:-10%;background:radial-gradient(ellipse at 60% 40%,rgba(200,25,43,.38) 0%,transparent 65%);filter:blur(48px);animation:lbFloat 7s ease-in-out infinite alternate;}
.login-right-blob2{position:absolute;width:55%;height:55%;bottom:-5%;left:10%;background:radial-gradient(ellipse at 40% 60%,rgba(155,18,35,.28) 0%,transparent 65%);filter:blur(36px);animation:lbFloat 9s ease-in-out infinite alternate-reverse;}
.login-right-blob3{position:absolute;width:40%;height:40%;top:30%;left:20%;background:radial-gradient(ellipse at 50% 50%,rgba(80,80,80,.2) 0%,transparent 65%);filter:blur(28px);animation:lbFloat 6s ease-in-out infinite alternate;}
@keyframes lbFloat{0%{transform:translate(0,0) scale(1);}100%{transform:translate(12px,-14px) scale(1.06);}}
.login-right-content{position:relative;z-index:2;text-align:center;}
.login-right-content h2{font-size:52px;font-weight:900;color:#fff;line-height:1.05;letter-spacing:-1.5px;text-shadow:0 2px 24px rgba(0,0,0,.4);}
.login-right-content p{font-size:15px;color:rgba(255,255,255,.45);margin-top:10px;font-weight:400;}
/* Topnav direita (decorativa) */
.login-topnav{position:absolute;top:0;left:340px;right:0;height:64px;display:flex;align-items:center;justify-content:flex-end;padding:0 48px;gap:36px;z-index:3;}
.login-topnav a{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.35);text-decoration:none;cursor:default;}
/* Responsivo */
@media(max-width:640px){.login-right{display:none;}.login-left{width:100%;padding:28px 24px;}}
/* USERS MODAL */
.utbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:18px;}
.utbl th{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.4px;text-transform:uppercase;padding:6px 10px;text-align:left;border-bottom:1px solid var(--b);}
.utbl td{padding:9px 10px;border-bottom:1px solid var(--b);vertical-align:middle;}
.utbl tr:last-child td{border-bottom:none;}
.role-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;}
.role-admin{background:#fee2e2;color:#dc2626;}
.role-user{background:#e0e7ff;color:#4338ca;}
.role-portal{background:#dcfce7;color:#166534;}
.role-rep-br{background:#d1fae5;color:#065f46;}
.role-rep-pt{background:#ede9fe;color:#5b21b6;}
.add-user-form{background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:14px;}
.add-user-form .form-title{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:12px;}
/* POST FORMAT TAGS */
.t-fmt-feed{background:#e0f2fe;color:#0369a1;}
.t-fmt-reels{background:#fce7f3;color:#be185d;}
.t-fmt-stories{background:#f3e8ff;color:#7e22ce;}
.t-fmt-youtube{background:#fee2e2;color:#dc2626;}
.t-fmt-tiktok{background:#f1f1f1;color:#111;}
.t-fmt-linkedin{background:#e0e7ff;color:#0077b5;}
/* PORTAL */
.portal-wrap{height:100vh;overflow-y:auto;padding:28px 32px;background:var(--bg);box-sizing:border-box;}
.portal-header{margin-bottom:28px;}
.portal-title{font-size:22px;font-weight:800;color:var(--t1);margin-bottom:4px;}
.portal-subtitle{font-size:13px;color:var(--t3);}
.portal-section-label{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:12px;margin-top:24px;}
.portal-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:8px;}
.portal-card{background:var(--s1);border:1px solid var(--b);border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.portal-card-icon{font-size:22px;margin-bottom:10px;}
.portal-card-title{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:5px;}
.portal-card-desc{font-size:12px;color:var(--t2);line-height:1.6;}
.portal-links{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;}
.portal-link-btn{display:inline-flex;align-items:center;gap:20px;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:.12s;border:none;font-family:inherit;}
.portal-link-btn:hover{filter:brightness(.92);transform:translateY(-1px);}
/* Portal admin editor */
.portal-edit-card{background:var(--s1);border:1px solid var(--b);border-radius:10px;padding:14px;position:relative;}
.portal-edit-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;padding:3px 6px;border-radius:5px;}
.portal-edit-del:hover{background:#fee2e2;color:#dc2626;}
/* Portal drag-and-drop */
.portal-drag-handle{cursor:grab;color:var(--t3);font-size:16px;padding:2px 8px 2px 0;user-select:none;flex-shrink:0;line-height:1;align-self:flex-start;margin-top:12px;}
.portal-drag-handle:hover{color:var(--t2);}
.portal-drag-handle:active{cursor:grabbing;}
.portal-edit-card.pdragging{opacity:.3;border-style:dashed;}
.portal-edit-card.pdrag-over{border-color:var(--ac);border-width:2px;background:rgba(200,25,43,.03);}
/* Emoji picker */
.emoji-btn{width:44px;height:44px;border-radius:8px;border:1.5px solid var(--b);background:var(--s2);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:.1s;flex-shrink:0;}
.emoji-btn:hover{border-color:var(--ac);background:var(--s3);}
.emoji-picker{position:absolute;z-index:500;background:var(--s1);border:1px solid var(--b);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);width:300px;padding:12px;}
.emoji-picker-cats{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;}
.emoji-cat-btn{padding:3px 9px;border-radius:5px;border:none;background:var(--s2);color:var(--t2);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;transition:.1s;}
.emoji-cat-btn.on{background:var(--ac);color:#fff;}
.emoji-cat-btn:not(.on):hover{background:var(--s3);}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;}
.emoji-opt{width:32px;height:32px;border-radius:6px;border:none;background:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.1s;filter:grayscale(1) brightness(1.2);}
.emoji-opt:hover{background:var(--s2);transform:scale(1.2);filter:none;}
.portal-grid{display:flex;flex-wrap:wrap;gap:16px;margin-top:8px;justify-content:center;}
.portal-entry-card{background:var(--s1);border:1px solid var(--b);border-radius:14px;padding:22px;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden;width:280px;flex-shrink:0;}
.portal-entry-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.10);}
.portal-entry-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--card-color,#1c1c1c);}
.portal-entry-icon{font-size:28px;margin-top:8px;}
.portal-entry-name{font-size:11px;font-weight:700;color:var(--t3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}

// ── Rate Limiting ─────────────────────────
const _RL_KEY='kami_rl_v1', _RL_MAX=5, _RL_MS=30*60*1000;
function _rlGet(){try{return JSON.parse(localStorage.getItem(_RL_KEY))||{c:0,u:null};}catch{return{c:0,u:null};}}
function _rlSet(s){localStorage.setItem(_RL_KEY,JSON.stringify(s));}
function checkRateLimit(){const s=_rlGet();if(s.u&&Date.now()<s.u){const m=Math.ceil((s.u-Date.now())/60000);return{blocked:true,minutesLeft:m};}if(s.u&&Date.now()>=s.u)_rlSet({c:0,u:null});return{blocked:false};}
function recordFailedAttempt(){const s=_rlGet();const c=(s.c||0)+1;if(c>=_RL_MAX){_rlSet({c,u:Date.now()+_RL_MS});return{attemptsLeft:0};}else{_rlSet({c,u:null});return{attemptsLeft:_RL_MAX-c};}}
function clearAttempts(){localStorage.removeItem(_RL_KEY);}

}

      messages:[{role:'user',content:text}],

  if(!resp.ok){

    try{const e=await resp.json();msg=e.error?.message||msg;}catch(e2){}

  }
  const data=await resp.json();
  const raw=data.content[0].text.trim().replace(/^```(?:json)?\n?/,'').replace(/\n?```$/,'').trim();
  return JSON.parse(raw);
}

async function doLogin(email,pwd,remember){
  const limit=checkRateLimit();
  if(limit.blocked){AUTH.loginError=`Muitas tentativas. Tente novamente em ${limit.minutesLeft} min.`;render();return false;}
  try{
    const persistence=remember?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION;
    await _auth.setPersistence(persistence);
    const cred=await _auth.signInWithEmailAndPassword(email.trim(),pwd);
    clearAttempts();
    auditLog(cred.user.uid,'login',{email:email.trim()});
    return true;
  }catch(err){
    const {attemptsLeft}=recordFailedAttempt();
    const msgs={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail não encontrado.','auth/wrong-password':'Senha incorreta.','auth/too-many-requests':'Muitas tentativas. Aguarde e tente novamente.','auth/network-request-failed':'Erro de conexão.'};
    const base=msgs[err.code]||'Erro ao entrar. Tente novamente.';
    AUTH.loginError=attemptsLeft>0?`${base} (${attemptsLeft} tentativa${attemptsLeft>1?'s':''} restante${attemptsLeft>1?'s':''})`:base;
    render();return false;
  }
}

}

function genTempPwd(){
  const upper='ABCDEFGHJKLMNPQRSTUVWXYZ';
  const lower='abcdefghjkmnpqrstuvwxyz';
  const digits='23456789';
  const special='@#$!';
  const all=upper+lower+digits+special;
  const arr=new Uint8Array(12);
  crypto.getRandomValues(arr);
  let pwd=upper[arr[0]%upper.length]+lower[arr[1]%lower.length]+digits[arr[2]%digits.length]+special[arr[3]%special.length];
  for(let i=4;i<12;i++)pwd+=all[arr[i]%all.length];
  return pwd.split('').sort(()=>Math.random()-.5).join('');
}

_auth.onAuthStateChanged(async function(firebaseUser){

      if(snap.exists){
        const p=snap.data();
        AUTH.session={id:firebaseUser.uid,email:firebaseUser.email,name:p.name||firebaseUser.email,role:p.role||'user',access:p.access||[],mustChangePassword:!!p.mustChangePassword,avatar:p.avatar||'',birthdate:p.birthdate||'',workPhone:p.workPhone||'',mobilePhone:p.mobilePhone||'',city:p.city||'',department:p.department||'',position:p.position||'',supervisor:p.supervisor||''};
        AUTH.showLogin=false;
        setRolePipe(AUTH.session.role,AUTH.session.access);
        await load();
        startPublicationScheduler();
      } else {
        // Usuário no Auth mas sem perfil no Firestore — cria perfil básico
        const profile={name:firebaseUser.email,email:firebaseUser.email,role:'user',access:['dash','content','requests'],avatar:'',department:'',position:'',supervisor:'',birthdate:'',workPhone:'',mobilePhone:'',city:'',createdAt:firebase.firestore.FieldValue.serverTimestamp()};
        await _db.collection('users').doc(firebaseUser.uid).set(profile);
        AUTH.session={id:firebaseUser.uid,email:firebaseUser.email,name:firebaseUser.email,role:'user',access:['dash','content','requests'],mustChangePassword:false};
        AUTH.showLogin=false;
        setRolePipe('user',AUTH.session.access);
        await load();
        startPublicationScheduler();
      }
    }catch(e){console.error('onAuthStateChanged:',e);AUTH.showLogin=true;}
  } else {
    clearSession();
  }
  render();
});

function wsGetList(){try{const r=localStorage.getItem(KEY_WS_LIST);return r?JSON.parse(r):[{id:'default',name:'Principal'}];}catch(e){return[{id:'default',name:'Principal'}];}}
function wsGetActive(){try{return localStorage.getItem(KEY_WS_ACTIVE)||'default';}catch(e){return'default';}}
function wsSnapshotKeys(){return{cards:KEY1,requests:KEY2,social_posts:KEY_SOC_POST,social_accounts:KEY_SOC_ACC,portal_content:KEY_PORTAL,portal_dist_content:KEY_PORTAL_DIST,automations:KEY_AUTO};}

function wsSaveSnapshot(wsId){
  if(wsId==='default')return; // default usa as keys normais — sem blob
  const snap={};
  const keys=wsSnapshotKeys();
  Object.entries(keys).forEach(([field,k])=>{
    try{const v=localStorage.getItem(k);if(v)snap[field]=v;}catch(e){}
  });
  try{localStorage.setItem('kami-ws-data-'+wsId,JSON.stringify(snap));}catch(e){console.error(e);}
}

function wsLoadSnapshot(wsId){
  if(wsId==='default'){
    // Para default, as keys normais já têm os dados — não faz nada extra
    return;
  }
  try{
    const raw=localStorage.getItem('kami-ws-data-'+wsId);
    const snap=raw?JSON.parse(raw):{};
    const keys=wsSnapshotKeys();
    // Escreve nas keys normais os dados do workspace — load() vai ler delas
    Object.entries(keys).forEach(([field,k])=>{
      try{
        if(snap[field]!==undefined)localStorage.setItem(k,snap[field]);
        else localStorage.removeItem(k);
      }catch(e){}
    });
  }catch(e){console.error(e);}
}

function wsSwitchTo(wsId){
  const current=wsGetActive();
  if(current===wsId)return;
  wsSaveSnapshot(current);       // salva estado atual no workspace de saída
  try{localStorage.setItem(KEY_WS_ACTIVE,wsId);}catch(e){}
  wsLoadSnapshot(wsId);          // escreve dados do novo workspace nas keys normais
  // Recarrega dados do Firestore para o workspace
  load().then(()=>{
    S.pipe='home';
    S.modal={open:false,id:null,tab:'basic'};
    S.modal2={open:false,id:null,tab:'form',attachmentName:''};
    showToast(`Workspace "${(wsGetList().find(w=>w.id===wsId)||{name:wsId}).name}" carregado`,'ok');
    render();
  });
}

// ── SISTEMA DE NOTIFICAÇÕES ───────────────────────
const NOTIF_MAX=100;
const NOTIF_TTL_DAYS=30;

function pushNotif(type, message, extra={}){
  if(!S.notifications)S.notifications=[];
  const now=Date.now();
  // Evitar duplicatas recentes (mesmo tipo + cardId nos últimos 60s)
  const dup=S.notifications.find(n=>n.type===type&&n.cardId===extra.cardId&&(now-n.ts)<60000);
  if(dup)return;
  // Limpar notificações expiradas (> 30 dias) e manter máximo
  const cutoff=now-NOTIF_TTL_DAYS*86400000;
  S.notifications=S.notifications
    .filter(n=>n.ts>cutoff)          // remove antigas
    .slice(0,NOTIF_MAX-1);           // garante espaço para a nova
  S.notifications.unshift({id:uid(),type,message,read:false,ts:now,...extra});
  save_notif();
}

function notifAssigned(card, pipe='content'){
  const me=AUTH.session;
  if(!me)return;
  const responsible=card.responsible||[];
  // Notifica cada responsável (exceto quem fez a ação)
  responsible.filter(name=>name!==me.name).forEach(name=>{
    const u=AUTH.users.find(x=>x.name===name);
    if(u&&u.id){
      pushNotif('assigned',`Você foi atribuído ao card "${card.title||'Sem título'}"`,{
        cardId:card.id, pipe, targetUserId:u.id
      });
    }
  });
}

function checkDeadlineNotifs(){
  const me=AUTH.session;
  if(!me)return;
  const today=new Date();today.setHours(0,0,0,0);
  const tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);
  const todayStr=today.toISOString().slice(0,10);
  const tomorrowStr=tomorrow.toISOString().slice(0,10);
  const cards=[...(S.cards||[]),...(S.requests||[])];
  cards.forEach(c=>{
    const isResp=(c.responsible||[]).includes(me.name);
    if(!isResp)return;
    const done=['published','done','standby','rejected'].includes(c.status);
    if(done)return;
    const dates=[c.deliveryDate,c.avDate,c.publishDate,c.desiredDate].filter(Boolean);
    dates.forEach(d=>{
      if(d===todayStr)pushNotif('deadline',`Prazo hoje: "${c.title||c.requestTitle||'Sem título'}"`,{cardId:c.id,pipe:c.requestTitle?'requests':'content'});
      else if(d===tomorrowStr)pushNotif('deadline_soon',`Prazo amanhã: "${c.title||c.requestTitle||'Sem título'}"`,{cardId:c.id,pipe:c.requestTitle?'requests':'content'});
    });
  });
}

let _toastTimer=null,_toastDebounce=null;
function showToast(msg,type='ok',duration=1800){
  let el=document.getElementById('kami-toast');
  if(!el){el=document.createElement('div');el.id='kami-toast';document.body.appendChild(el);}
  el.className='toast-'+type;
  el.textContent=msg;
  // força reflow para reiniciar a transição
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),duration);
}
// Toast com botão Desfazer — para exclusões reversíveis
function showUndoToast(msg,onUndo,duration=5000){
  let el=document.getElementById('kami-toast');
  if(!el){el=document.createElement('div');el.id='kami-toast';document.body.appendChild(el);}
  el.className='toast-warn';
  el.innerHTML='';
  const span=document.createElement('span');span.textContent=msg;
  const btn=document.createElement('button');btn.className='toast-undo-btn';btn.textContent='Desfazer';
  btn.addEventListener('click',()=>{clearTimeout(_toastTimer);el.classList.remove('show');onUndo();});
  el.appendChild(span);el.appendChild(btn);
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),duration);
}

// ── COMPRESSÃO DE IMAGEM ──────────────
// Redimensiona via canvas antes de salvar em base64 — evita estourar a quota do localStorage.
// maxDim = maior lado em px. Usa WebP (suporta transparência); navegador sem suporte cai em PNG.
function compressImage(file,maxDim,cb){
  // Feedback imediato — fotos grandes levam ~1s para decodificar e comprimir
  if(file.size>300*1024)showToast('Processando imagem…','ok',10000);
  const _done=cb;
  cb=result=>{
    const el=document.getElementById('kami-toast');
    if(el&&el.textContent==='Processando imagem…')el.classList.remove('show');
    _done(result);
  };
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>maxDim||h>maxDim){
        const scale=maxDim/Math.max(w,h);
        w=Math.round(w*scale);h=Math.round(h*scale);
      }
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      let out=canvas.toDataURL('image/webp',0.85);
      if(!out.startsWith('data:image/webp'))out=canvas.toDataURL('image/png');
      // Se a compressão não ajudou (ex: PNG pequeno), mantém o original
      cb(out.length<ev.target.result.length?out:ev.target.result);
    };
    img.onerror=()=>cb(ev.target.result);
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

    const out=[];

    if(canAccess('content'))(S.cards||[]).forEach(c=>{

        out.push({type:'Solicit.',cls:'gs-type-req',label:rq.title||rq.orderType||'(sem título)',sub:rq.setor||'Solicitações',go:()=>{S.pipe='requests';S.modal2={open:true,id:rq.id,tab:'view',attachmentName:''};render();}});

        if(match(p.name))out.push({type:'Portal',cls:'gs-type-portal',label:p.name,sub:centralName,go:goPortal});
        const addItem=it=>{
          if(match(it.title)||match(it.desc)||(it.links||[]).some(l=>match(l.label)||match(l.url)))
            out.push({type:'Item',cls:'gs-type-portal',label:it.title||'(sem título)',sub:`${centralName} → ${p.name}`,go:goPortal});
        };
        (p.sections||[]).forEach(sec=>(sec.items||[]).forEach(addItem));
        (p.items||[]).forEach(addItem);
      });
    };
    scanCentral(S.portal_content,'portal','Central Interna');
    scanCentral(S.portal_dist_content,'portal-dist','Central Distribuidor');

  }
  function paint(){
    items=collect();sel=0;
    if(!input.value.trim()){results.innerHTML='<div class="gs-hint">Digite para buscar · ↑↓ navega · Enter abre · Esc fecha</div>';return;}
    if(!items.length){results.innerHTML='<div class="gs-hint">Nenhum resultado</div>';return;}
    results.innerHTML=items.map((it,i)=>`<div class="gs-item${i===0?' sel':''}" data-i="${i}"><span class="gs-type ${it.cls}">${it.type}</span><span class="gs-label">${esc(it.label)}</span><span class="gs-sub">${esc(it.sub)}</span></div>`).join('');
    results.querySelectorAll('.gs-item').forEach(el=>el.addEventListener('click',()=>{const it=items[parseInt(el.dataset.i)];gsClose();it.go();}));
  }
  input.addEventListener('input',paint);
  input.addEventListener('keydown',e=>{
    if(e.key==='Escape'){gsClose();return;}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(!items.length)return;
      sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
      const els=results.querySelectorAll('.gs-item');
      els.forEach((el,i)=>el.classList.toggle('sel',i===sel));
      els[sel]?.scrollIntoView({block:'nearest'});
    }
    if(e.key==='Enter'&&items.length){const it=items[sel];gsClose();it.go();}
  });
  input.focus();
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();gsOpen();}
});

function safeSave(key, data){
  const json=JSON.stringify(data);
  // Tenta localStorage primeiro
  try{
    localStorage.setItem(key,json);
    toastSaved();
    // Verifica uso após salvar
    const usage=getStorageUsage();
    if(usage.pct>=STORAGE_WARN_THRESHOLD&&!_storageWarnShown&&!_storageWarnDismissed){
      _storageWarnShown=true;
      console.warn(`[Storage] ${Math.round(usage.pct*100)}% usado (${Math.round(usage.used/1024)}KB / ${Math.round(usage.limit/1024)}KB)`);
      S._storageWarning=true;
      render();
    }
    return true;
  }catch(e){
    // localStorage cheio — tenta liberar cache e salvar de novo
    console.warn('[Storage] localStorage cheio, tentando liberar cache...');
    freeStorageCache();
    try{
      localStorage.setItem(key,json);
      toastSaved();
      return true;
    }catch(e2){
      // Último recurso: sessionStorage (persiste até fechar a aba)
      try{
        sessionStorage.setItem(key,json);
        console.warn('[Storage] Salvo em sessionStorage como fallback para '+key);
        showToast('⚠ Armazenamento cheio — salvo apenas até fechar a aba','warn',5000);
        S._storageWarning=true;
        S._storageFull=true;
        _storageWarnDismissed=false; // storage cheio é crítico
        render();
        return true;
      }catch(e3){
        console.error('[Storage] Falha total ao salvar '+key,e3);
        showToast('✕ Falha ao salvar — suas alterações não foram gravadas','err',6000);
        S._storageFull=true;
        _storageWarnDismissed=false;
        render();
        return false;
      }
    }
  }
}

    const {id,...data}=item;

function runAutomations(card, trigger, pipeline='content'){
  const rules=(S.automations||[]).filter(r=>r.active&&r.pipeline===pipeline&&r.trigger===trigger);
  let changed=false;
  rules.forEach(rule=>{
    // Check ALL conditions
    const match=rule.conditions.every(cond=>{
      const val=card[cond.field];
      switch(cond.operator){
        case 'equals': return Array.isArray(val)?val.includes(cond.value):val===cond.value;
        case 'not_equals': return Array.isArray(val)?!val.includes(cond.value):val!==cond.value;
        case 'contains': return String(val||'').toLowerCase().includes(String(cond.value).toLowerCase());
        case 'is_empty': return !val||val.length===0;
        default: return true;
      }
    });
    if(!match)return;
    // Execute actions
    rule.actions.forEach(action=>{
      switch(action.type){
        case 'assign_responsible':
          if(action.value&&!(card.responsible||[]).includes(action.value)){
            if(!card.responsible)card.responsible=[];
            card.responsible.push(action.value);
            changed=true;
          }
          break;
        case 'set_status':
          if(action.value&&card.status!==action.value){
            card.status=action.value;
            changed=true;
          }
          break;
        case 'set_project':
          if(action.value&&card.project!==action.value){
            card.project=action.value;
            changed=true;
          }
          break;
        case 'set_approver':
          if(action.value&&card.approver!==action.value){
            card.approver=action.value;
            changed=true;
          }
          break;
        case 'notify':
          (card.responsible||[]).forEach(name=>{
            const u=AUTH.users.find(x=>x.name===name);
            if(u)pushNotif('status',`Automação: card "${card.title||'Sem título'}" foi atualizado`,{cardId:card.id,pipe:pipeline,targetUserId:u.id});
          });
          break;
      }
    });
  });
  return changed;
}

function uid(){
  // Usa crypto.getRandomValues() para evitar colisões em criações simultâneas
  if(typeof crypto!=='undefined'&&crypto.getRandomValues){
    const arr=new Uint32Array(2);
    crypto.getRandomValues(arr);
    return Date.now().toString(36)+arr[0].toString(36)+arr[1].toString(36);
  }
  // Fallback para ambientes sem crypto
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6);
}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Sanitiza URLs para href — bloqueia javascript:, data:, vbscript: etc.
function safeUrl(u){if(!u)return'#';const t=String(u).trim();if(/^(https?:|mailto:|tel:)/i.test(t))return esc(t);if(/^[\w/#?.&=%-]/.test(t)&&!/^[a-z]+:/i.test(t))return esc(t);return'#';}
function rgbToHex(rgb){if(!rgb)return'';if(rgb.startsWith('#'))return rgb;const m=rgb.match(/\d+/g);if(!m||m.length<3)return'';return'#'+m.slice(0,3).map(n=>parseInt(n).toString(16).padStart(2,'0')).join('');}
function fdate(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}`;}
function fdatefull(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`;}
function gst(id){const s=getST1().find(s=>s.id===id)||ST[0];const cc=S.st_colors&&S.st_colors['1_'+s.id];return cc?{...s,color:cc}:s;}

function tcls(t){return{Reel:'t-r',Carrossel:'t-c','Estático':'t-s','Vídeo':'t-v',Storie:'t-st'}[t]||'t-s';}
function fcls(f){return{Topo:'t-top',Meio:'t-mid',Fundo:'t-bot'}[f]||'';}

// ── NAVEGAÇÃO COM HISTÓRICO (hash) ──────
// Sincroniza S.pipe/portal atual com location.hash — habilita voltar/avançar do navegador e favoritos.
let _hashUpdating=false;
function currentHash(){
  if(S.pipe==='portal'&&S.portal_current)return'#portal/'+S.portal_current;
  if(S.pipe==='portal-dist'&&S.portal_dist_current)return'#portal-dist/'+S.portal_dist_current;
  return'#'+S.pipe;
}
function syncHash(){
  if(!AUTH.session)return;
  const h=currentHash();
  if(location.hash!==h){
    _hashUpdating=true;
    location.hash=h;
    setTimeout(()=>{_hashUpdating=false;},0);
  }
}
function applyHash(){
  if(!AUTH.session)return false;
  const h=(location.hash||'').replace(/^#/,'');
  if(!h)return false;
  const[pipe,pid]=h.split('/');
  const valid=['home','dash','content','requests','social','portal','portal-dist','assets'];
  if(!valid.includes(pipe))return false;
  S.pipe=pipe;
  if(pipe==='portal')S.portal_current=pid||null;
  if(pipe==='portal-dist')S.portal_dist_current=pid||null;
  return true;
}
window.addEventListener('hashchange',()=>{
  if(_hashUpdating)return;
  if(applyHash())render();
});

function bindChangePwd(){
  const form=document.getElementById('changePwdForm');
  if(!form)return;
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const pwd=form.querySelector('[name="newpwd"]').value;
    const pwd2=form.querySelector('[name="newpwd2"]').value;
    const birthdate=form.querySelector('[name="birthdate"]')?.value||'';
    const state=(form.querySelector('[name="state"]')?.value?.trim()||'').toUpperCase();
    const city=form.querySelector('[name="city"]')?.value?.trim()||'';
    const workPhone=form.querySelector('[name="workPhone"]')?.value?.trim()||'';
    // Validações senha
    if(pwd.length<8){S._pwdChangeError='A senha deve ter pelo menos 8 caracteres.';render();return;}
    if(!/[A-Z]/.test(pwd)){S._pwdChangeError='A senha deve ter pelo menos uma letra maiúscula.';render();return;}
    if(!/[0-9]/.test(pwd)){S._pwdChangeError='A senha deve ter pelo menos um número.';render();return;}
    if(!/[^A-Za-z0-9]/.test(pwd)){S._pwdChangeError='A senha deve ter pelo menos um caractere especial.';render();return;}
    if(pwd!==pwd2){S._pwdChangeError='As senhas não coincidem.';render();return;}
    // Validações perfil
    if(!birthdate){S._pwdChangeError='Data de nascimento é obrigatória.';render();return;}
    if(!workPhone){S._pwdChangeError='Telefone de contato é obrigatório.';render();return;}
    if(!state){S._pwdChangeError='Estado é obrigatório.';render();return;}
    if(!city){S._pwdChangeError='Cidade é obrigatória.';render();return;}
    // Atualiza senha no Firebase Auth
    try{
      await _auth.currentUser.updatePassword(pwd);
    }catch(e){
      S._pwdChangeError='Erro ao atualizar senha: '+((e.code==='auth/requires-recent-login')?'Faça login novamente para alterar a senha.':e.message);
      render();return;
    }
    // Salva perfil no Firestore — sempre grava no Firestore independente do AUTH.users
    await _db.collection('users').doc(AUTH.session.id).update({mustChangePassword:false,birthdate,state,city,workPhone});
    const u=AUTH.users.find(x=>x.id===AUTH.session.id);
    if(u){
      u.mustChangePassword=false;
      u.birthdate=birthdate;
      u.state=state;
      u.city=city;
      u.workPhone=workPhone;
    }
    AUTH.session.mustChangePassword=false;
    S._pwdChangeError='';
    render();
  });
}

// ── PORTAL METRICS PANEL ─────────────────────────────────────────────────────
function renderPortalMetricsPanel(portal){
  if(!portal)return'';
  const metrics=S.portal_metrics||{};
  // Coleta todos os links do portal com seus cliques
  const rows=[];
  const scanItems=(items,secTitle)=>{
    (items||[]).forEach(item=>{
      (item.links||[]).filter(l=>l.url&&!l.url.startsWith('portal:')).forEach(link=>{
        const key=`${portal.id}|${item.title}|${link.label||'Acessar'}`;
        const m=metrics[key]||{count:0};
        rows.push({secTitle,itemTitle:item.title||'',linkLabel:link.label||'Acessar',url:link.url,count:m.count,lastAt:m.lastAt});
      });
    });
  };
  (portal.sections||[]).forEach(sec=>scanItems(sec.items,sec.title||'Geral'));
  scanItems(portal.items,'Geral');
  rows.sort((a,b)=>b.count-a.count);
  const total=rows.reduce((s,r)=>s+r.count,0);
  const fmtDate=ts=>ts?new Date(ts).toLocaleDateString('pt-BR'):'—';

  const exportMetrics=()=>{
    if(!rows.length)return;
    const header='Seção,Item,Link,URL,Cliques,Último acesso\n';
    const csv=header+rows.map(r=>[r.secTitle,r.itemTitle,r.linkLabel,r.url,r.count,fmtDate(r.lastAt)].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=`metricas-${portal.name||'portal'}.csv`;a.click();
  };
  // Expõe para o handler
  window._exportPortalMetrics=exportMetrics;

  return`<div style="background:var(--s1);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:20px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <div style="font-size:13px;font-weight:800;color:var(--t1);">📊 Métricas de acesso</div>
      <div style="font-size:11px;color:var(--t3);">${total} clique${total!==1?'s':''} total</div>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button data-action="portal-metrics-export" style="background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t2);padding:4px 11px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;">↓ CSV</button>
        <button data-action="portal-metrics-reset" data-pid="${portal.id}" style="background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t3);padding:4px 11px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;">Zerar</button>
        <button data-action="portal-metrics-close" style="background:none;border:none;color:var(--t3);font-size:18px;cursor:pointer;line-height:1;">×</button>
      </div>
    </div>
    ${rows.length===0
      ?`<div style="text-align:center;padding:24px;color:var(--t3);font-size:12px;">Nenhum clique registrado ainda. Os cliques em links deste portal aparecerão aqui.</div>`
      :`<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead><tr style="border-bottom:2px solid var(--b);">
          <th style="text-align:left;padding:6px 8px;color:var(--t3);font-weight:700;">Item</th>
          <th style="text-align:left;padding:6px 8px;color:var(--t3);font-weight:700;">Link</th>
          <th style="text-align:right;padding:6px 8px;color:var(--t3);font-weight:700;">Cliques</th>
          <th style="text-align:right;padding:6px 8px;color:var(--t3);font-weight:700;">Último</th>
        </tr></thead>
        <tbody>${rows.map((row,i)=>`<tr style="border-bottom:1px solid var(--b);background:${i%2===0?'transparent':'var(--s2)'};">
          <td style="padding:6px 8px;color:var(--t2);">${esc(row.itemTitle)}</td>
          <td style="padding:6px 8px;color:var(--t1);font-weight:600;">${esc(row.linkLabel)}</td>
          <td style="padding:6px 8px;text-align:right;">
            <span style="background:var(--ac)18;color:var(--ac);border-radius:10px;padding:2px 8px;font-weight:700;">${row.count}</span>
          </td>
          <td style="padding:6px 8px;text-align:right;color:var(--t3);">${fmtDate(row.lastAt)}</td>
        </tr>`).join('')}</tbody>
      </table></div>`}
  </div>`;
}

function renderPortalItemModal(){
  const m=S.portal_item_modal;

  const pc=_pc();
  const portal=pc.portals.find(p=>p.id===m.portalId);

  let existingItem={icon:'🔗',title:'',desc:'',color:portal.color||'#1c1c1c',links:[{label:'',url:''}]};

// ── PORTAL ──────────────────────────────
function renderPortal(){
  const realAdmin=AUTH.session&&AUTH.session.role==='admin';
  // Modo "ver como usuário": admin enxerga o portal sem nenhum controle de edição
  const isAdmin=realAdmin&&!S.portal_preview_mode;
  const pc=_pc();
  const allPortals=pc.portals||[];
  const access=getPortalAccess();
  // For dist portal: all non-hidden portals visible to admin; non-admins see their permitted portals
  const portals=_pns()
    ?(isAdmin?allPortals.filter(p=>!p.hidden):allPortals.filter(p=>!p.hidden&&canAccess('portal-dist')))
    :(access&&access.length)?allPortals.filter(p=>access.includes(p.id)&&!p.hidden):allPortals.filter(p=>!p.hidden);
  const currentId=_pcur();
  const editingId=_peid();

  // EDIT MODE — use allPortals to support hidden portals (marcas)
  if(editingId!==null&&isAdmin){
    const pidx=allPortals.findIndex(p=>p.id===editingId);
    const p=pidx>=0?allPortals[pidx]:null;
    if(!p)return`<div class="portal-wrap"><p style="color:var(--t3)">Portal não encontrado.</p></div>`;
    return`<div class="portal-wrap">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <button data-action="portal-cancel-edit" class="portal-back">← Voltar</button>
        <div style="font-size:14px;font-weight:800;color:var(--t1);">Editar portal</div>
        <button data-action="portal-delete" data-pid="${p.id}" class="btn btn-d" style="margin-left:auto;font-size:11px;font-family:inherit;">🗑 Excluir portal</button>
        <button data-action="portal-save-edit" class="btn btn-p" style="font-family:inherit;">Salvar</button>
      </div>
      <div style="background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:20px;display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;gap:12px;align-items:flex-end;">

              <div style="flex:1;">
              <div class="r2" style="margin-bottom:8px;">

                <div class="fg" style="max-width:200px;"><label>Cor dos botões</label><input class="pe-sec-item-color" data-si="${si}" data-ii="${ii}" value="${esc(item.color||p.color||'#1c1c1c')}" placeholder="#1c1c1c" style="max-width:120px;"></div>

                <div style="font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;">Links / Botões</div>

                  ${(item.links?.length?item.links:(item.url?[{label:'',url:item.url}]:[{label:'',url:''}])).map((link,li)=>`
                    <div style="display:flex;gap:5px;align-items:center;" data-li="${li}">
                      <input class="pe-sec-link-label" data-si="${si}" data-ii="${ii}" data-li="${li}" value="${esc(link.label||'')}" placeholder="Label (ex: Com Institucional)" style="flex:1;background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t1);padding:6px 10px;font-size:12px;font-family:inherit;outline:none;">
                      <input class="pe-sec-link-url" data-si="${si}" data-ii="${ii}" data-li="${li}" value="${esc(link.url||'')}" placeholder="https://..." style="flex:2;background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t1);padding:6px 10px;font-size:12px;font-family:inherit;outline:none;">

  }

  // PORTAL DETAIL VIEW — use allPortals to allow navigation to hidden portals (marcas)
  if(currentId){
    const p=allPortals.find(x=>x.id===currentId);
    if(!p)return`<div class="portal-wrap"><button data-action="portal-back" class="portal-back">← Voltar</button><p style="color:var(--t3)">Portal não encontrado.</p></div>`;
    return`<div class="portal-wrap">
      ${realAdmin&&S.portal_preview_mode?`<div style="display:flex;align-items:center;justify-content:center;gap:10px;background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:6px 12px;font-size:11px;color:#92400e;font-weight:600;margin-bottom:14px;">👁 Modo visualização — controles de edição ocultos<button data-action="portal-preview-toggle" style="background:#92400e;border:none;border-radius:5px;color:#fff;cursor:pointer;font-size:10px;font-weight:700;padding:3px 10px;font-family:inherit;">Sair</button></div>`:''}

        </div>`:''}
      </div>
      ${S.portal_metrics_open===p.id?renderPortalMetricsPanel(p):''}

      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:24px;">
        <div style="position:relative;width:72px;height:72px;flex-shrink:0;">
          <div style="width:72px;height:72px;border-radius:14px;background:${p.icon?.startsWith('img:')?'transparent':p.color+'18'};display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;">${p.icon?.startsWith('img:')?`<img src="${esc(p.icon.slice(4))}" style="width:72px;height:72px;object-fit:cover;">`:esc(p.icon||'🔗')}</div>
          ${isAdmin?`<label title="Trocar logo" style="position:absolute;bottom:2px;right:2px;background:rgba(0,0,0,.55);border-radius:5px;cursor:pointer;padding:3px 5px;line-height:1;display:flex;align-items:center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg><input type="file" accept="image/*" data-action="portal-header-logo" data-pid="${p.id}" style="display:none;"></label>`:''}
        </div>
        <div>
          <div style="font-size:18px;font-weight:800;color:var(--t1);">${esc(p.name)}</div>
          ${p.badge?`<div style="font-size:12px;color:var(--t3);">${esc(p.badge)}</div>`:''}
        </div>
      </div>

      ${p.sections&&p.sections.length?
        p.sections.map(sec=>{
          const items=sec.items||[];
          return`<div class="portal-section" style="--section-color:${p.color}">
            <div class="portal-section-title">${esc(sec.title)}</div>
            ${p.id.startsWith('marcas-')?(sec.logo?`<div style="background:#f7f5f2;border-radius:10px;overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:center;height:140px;position:relative;border:1px solid var(--b);">
              <img src="${esc(sec.logo)}" style="max-width:55%;max-height:110px;object-fit:contain;display:block;">
              ${isAdmin?`<button data-action="sec-logo-edit" data-pid="${p.id}" data-sid="${sec.id}" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);border:none;border-radius:5px;color:#fff;cursor:pointer;font-size:10px;padding:3px 8px;font-family:inherit;">✏️ Logo</button>`:''}
            </div>`:(isAdmin?`<div style="border:2px dashed var(--b);border-radius:10px;height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-bottom:16px;cursor:pointer;background:var(--s2);" data-action="sec-logo-edit" data-pid="${p.id}" data-sid="${sec.id}">
              <div style="font-size:20px;opacity:.4;">🖼</div>
              <div style="font-size:11px;color:var(--t3);">Clique para adicionar logo da marca</div>

            <div class="portal-items-grid">
              ${items.map((item,ii)=>{const itemLinks=item.links?.length?item.links:(item.url?[{label:'',url:item.url}]:[]);return`<div class="portal-item-card">
                ${isAdmin?`<button class="portal-item-dots" data-action="pim-open" data-pid="${p.id}" data-sid="${sec.id}" data-ii="${ii}" title="Editar">⋯</button>`:''}
                <div style="display:flex;align-items:center;gap:6px;justify-content:space-between;">
                  <div class="portal-item-title">${esc(item.title||'')}</div>
                  ${item.syncId?`<span style="font-size:8px;color:var(--t3);flex-shrink:0;" title="Item sincronizado">🔄</span>`:''}
                </div>
                ${item.desc?`<div class="portal-item-desc">${esc(item.desc)}</div>`:''}
                ${itemLinks.filter(l=>l.url).length?`<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">${itemLinks.filter(l=>l.url).map(link=>{const isInternal=link.url.startsWith('portal:');const portalId=isInternal?link.url.slice(7):'';const btnColor=esc(item.color||p.color||'#1c1c1c');const iconHtml=renderLinkIcon(link.icon||'');const iconBox=iconHtml?`<span style="background:${btnColor};border-radius:6px 0 0 6px;padding:0 9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-right:1px solid rgba(255,255,255,.15);">${iconHtml}</span>`:'';const labelPart=`${link.label||'Acessar'} →`;const wrapStyle=`display:flex;align-items:stretch;border-radius:6px;overflow:hidden;`;return isInternal?`<div style="${wrapStyle}">${iconBox}<button data-action="portal-open" data-pid="${portalId}" class="portal-item-link" style="background:${btnColor};border:none;cursor:pointer;font-family:inherit;border-radius:${iconHtml?'0 6px 6px 0':'6px'};flex:1;">${labelPart}</button></div>`:`<div style="${wrapStyle}">${iconBox}<a href="${safeUrl(link.url)}" target="_blank" rel="noopener noreferrer" class="portal-item-link" style="background:${btnColor};border-radius:${iconHtml?'0 6px 6px 0':'6px'};flex:1;">${labelPart}</a></div>`;}).join('')}</div>`:''}
              </div>`;}).join('')}

        `<div class="portal-items-grid">
          ${p.items.map(item=>{const itemLinks=item.links?.length?item.links:(item.url?[{label:'',url:item.url}]:[]);return`<div class="portal-item-card">
            <div class="portal-item-title">${esc(item.title||'')}</div>
            ${item.desc?`<div class="portal-item-desc">${esc(item.desc)}</div>`:''}
            ${itemLinks.filter(l=>l.url).length?`<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">${itemLinks.filter(l=>l.url).map(link=>{const btnColor=esc(item.color||p.color||'#1c1c1c');const iconHtml=renderLinkIcon(link.icon||'');const iconBox=iconHtml?`<span style="background:${btnColor};border-radius:6px 0 0 6px;padding:0 9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-right:1px solid rgba(255,255,255,.15);">${iconHtml}</span>`:'';return`<div style="display:flex;align-items:stretch;border-radius:6px;overflow:hidden;">${iconBox}<a href="${safeUrl(link.url)}" target="_blank" rel="noopener noreferrer" class="portal-item-link" style="background:${btnColor};border-radius:${iconHtml?'0 6px 6px 0':'6px'};flex:1;">${link.label||'Acessar'} →</a></div>`;}).join('')}</div>`:''}
          </div>`}).join('')}
        </div>`
        :`<div style="font-size:12px;color:var(--t3);padding:32px 0;text-align:center;">${isAdmin
          ?`<div style="font-size:13px;margin-bottom:10px;">Este portal ainda não tem itens.</div><button class="btn btn-p" data-action="portal-edit" data-pid="${p.id}" style="font-size:11px;padding:6px 14px;">✏️ Editar portal e adicionar itens</button>`
          :`<div style="font-size:13px;">O conteúdo deste portal está sendo preparado.</div><div style="font-size:11px;margin-top:4px;">Volte em breve ou fale com a equipe de marketing.</div>`}</div>`
      )}
    </div>`;
  }

  // PORTAL GERAL — grid of portals

  return`<div class="portal-wrap">
    ${realAdmin&&!_pns()?`<div style="display:flex;justify-content:space-between;align-items:center;max-width:960px;margin:0 auto 4px;">

      <button data-action="news-dist-open" style="background:var(--s1);border:1px solid var(--b);border-radius:8px;color:var(--t2);cursor:pointer;font-size:12px;font-weight:600;padding:6px 14px;font-family:inherit;display:flex;align-items:center;gap:6px;">📰 Central de Notícias <span style="background:#c8192b;color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;">${(S.news_dist||[]).length}</span></button>
      ${S.portal_preview_mode
        ?`<div style="display:flex;align-items:center;gap:10px;background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:6px 12px;font-size:11px;color:#92400e;font-weight:600;">👁 Modo visualização<button data-action="portal-preview-toggle" style="background:#92400e;border:none;border-radius:5px;color:#fff;cursor:pointer;font-size:10px;font-weight:700;padding:3px 10px;font-family:inherit;">Sair</button></div>`
