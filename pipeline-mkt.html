// ── AUTOMATIONS MODAL ───────────────────
function renderAutomationsModal(){
  if(!S.show_automations)return'';
  const rules=S.automations||[];
  const triggerLabels={create:'Ao criar card',status_change:'Ao mudar status',any_save:'A cada salvamento'};
  const fieldLabels={project:'Projeto',format:'Formato',status:'Status',channel:'Canal',funnel:'Funil',bizUnit:'Unidade de Negócio'};
  const opLabels={equals:'igual a',not_equals:'diferente de',contains:'contém',is_empty:'está vazio'};
  const actionLabels={assign_responsible:'Atribuir responsável',set_status:'Definir status',set_project:'Definir projeto',set_approver:'Definir aprovador',notify:'Notificar responsáveis'};
  const actionIcons={assign_responsible:'👤',set_status:'🔄',set_project:'📁',set_approver:'✅',notify:'🔔'};
  const triggerIcons={create:'✨',status_change:'🔄',any_save:'💾'};

  const ruleCard=rule=>{
    const cond=(rule.conditions||[])[0]||{};
    const act=(rule.actions||[])[0]||{};
    return`<div style="background:var(--s1);border:1px solid var(--b);border-left:3px solid ${rule.active?'#22c55e':'#d1d5db'};border-radius:10px;padding:14px 16px;margin-bottom:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span style="font-size:13px;font-weight:700;color:var(--t1);">${esc(rule.name||'Sem nome')}</span>
          <span style="background:${rule.active?'#dcfce7':'#f3f4f6'};color:${rule.active?'#166534':'#6b7280'};font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;">${rule.active?'● Ativa':'○ Inativa'}</span>
          <span style="font-size:10px;color:var(--t3);">${rule.pipeline==='content'?'Conteúdo':'Solicitações'}</span>
        </div>
        <div style="display:flex;gap:4px;">
          <label style="display:flex;align-items:center;cursor:pointer;" title="${rule.active?'Desativar':'Ativar'}">
            <input type="checkbox" data-action="auto-toggle" data-id="${rule.id}" ${rule.active?'checked':''} style="accent-color:#22c55e;cursor:pointer;width:14px;height:14px;">
          </label>
          <button data-action="auto-del" data-id="${rule.id}" style="background:none;border:1px solid var(--b);border-radius:5px;color:var(--t3);cursor:pointer;font-size:10px;padding:3px 7px;font-family:inherit;">✕</button>
        </div>
      </div>
      <!-- Visual flow -->
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <div style="background:#e0e7ff;color:#4338ca;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;">${triggerIcons[rule.trigger]||'⚡'} ${triggerLabels[rule.trigger]||rule.trigger}</div>
        ${cond.field?`<span style="font-size:10px;color:var(--t3);font-weight:600;">SE</span>
        <div style="background:#fef9c3;color:#854d0e;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;">${fieldLabels[cond.field]||cond.field} ${opLabels[cond.operator]||cond.operator}${cond.operator!=='is_empty'?` "${esc(cond.value)}"`:''}</div>`:''}
        <span style="font-size:14px;color:var(--t3);">→</span>
        <div style="background:#dcfce7;color:#166534;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;">${actionIcons[act.type]||'⚡'} ${actionLabels[act.type]||act.type}${act.value?`: "${esc(act.value)}"`:''}</div>
      </div>
    </div>`;
  };

  const sel=(id,opts,placeholder='')=>`<select id="${id}" style="width:100%;background:var(--s1);border:1px solid var(--b);border-radius:6px;color:var(--t1);padding:7px 10px;font-size:12px;font-family:inherit;outline:none;">
    ${placeholder?`<option value="">${placeholder}</option>`:''}
    ${opts.map(o=>`<option value="${o.v}">${o.l}</option>`).join('')}
  </select>`;

  const teamOpts=getTeam().map(t=>({v:t.name,l:t.name}));
  const statusOpts=ST.map(s=>({v:s.id,l:s.label}));
  const projOpts=allProjects().map(p=>({v:p,l:p}));
  const fieldOpts=[{v:'project',l:'📁 Projeto'},{v:'status',l:'🔄 Status'},{v:'format',l:'🎨 Formato'},{v:'channel',l:'📱 Canal'},{v:'funnel',l:'🎯 Funil'}];
  const opOpts=[{v:'equals',l:'é igual a'},{v:'not_equals',l:'é diferente de'},{v:'contains',l:'contém'},{v:'is_empty',l:'está vazio'}];
  const actionOpts=[{v:'assign_responsible',l:'👤 Atribuir responsável'},{v:'set_status',l:'🔄 Definir status'},{v:'set_project',l:'📁 Definir projeto'},{v:'set_approver',l:'✅ Definir aprovador'},{v:'notify',l:'🔔 Notificar responsáveis'}];

  return`<div class="overlay" id="auto-overlay" style="z-index:1100;">
    <div class="modal" style="max-width:620px;">
      <div class="mhead">
        <div class="mhead-t">⚡ Automações</div>
        <button class="mclose" data-action="close-auto">×</button>
      </div>
      <div class="mbody" style="max-height:72vh;overflow-y:auto;">

        <!-- Regras existentes -->
        ${rules.length===0?`<div style="text-align:center;padding:28px 0 20px;color:var(--t3);">
          <div style="font-size:32px;margin-bottom:8px;">⚡</div>
          <div style="font-size:13px;font-weight:600;color:var(--t2);margin-bottom:4px;">Nenhuma automação criada</div>
          <div style="font-size:11px;">Crie regras para automatizar atribuições, status e aprovações.</div>
        </div>`:rules.map(ruleCard).join('')}

        <!-- Builder visual -->
        <div style="background:var(--s2);border:1px solid var(--b);border-radius:12px;padding:18px;margin-top:4px;">
          <div style="font-size:12px;font-weight:800;color:var(--t1);margin-bottom:16px;">➕ Nova automação</div>

          <!-- Nome + Pipeline -->
          <div class="r2" style="margin-bottom:14px;">
            <div class="fg"><label>Nome</label><input type="text" id="auto-name" placeholder="Ex: Auto-atribuir no KAMI BR" style="background:var(--s1);border:1px solid var(--b);border-radius:6px;color:var(--t1);padding:7px 10px;font-size:12px;font-family:inherit;outline:none;width:100%;box-sizing:border-box;"></div>
            <div class="fg"><label>Pipeline</label>${sel('auto-pipeline',[{v:'content',l:'Conteúdo Redes Sociais'},{v:'requests',l:'Solicitações Externas'}])}</div>
          </div>

          <!-- QUANDO (Gatilho) -->
          <div style="background:var(--s1);border:1px solid #c7d2fe;border-radius:10px;padding:14px;margin-bottom:10px;">
            <div style="font-size:10px;font-weight:800;color:#4338ca;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;">⚡ Quando</div>
            ${sel('auto-trigger',[{v:'create',l:'✨ Ao criar card'},{v:'status_change',l:'🔄 Ao mudar status'},{v:'any_save',l:'💾 A cada salvamento'}])}
          </div>

          <!-- SE (Condição) -->
          <div style="background:var(--s1);border:1px solid #fde68a;border-radius:10px;padding:14px;margin-bottom:10px;">
            <div style="font-size:10px;font-weight:800;color:#854d0e;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;">❓ Se (condição opcional)</div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
              <div>${sel('auto-cond-field',fieldOpts,'Qualquer campo')}</div>
              <div>${sel('auto-cond-op',opOpts)}</div>
              <div><input type="text" id="auto-cond-val" placeholder="Valor..." style="width:100%;background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t1);padding:7px 10px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box;"></div>
            </div>
          </div>

          <!-- ENTÃO (Ação) -->
          <div style="background:var(--s1);border:1px solid #bbf7d0;border-radius:10px;padding:14px;margin-bottom:14px;">
            <div style="font-size:10px;font-weight:800;color:#166534;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;">✅ Então</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
              <div id="auto-action-wrap">${sel('auto-action-type',actionOpts)}</div>
              <div id="auto-action-val-wrap">
                <select id="auto-action-val-sel" style="width:100%;background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t1);padding:7px 10px;font-size:12px;font-family:inherit;outline:none;">
                  <option value="">Selecionar...</option>
                  ${teamOpts.map(o=>`<option value="${o.v}">${o.l}</option>`).join('')}
                </select>
              </div>
            </div>
          </div>

          <button data-action="auto-save" class="btn btn-p" style="font-family:inherit;width:100%;font-size:12px;padding:9px;">⚡ Criar automação</button>
        </div>
      </div>
      <div class="mfoot">
        <button class="btn btn-o" data-action="close-auto">Fechar</button>
      </div>
    </div>
  </div>`;
}

function renderPipelineAll(){
  const statusColors={
    'A Fazer':'#6366f1','Em Andamento':'#f59e0b','Em Revisão':'#06b6d4','Concluído':'#22c55e',
    'Triagem':'#8b5cf6','Aguardando Info':'#f97316','Concluída':'#22c55e'
  };
  const search=(S.pall_search||'').toLowerCase();

  const contentCards=(S.cards||[]).map(c=>({
    id:c.id, origem:'Conteúdo', origemColor:'#16a34a',
    titulo:c.title||'(sem título)', projeto:c.project||'—',
    status:c.status||'A Fazer', responsavel:c.responsible||'—',
    prazo:c.deadline||'', formato:c.format||'—',
    _raw:c
  }));

  const requestCards=(S.requests||[]).map(r=>({
    id:r.id, origem:'Solicitação', origemColor:'#d97706',
    titulo:r.title||r.orderType||'(sem título)', projeto:r.setor||r.project||'—',
    status:r.status||'Triagem', responsavel:r.responsible||'—',
    prazo:r.deadline||r.dueDate||'', formato:r.orderType||'—',
    _raw:r
  }));

  let all=[...contentCards,...requestCards];
  if(search) all=all.filter(x=>
    x.titulo.toLowerCase().includes(search)||
    x.projeto.toLowerCase().includes(search)||
    x.status.toLowerCase().includes(search)||
    x.responsavel.toLowerCase().includes(search)
  );

  // sort
  const sortKey=S.pall_sort||'origem';
  const sortDir=S.pall_dir||1;
  all.sort((a,b)=>(a[sortKey]||'').toString().localeCompare((b[sortKey]||'').toString())*sortDir);

  const thStyle=`padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--b);cursor:grab;user-select:none;`;
  const sd=(k)=>S.pall_sort===k?(S.pall_dir===1?'↑':'↓'):'↕';
  const COLS_ALL=[
    {key:'origem',     th:`<th data-col-key="origem" draggable="true" style="${thStyle}"><span data-pall-sort="origem" style="cursor:pointer;">Origem ${sd('origem')}</span></th>`,
     td:x=>`<td style="padding:10px 14px;white-space:nowrap;"><span style="background:${x.origemColor}18;color:${x.origemColor};font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;">${x.origem}</span></td>`},
    {key:'titulo',     th:`<th data-col-key="titulo" draggable="true" style="${thStyle}"><span data-pall-sort="titulo" style="cursor:pointer;">Título ${sd('titulo')}</span></th>`,
     td:x=>`<td style="padding:10px 14px;font-weight:600;color:var(--t1);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(x.titulo)}</td>`},
    {key:'projeto',    th:`<th data-col-key="projeto" draggable="true" style="${thStyle}"><span data-pall-sort="projeto" style="cursor:pointer;">Projeto / Setor ${sd('projeto')}</span></th>`,
     td:x=>`<td style="padding:10px 14px;color:var(--t2);">${esc(x.projeto)}</td>`},
    {key:'status',     th:`<th data-col-key="status" draggable="true" style="${thStyle}"><span data-pall-sort="status" style="cursor:pointer;">Status ${sd('status')}</span></th>`,
     td:x=>`<td style="padding:10px 14px;white-space:nowrap;"><span style="background:${(statusColors[x.status]||'#6b7280')}18;color:${statusColors[x.status]||'#6b7280'};font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;">${esc(x.status)}</span></td>`},
    {key:'responsavel',th:`<th data-col-key="responsavel" draggable="true" style="${thStyle}"><span data-pall-sort="responsavel" style="cursor:pointer;">Responsável ${sd('responsavel')}</span></th>`,
     td:x=>`<td style="padding:10px 14px;color:var(--t2);">${esc(x.responsavel)}</td>`},
    {key:'prazo',      th:`<th data-col-key="prazo" draggable="true" style="${thStyle}"><span data-pall-sort="prazo" style="cursor:pointer;">Prazo ${sd('prazo')}</span></th>`,
     td:x=>`<td style="padding:10px 14px;color:var(--t2);white-space:nowrap;">${x.prazo?new Date(x.prazo).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}):'-'}</td>`},
    {key:'formato',    th:`<th data-col-key="formato" draggable="true" style="${thStyle}"><span data-pall-sort="formato" style="cursor:pointer;">Formato / Tipo ${sd('formato')}</span></th>`,
     td:x=>`<td style="padding:10px 14px;color:var(--t2);">${esc(x.formato)}</td>`},
  ];
  const uid=(AUTH.session&&AUTH.session.email)||'default';
  let colOrderAll=[];try{colOrderAll=JSON.parse(localStorage.getItem('kami-col-pall-'+uid)||'[]');}catch(e){}
  const cols=colOrderAll.length
    ?[...colOrderAll.map(k=>COLS_ALL.find(c=>c.key===k)).filter(Boolean),...COLS_ALL.filter(c=>!colOrderAll.includes(c.key))]
    :COLS_ALL;

  return`<div style="padding:28px 32px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
      <div>
        <div style="font-size:10px;color:var(--ac);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:3px;">Pipeline</div>
        <div style="font-size:20px;font-weight:900;color:var(--t1);letter-spacing:-.3px;">Visão Geral</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="position:relative;">
          <input id="pall-search" type="text" placeholder="Buscar..." value="${esc(S.pall_search||'')}"
            style="background:var(--s1);border:1px solid var(--b);border-radius:8px;padding:7px 12px 7px 32px;font-size:12px;color:var(--t1);width:200px;font-family:inherit;outline:none;">
          <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:13px;">🔍</span>
        </div>
        <div style="font-size:12px;color:var(--t3);">${all.length} item${all.length!==1?'s':''}</div>
      </div>
    </div>
    <div style="flex:1;overflow:auto;border:1px solid var(--b);border-radius:12px;background:var(--s1);">
      <table id="ltbl-pall" style="width:100%;border-collapse:collapse;font-size:12px;">
        <thead><tr style="background:var(--s2);position:sticky;top:0;z-index:1;">${cols.map(c=>c.th).join('')}</tr></thead>
        <tbody>${all.length===0?`<tr><td colspan="${cols.length}" style="text-align:center;padding:60px;color:var(--t3);">Nenhum item encontrado</td></tr>`
          :all.map(x=>`<tr data-pall-open="${x.origem==='Conteúdo'?'content':'requests'}" data-pall-id="${x.id}"
              style="border-bottom:1px solid var(--b);cursor:pointer;transition:background .1s;"
              onmouseover="this.style.background='var(--s2)'" onmouseout="this.style.background=''">${cols.map(col=>col.td(x)).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

  };

    {pipe:'content', icon:HI.content,    color:'#16a34a', label:'Conteúdo',     desc:'Pipeline de publicações',   bg:'#f0fdf4', show: isAdmin||canAccess('content')},
    {pipe:'social',  icon:HI.social,     color:'#db2777', label:'Programações', desc:'Calendário e agendamentos', bg:'#fdf2f8', show: isAdmin||canAccess('social')},
    {pipe:'portal',  icon:HI.portal,     color:'#475569', label:'Central Interna',      desc:'Portais e acessos KAMI CO.',bg:'#f1f5f9', show: isAdmin||canAccess('portal-geral')||canAccess('portal-rep-br')||canAccess('portal-rep-pt')},
    {pipe:'portal-dist', icon:HI.portaldist, color:'#b45309', label:'Central Distribuidores', desc:'Portais de acesso para distribuidores.', bg:'#fffbeb', show: isAdmin||canAccess('portal-dist')},
  ].filter(m=>m.show);

  const frases=[
    {t:'Lembre-se do porquê você começou. Disciplina constrói o que a motivação apenas começa.',a:'KAMI CO.'},
    {t:'Pessoas comprometidas crescem. Equipes comprometidas vencem. Sua entrega hoje constrói resultados em todas as áreas da sua vida.',a:'KAMI CO.'},
    {t:'Desenvolver é acreditar que cada pessoa pode ir além. E juntos, vamos mais longe!',a:'KAMI CO.'},
    {t:'O impacto real nasce da união entre propósito e ação. Desenvolver pessoas e, por meio delas, transformar negócios que gerem impacto real para o mundo.',a:'KAMI CO.'},
    {t:'O propósito não é o que você faz — é o porquê você faz. E esse porquê muda tudo.',a:'Simon Sinek'},
    {t:'Não se trata de ser o melhor. Trata-se de ser melhor do que você era ontem.',a:'Simon Sinek'},
    {t:'A humildade não é pensar menos de si mesmo, mas pensar menos em si mesmo.',a:'C.S. Lewis'},
    {t:'O maior entre vocês será o servo de todos.',a:'Mateus 23:11'},
    {t:'Quem quer ser o primeiro entre vocês deve ser servo de todos.',a:'Marcos 10:44'},
    {t:'Não faça nada por ambição egoísta ou por vaidade, mas com humildade considerem os outros superiores a vocês mesmos.',a:'Filipenses 2:3'},
    {t:'Protagonismo não é aparecer — é responder. É ver o que precisa ser feito e fazer, sem esperar ser chamado.',a:'KAMI CO.'},
    {t:'A transparência não fragiliza — ela constrói a confiança que sustenta tudo o mais.',a:'KAMI CO.'},
    {t:'Integridade é fazer a coisa certa, mesmo quando ninguém está olhando.',a:'C.S. Lewis'},
    {t:'Aquilo que fazemos para nós mesmos morre conosco. Aquilo que fazemos pelos outros permanece.',a:'Albert Pike'},
    {t:'Cada pessoa que você encontra está lutando uma batalha que você não conhece. Seja gentil, sempre.',a:'Platão'},
    {t:'Tratai os outros como gostaríeis de ser tratados.',a:'Lucas 6:31'},
    {t:'Comprometei-vos com o Senhor em tudo o que fazeis, e ele vos ajudará a ter êxito.',a:'Provérbios 16:3'},
    {t:'Tudo o que fizerem, façam de todo o coração, como para o Senhor, e não para os homens.',a:'Colossenses 3:23'},
    {t:'O respeito pelo indivíduo começa quando você reconhece que toda pessoa carrega um propósito único.',a:'KAMI CO.'},
    {t:'Servir não é uma posição de fraqueza — é o ato mais poderoso de liderança que existe.',a:'KAMI CO.'},
  ];
  const now=new Date();
  const dayOfYear=Math.floor((now-(new Date(now.getFullYear(),0,0)))/86400000);
  const fr=frases[(now.getFullYear()*366+dayOfYear)%frases.length];
  const frase=fr.t;
  const fraseAutor=fr.a;
  const dias=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const dataStr=`${dias[now.getDay()]}, ${now.getDate()} de ${meses[now.getMonth()]} de ${now.getFullYear()}`;

  // --- dados para bloco de notícias ---
  const todayStr=now.toISOString().slice(0,10);

  const thisMonth=now.getMonth();const thisYear=now.getFullYear();

      .filter(([d])=>d&&d>=todayStr),
    ...(S.requests||[]).filter(r=>!['done','rejected'].includes(r.status)&&r.desiredDate&&r.desiredDate>=todayStr)
      .map(r=>[r.desiredDate,'📥 Solicitação',r.requestTitle||r.title])
  ].filter(([d])=>{const dt=new Date(d+'T00:00:00');return dt.getMonth()===thisMonth&&dt.getFullYear()===thisYear;})
   .sort((a,b)=>a[0].localeCompare(b[0]));
  const nextDeadline=allDeadlines[0]||null;

  // Último arquivo atualizado no portal
  const allPortalItems=(()=>{
    const portals=JSON.parse(localStorage.getItem('kami-portal-content-v1')||'[]');
    let latest=null;let latestTs=0;
    portals.forEach(p=>{
      const items=[...(p.items||[]),...(p.sections||[]).flatMap(s=>s.items||[])];

            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:28px;height:2px;background:var(--ac);border-radius:2px;flex-shrink:0;"></div>

          <!-- Botões de módulo empilhados (draggable) -->
          ${(()=>{

}

function renderNotifPanel(){
  if(!S.notifications_open)return'';
  const me=AUTH.session;
  if(!me)return'';
  // Filtra notificações do usuário logado (targetUserId ou admin vê tudo)
  const myNotifs=me.role==='admin'
    ?S.notifications
    :S.notifications.filter(n=>!n.targetUserId||n.targetUserId===me.id);
  const fts=ts=>{
    const d=new Date(ts);const now=Date.now();const diff=now-ts;
    if(diff<60000)return'agora';
    if(diff<3600000)return Math.floor(diff/60000)+'min atrás';
    if(diff<86400000)return Math.floor(diff/3600000)+'h atrás';
    return d.toLocaleDateString('pt-BR');
  };
  const nFilter=S.notif_filter||'all';
  const NOTIF_GROUPS={all:'Todas',deadline:'Prazos',status:'Status',comment:'Comentários',assigned:'Atribuídos'};
  const filtered=nFilter==='all'?myNotifs:myNotifs.filter(n=>{
    if(nFilter==='deadline')return n.type==='deadline'||n.type==='deadline_soon';
    return n.type===nFilter;
  });
  const unreadFiltered=filtered.filter(n=>!n.read).length;

  return`<div id="notif-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div id="notif-panel" style="width:100%;max-width:560px;max-height:80vh;background:var(--s1);border:1px solid var(--b);border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden;">
    <div style="padding:12px 16px 10px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:13px;font-weight:800;color:var(--t1);">Notificações${unreadFiltered>0?` <span style="background:var(--ac);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:800;">${unreadFiltered}</span>`:''}</span>
      <div style="display:flex;gap:6px;align-items:center;">
        ${filtered.some(n=>!n.read)?`<button id="notif-read-all" style="font-size:10px;color:var(--ac);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;">Lidas</button>`:''}
        ${me.role==='admin'&&myNotifs.length>0?`<button id="notif-clear-all" style="font-size:10px;color:var(--t3);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;">Limpar</button>`:''}
        <button id="notif-close" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:18px;padding:0;">×</button>
      </div>
    </div>
    <div style="display:flex;gap:0;border-bottom:1px solid var(--b);overflow-x:auto;flex-shrink:0;">
      ${Object.entries(NOTIF_GROUPS).map(([k,l])=>{
        const cnt=k==='all'?myNotifs.filter(n=>!n.read).length:myNotifs.filter(n=>!n.read&&(k==='deadline'?(n.type==='deadline'||n.type==='deadline_soon'):n.type===k)).length;
        return`<button data-notif-filter="${k}" style="padding:7px 12px;border:none;background:none;font-size:10px;font-weight:700;color:${nFilter===k?'var(--ac)':'var(--t3)'};cursor:pointer;font-family:inherit;border-bottom:2px solid ${nFilter===k?'var(--ac)':'transparent'};white-space:nowrap;flex-shrink:0;">${l}${cnt>0?` <span style="background:${nFilter===k?'var(--ac)':'var(--b)'};color:${nFilter===k?'#fff':'var(--t2)'};border-radius:10px;padding:0 5px;font-size:9px;">${cnt}</span>`:''}</button>`;
      }).join('')}
    </div>
    <div style="overflow-y:auto;flex:1;">
      ${filtered.length===0
        ?`<div style="padding:32px;text-align:center;color:var(--t3);">
            <div style="font-size:28px;margin-bottom:8px;">🔔</div>
            <div style="font-size:12px;font-weight:600;">${nFilter==='all'?'Tudo em dia':'Nenhuma notificação nessa categoria'}</div>
            ${nFilter==='all'?`<div style="font-size:11px;margin-top:4px;">Você será avisado aqui sobre comentários,<br>menções e mudanças de status.</div>`:''}
          </div>`
        :filtered.map(n=>`
          <div class="notif-item" data-notif-id="${n.id}" data-pipe="${n.pipe||''}" data-card-id="${n.cardId||''}"
            style="display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-bottom:1px solid var(--b);cursor:pointer;background:${n.read?'transparent':'var(--ac)08'};transition:background .12s;"
            onmouseover="this.style.background='var(--s2)'" onmouseout="this.style.background='${n.read?'transparent':'var(--ac)08'}'">
            <div style="width:30px;height:30px;border-radius:50%;background:${NOTIF_COLORS[n.type]||NOTIF_COLORS.default}20;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;">${NOTIF_ICONS[n.type]||NOTIF_ICONS.default}</div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:11px;color:var(--t1);line-height:1.4;font-weight:${n.read?'400':'600'};">${esc(n.message)}</div>
              <div style="font-size:10px;color:var(--t3);margin-top:2px;">${fts(n.ts)}</div>
            </div>
            ${!n.read?`<div style="width:7px;height:7px;border-radius:50%;background:var(--ac);flex-shrink:0;margin-top:4px;"></div>`:''}
          </div>`).join('')}
    </div>
  </div>
  </div>`;
}

// ── STARTUP ALERT ────────────────────────
function getDeadlineAlerts(){
  const today=new Date();today.setHours(0,0,0,0);
  const check=d=>{if(!d)return null;const dt=new Date(d);dt.setHours(0,0,0,0);return Math.round((dt-today)/(1000*60*60*24));};
  const active=S.cards.filter(c=>c.status!=='done'&&c.status!=='standby');
  const overdue=active.filter(c=>{const d=[check(c.deliveryDate),check(c.publishDate)].filter(x=>x!==null);return d.length&&Math.min(...d)<0;});
  const today0=active.filter(c=>{const d=[check(c.deliveryDate),check(c.publishDate)].filter(x=>x!==null);return d.length&&Math.min(...d)===0;});
  const soon=active.filter(c=>{const d=[check(c.deliveryDate),check(c.publishDate)].filter(x=>x!==null);const m=d.length?Math.min(...d):null;return m!==null&&m>0&&m<=2;});
  return{overdue,today:today0,soon};
}
function renderStorageAlert(){
  if(!S._storageWarning&&!S._storageFull)return'';
  const usage=getStorageUsage();
  const pct=Math.round(usage.pct*100);
  if(S._storageFull){
    return`<div style="background:#fef2f2;border-bottom:2px solid #dc2626;padding:8px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;">
      <span style="font-size:14px;">🔴</span>
      <div style="flex:1;font-size:12px;color:#991b1b;font-weight:600;">Armazenamento local cheio — dados salvos temporariamente. Exporte seus dados ou limpe o cache para continuar.</div>
      <button onclick="if(confirm('Limpar cache temporário (Windsor, configurações visuais)? Dados de cards e solicitações serão mantidos.')){localStorage.removeItem('kami-mkt-windsor-cache');localStorage.removeItem(KEY_ST_COLORS);S._storageFull=false;S._storageWarning=false;_storageWarnShown=false;render();}" style="background:#dc2626;color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;">Limpar cache</button>
    </div>`;
  }
  return`<div style="background:#fffbeb;border-bottom:1px solid #fcd34d;padding:6px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;">
    <span style="font-size:13px;">⚠️</span>
    <div style="flex:1;font-size:11px;color:#92400e;">Armazenamento ${pct}% usado — considere exportar dados antigos em breve.</div>
    <button onclick="S._storageWarning=false;_storageWarnDismissed=true;render();" style="background:none;border:none;color:#92400e;cursor:pointer;font-size:16px;padding:0 4px;" title="Não mostrar novamente nesta sessão">×</button>
  </div>`;
}

function renderStartupAlert(){
  if(S.startup_alert_dismissed)return'';
  if(S.pipe!=='content'&&S.pipe!=='dash')return'';
  const{overdue,today,soon}=getDeadlineAlerts();
  if(!overdue.length&&!today.length&&!soon.length)return'';
  return`<div style="background:${overdue.length?'#fee2e2':today.length?'#fef3c7':'#fffbeb'};border-bottom:1px solid ${overdue.length?'#fca5a5':today.length?'#fde68a':'#fcd34d'};padding:8px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;">
    <span style="font-size:13px;">${overdue.length?'⚠️':today.length?'⏰':'📅'}</span>
    <div style="flex:1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
      ${overdue.length?`<span style="font-size:12px;font-weight:700;color:#dc2626;">${overdue.length} card${overdue.length>1?'s':''} atrasado${overdue.length>1?'s':''}</span>`:''}
      ${today.length?`<span style="font-size:12px;font-weight:700;color:#b45309;">${today.length} card${today.length>1?'s':''} vencem hoje</span>`:''}
      ${soon.length?`<span style="font-size:12px;font-weight:600;color:#92400e;">${soon.length} card${soon.length>1?'s':''} vencem em até 2 dias</span>`:''}
      ${overdue.length?`<div style="display:flex;flex-wrap:wrap;gap:4px;">${overdue.slice(0,3).map(c=>`<span style="background:#fecaca;color:#991b1b;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:600;">${esc(c.title||'Sem título')}</span>`).join('')}${overdue.length>3?`<span style="font-size:10px;color:#dc2626;">+${overdue.length-3} mais</span>`:''}</div>`:''}
    </div>
    <button data-action="dismiss-startup-alert" style="background:none;border:none;color:${overdue.length?'#dc2626':'#b45309'};cursor:pointer;font-size:16px;padding:0 4px;flex-shrink:0;" title="Fechar">×</button>
  </div>`;
}

</div>`;

function card1(c){
  const hs=!!c.script?.trim(),hb=!!c.briefing?.trim(),hc=!!c.caption?.trim(),hl=!!c.fileLink?.trim();
  const proj=c.project?c.project.replace('KAMI CO. ','').replace('Toctus_KAMI CO.','Toctus'):c.project;
  const today=new Date();today.setHours(0,0,0,0);
  const checkDate=d=>{if(!d)return null;const dt=new Date(d);dt.setHours(0,0,0,0);return Math.round((dt-today)/(1000*60*60*24));};
  const allDiffs=[c.deliveryDate,c.avDate,c.publishDate].map(checkDate).filter(x=>x!==null);
  const minDiff=allDiffs.length?Math.min(...allDiffs):null;
  const isOverdue=c.status!=='done'&&c.status!=='standby'&&minDiff!==null&&minDiff<0;
  const isDueSoon=c.status!=='done'&&c.status!=='standby'&&minDiff!==null&&minDiff>=0&&minDiff<=2;
  const st=gst(c.status);
  const isDone=c.status==='done';
  const borderColor=isDone?'var(--b)':isOverdue?'#dc2626':isDueSoon?'#f59e0b':(st.color||'var(--b)');
  const isDark=document.documentElement.dataset.theme==='dark';
  const bgColor=isOverdue?(isDark?'#2d1515':'#fff5f5'):isDueSoon?(isDark?'#2d2310':'#fffbeb'):'var(--s1)';
  const doneStyle=isDone?'opacity:.45;filter:grayscale(.6);':'';
  const commentCount=(c.comments||[]).length;
  const histCount=(c.history||[]).filter(h=>h.field!=='created').length;
  return`<div class="card" draggable="true" data-cid="${c.id}" data-cpipe="1" style="border-left-color:${borderColor};background:${bgColor};${doneStyle}">
    <div class="ctitle" style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px;">
      <span>${esc(c.title)||'<em style="color:var(--t3)">Sem título</em>'}</span>
      ${isOverdue?`<span style="background:#fee2e2;color:#dc2626;border-radius:4px;padding:2px 6px;font-size:9px;font-weight:800;white-space:nowrap;flex-shrink:0;">⚠️ Atrasado</span>`:isDueSoon?`<span style="background:#fef3c7;color:#b45309;border-radius:4px;padding:2px 6px;font-size:9px;font-weight:800;white-space:nowrap;flex-shrink:0;">⏰ ${minDiff===0?'Hoje':minDiff===1?'Amanhã':'2 dias'}</span>`:''}
    </div>
    ${c.project?`<div style="margin-bottom:6px;">${projTag(c.project)}</div>`:''}
    ${(c.channel&&c.channel.length)?`<div style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:5px;">${c.channel.map(ch=>chTag(ch)).join('')}</div>`:''}
    ${c.format?`<div style="margin-bottom:6px;">${fmtTag(c.format)}</div>`:''}
    ${(c.deliveryDate||c.avDate||c.publishDate)?`<div class="cdates">
      ${c.deliveryDate?`<div class="cdate">📦 ${fdate(c.deliveryDate)}</div>`:''}
      ${c.avDate?`<div class="cdate">🎬 ${fdate(c.avDate)}</div>`:''}
      ${c.publishDate?`<div class="cdate">📅 ${fdate(c.publishDate)}</div>`:''}
    </div>`:''}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
      <div class="cinds" style="margin-top:0;">
        <div class="ind ${hs?'ind-on':'ind-off'}" title="Roteiro ${hs?'✓':'vazio'}"></div>
        <div class="ind ${hb?'ind-on':'ind-off'}" title="Briefing ${hb?'✓':'vazio'}"></div>
        <div class="ind ${hc?'ind-on':'ind-off'}" title="Legenda ${hc?'✓':'vazia'}"></div>
        ${hl?`<div class="ind ind-blue" title="Arquivo vinculado"></div>`:''}
        <span class="ind-label">R B L${hl?' A':''}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        ${commentCount?`<span style="font-size:10px;color:var(--t3);display:flex;align-items:center;gap:3px;" title="${commentCount} comentário${commentCount>1?'s':''}">💬 ${commentCount}</span>`:''}
        ${histCount?`<span style="font-size:10px;color:var(--t3);display:flex;align-items:center;gap:3px;" title="${histCount} alteraç${histCount>1?'ões':'ão'}">🕓 ${histCount}</span>`:''}
        ${(c.responsible&&c.responsible.length)?`<div class="avatars" style="margin-top:0;">${c.responsible.map(n=>{const m=getTeam().find(t=>t.name===n);return m?`<div class="avatar" style="background:${m.color}" title="${esc(n)}">${m.initials}</div>`:''}).join('')}</div>`:''}
      </div>
    </div>
  </div>`;
}

// ── PIPELINE 1: LIST ────────────────────
function list1(){
  const cards=filtered1();const s=S.sort;
  const sorted=[...cards].sort((a,b)=>{
    let av=a[s.field]||'',bv=b[s.field]||'';
    if(s.field==='createdAt'){av=Number(av);bv=Number(bv);}
    if(av<bv)return s.dir==='asc'?-1:1;if(av>bv)return s.dir==='asc'?1:-1;return 0;
  });
  const arr=f=>s.field===f?`<span class="sa">${s.dir==='asc'?'▲':'▼'}</span>`:'';
  const COLS1=[
    {key:'title',   label:'Título',           sort:'title',
     th:`<th data-sort1="title" data-col-key="title" draggable="true">Título${arr('title')}</th>`,
     td:c=>`<td style="font-weight:600;max-width:200px;"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.title)||'—'}</div></td>`},
    {key:'status',  label:'Status',           sort:'status',
     th:`<th data-sort1="status" data-col-key="status" draggable="true">Status${arr('status')}</th>`,

    {key:'project', label:'Projeto',          sort:'project',

     td:c=>`<td>${c.project?projTag(c.project):'—'}</td>`},
    {key:'format',  label:'Formato',          sort:'format',
     th:`<th data-sort1="format" data-col-key="format" draggable="true">Formato${arr('format')}</th>`,
     td:c=>`<td>${c.format?fmtTag(c.format):'—'}</td>`},

    {key:'deliveryDate',label:'Entrega Criativo', sort:'deliveryDate',

     td:c=>`<td style="color:var(--t2)">${fdate(c.deliveryDate)}</td>`},
    {key:'avDate',  label:'Entrega AV',       sort:'avDate',
     th:`<th data-sort1="avDate" data-col-key="avDate" draggable="true">Entrega AV${arr('avDate')}</th>`,
     td:c=>`<td style="color:var(--t2)">${fdate(c.avDate)}</td>`},
    {key:'publishDate',label:'Publicação',    sort:'publishDate',
     th:`<th data-sort1="publishDate" data-col-key="publishDate" draggable="true">Publicação${arr('publishDate')}</th>`,
     td:c=>`<td style="color:var(--t2)">${fdate(c.publishDate)}</td>`},
    {key:'responsible',label:'Responsáveis',
     th:`<th data-col-key="responsible" draggable="true">Responsáveis</th>`,
     td:c=>`<td><div style="display:flex;gap:3px;">${(c.responsible&&c.responsible.length)?c.responsible.map(n=>{const m=getTeam().find(t=>t.name===n);return m?`<div class="avatar" style="background:${m.color};width:22px;height:22px;font-size:9px;" title="${esc(n)}">${m.initials}</div>`:''}).join(''):'<span style="color:var(--t3)">—</span>'}</div></td>`},
    {key:'content', label:'Conteúdo',
     th:`<th data-col-key="content" draggable="true">Conteúdo</th>`,
     td:c=>{const hs=!!c.script?.trim(),hb=!!c.briefing?.trim(),hc=!!c.caption?.trim(),hl=!!c.fileLink?.trim();
       return`<td><div style="display:flex;gap:4px;"><div class="ind ${hs?'ind-on':'ind-off'}" title="Roteiro"></div><div class="ind ${hb?'ind-on':'ind-off'}" title="Briefing"></div><div class="ind ${hc?'ind-on':'ind-off'}" title="Legenda"></div>${hl?`<div class="ind ind-blue" title="Arquivo"></div>`:''}</div></td>`;}},
  ];
  const uid=(AUTH.session&&AUTH.session.email)||'default';
  let colOrder=[];try{colOrder=JSON.parse(localStorage.getItem('kami-col-list1-'+uid)||'[]');}catch(e){}
  const cols=colOrder.length
    ?[...colOrder.map(k=>COLS1.find(c=>c.key===k)).filter(Boolean),...COLS1.filter(c=>!colOrder.includes(c.key))]
    :COLS1;
  return`<div class="listwrap"><table class="ltbl" id="ltbl1">
    <thead><tr>${cols.map(c=>c.th).join('')}</tr></thead>
    <tbody>${sorted.length===0?`<tr><td colspan="${cols.length}" style="text-align:center;padding:40px;color:var(--t3);">
      ${S.cards.length===0
        ?`<div style="font-size:13px;margin-bottom:10px;">Nenhum card de conteúdo ainda.</div><button class="btn btn-p" data-action="new" data-st="ideas" style="font-size:11px;padding:6px 14px;">+ Criar primeiro card</button>`

    </td></tr>`:sorted.map(c=>`<tr data-cid="${c.id}" data-cpipe="1">${cols.map(col=>col.td(c)).join('')}</tr>`).join('')}</tbody>

}

                  <button type="button" id="add-resp-c1-btn" style="width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--b);background:none;color:var(--t3);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;">+</button>
                  <div id="add-resp-c1-dd" style="display:none;position:absolute;top:34px;left:0;background:var(--s1);border:1px solid var(--b);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:200;min-width:200px;padding:6px;">
                    <input type="text" id="resp-search-c1-dd" placeholder="Buscar responsável..." style="width:100%;background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t1);padding:6px 9px;font-size:11px;outline:none;font-family:inherit;margin-bottom:4px;box-sizing:border-box;">
                    ${getTeam().map(t=>`<div class="resp-opt-c1" data-n="${esc(t.name)}" data-color="${t.color}" data-initials="${t.initials}" style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;">
                      <div style="width:20px;height:20px;border-radius:50%;background:${t.color};display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff;">${t.initials}</div>
                      <div>
                        <div style="font-size:12px;color:var(--t1);">${esc(t.name)}</div>
                        ${(()=>{const u=AUTH.users.find(x=>x.id===t.id)||{};const sub=u.department||u.position||(u.email?u.email.split('@')[0]:'');return sub?`<div style="font-size:10px;color:var(--t3);">${esc(sub)}</div>`:'';})()}
                      </div>
                    </div>`).join('')}
                  </div>
                </div>
              </div>
            </div>
            <!-- Aprovador -->
            <div class="fg" style="margin-top:4px;">
              <label style="display:flex;align-items:center;gap:5px;">Aprovador ${tip('Quando o card chegar em Revisão, o aprovador\nrecebe uma notificação e pode Aprovar ou Recusar\ncom comentário obrigatório.')}</label>
              <select name="approver" style="background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t1);padding:7px 10px;font-size:12px;font-family:inherit;outline:none;">
                <option value="">Nenhum designado</option>
                ${getTeam().map(t=>`<option value="${esc(t.name)}"${v.approver===t.name?' selected':''}>${esc(teamLabel(t))}</option>`).join('')}
              </select>
            </div>
          </div>

          <!-- PAINEL DE APROVAÇÃO — aparece quando status = review -->
          ${!isNew&&(v.status==='review')&&AUTH.session?`
          <div class="tpane ${tab==='basic'?'on':''}" style="display:${tab==='basic'?'block':'none'};">
            <div style="background:${v.approval?.status==='approved'?'#f0fdf4':v.approval?.status==='rejected'?'#fef2f2':'#fefce8'};border:1px solid ${v.approval?.status==='approved'?'#bbf7d0':v.approval?.status==='rejected'?'#fecaca':'#fde68a'};border-radius:10px;padding:14px 16px;margin-top:4px;">
              <div style="font-size:11px;font-weight:700;color:${v.approval?.status==='approved'?'#166534':v.approval?.status==='rejected'?'#991b1b':'#854d0e'};text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;">
                ${v.approval?.status==='approved'?'✅ Aprovado':''}
                ${v.approval?.status==='rejected'?'❌ Recusado':''}
                ${!v.approval?'⏳ Aguardando aprovação':''}
              </div>
              ${v.approval?`<div style="font-size:12px;color:var(--t2);margin-bottom:4px;">Por <strong>${esc(v.approval.by)}</strong> em ${new Date(v.approval.ts).toLocaleDateString('pt-BR')}</div>
              ${v.approval.comment?`<div style="font-size:12px;color:var(--t2);font-style:italic;">"${esc(v.approval.comment)}"</div>`:''}`:
              `<div style="font-size:11px;color:var(--t3);margin-bottom:12px;">Aprovador designado: <strong>${esc(v.approver||'Nenhum')}</strong></div>
              <textarea id="approval-comment" placeholder="Comentário (obrigatório ao recusar)" rows="2" style="width:100%;background:var(--s1);border:1px solid var(--b);border-radius:6px;color:var(--t1);padding:7px 10px;font-size:12px;font-family:inherit;outline:none;resize:none;box-sizing:border-box;margin-bottom:10px;"></textarea>
              <div style="display:flex;gap:8px;">
                <button type="button" data-action="approve-card" data-id="${v.id}" style="flex:1;background:#16a34a;color:#fff;border:none;border-radius:7px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">✅ Aprovar</button>
                <button type="button" data-action="reject-card" data-id="${v.id}" style="flex:1;background:#dc2626;color:#fff;border:none;border-radius:7px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">❌ Recusar</button>
              </div>`}
            </div>
          </div>`:''}

          <div class="tpane ${tab==='content'?'on':''}">
            <div class="fg"><label style="display:flex;align-items:center;gap:5px;">Roteiro Audiovisual ${tip('⚠️ Obrigatório para mover para A Fazer Audiovisual.\nDescreva cenas, falas e transições.')}</label>
              <textarea name="script" placeholder="Cenas, falas, transições..." style="${!v.script&&v.status==='av-todo'?'border-color:#f59e0b;':''}">${esc(v.script)}</textarea>
            </div>
            <div class="fg"><label style="display:flex;align-items:center;gap:5px;">Briefing Criativo ${tip('⚠️ Obrigatório para mover para A Fazer Criativo.\nDescreva: referências visuais, paleta, formato\ne mensagem principal.')}</label>
              <textarea name="briefing" placeholder="Referências visuais, paleta, formato, mensagem principal..." style="${!v.briefing&&['cri-todo','review','final-social'].includes(v.status)?'border-color:#f59e0b;':''}">${esc(v.briefing)}</textarea>
            </div>
            <div class="fg"><label>Legenda</label>
              <textarea name="caption" placeholder="Legenda completa com emojis e hashtags...">${esc(v.caption)}</textarea>
            </div>
          </div>
          <div class="tpane ${tab==='delivery'?'on':''}">
            <div class="fg">
              <label>Anexar arquivo</label>
              <div style="border:2px dashed var(--b);border-radius:8px;padding:14px 16px;background:var(--s2);display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <label id="card-upload-label" style="display:inline-flex;align-items:center;gap:6px;background:var(--ac);color:#fff;border-radius:7px;padding:7px 16px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;">
                  <input type="file" id="card-file-input" accept="image/*,video/*,.pdf,.ppt,.pptx,.doc,.docx" style="display:none;">
                  📎 Selecionar arquivo
                </label>
                <span id="card-upload-status" style="font-size:11px;color:var(--t3);">${v.fileLink?'✓ Arquivo vinculado — ou cole um link abaixo':'Imagens, vídeos, PDFs, PPT, Word (máx. 50 MB)'}</span>
              </div>
            </div>
            <div class="fg"><label>Link do Arquivo (Drive, Dropbox, Frame.io…)</label>
              <input type="url" name="fileLink" id="card-file-link" value="${esc(v.fileLink)}" placeholder="https://drive.google.com/...">
            </div>
            <div class="fg"><label>Quantidade de Arquivos Gerados</label>
              <input type="number" name="fileCount" value="${esc(String(v.fileCount||''))}" placeholder="0" min="0" style="max-width:140px;">
            </div>
            <div class="fg"><label>Instruções para Publicação</label>
              <textarea name="publishInstructions" placeholder="Horário, hashtags, perfis para marcar, configs de veiculação...">${esc(v.publishInstructions)}</textarea>
            </div>
          </div>
        </form>

        <!-- ABA COMENTÁRIOS -->
        <div class="tpane ${tab==='comments'?'on':''}" id="comments-pane" style="display:${tab==='comments'?'flex':'none'};flex-direction:column;height:100%;">
          <div id="comments-list" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px;">
            ${comments.length===0?`<div style="text-align:center;padding:40px 0;color:var(--t3);font-size:13px;">Nenhum comentário ainda.<br>Seja o primeiro a comentar!</div>`
            :comments.map(cm=>{
              const u=AUTH.users.find(u=>u.id===cm.userId)||{name:cm.userName||'?',color:'#999'};
              const initials=(u.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
              const textHtml=esc(cm.text).replace(/@(\w[^\s]*)/g,'<span style="color:var(--ac);font-weight:700;">@$1</span>');
              const replies=(cm.replies||[]);
              return`<div>
                <!-- Comentário principal -->
                <div style="display:flex;gap:10px;align-items:flex-start;">
                  <div style="width:30px;height:30px;border-radius:50%;background:${u.color||'#999'};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;">${initials}</div>
                  <div style="flex:1;min-width:0;">
                    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:3px;">
                      <span style="font-size:12px;font-weight:700;color:var(--t1);">${esc(u.name)}</span>
                      <span style="font-size:10px;color:var(--t3);">${fts(cm.ts)}</span>
                    </div>
                    <div style="font-size:13px;color:var(--t1);line-height:1.5;background:var(--s2);border-radius:0 8px 8px 8px;padding:8px 12px;word-break:break-word;">${textHtml}</div>
                    <button class="reply-btn" data-cmid="${cm.id}" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:10px;font-weight:600;padding:4px 0;font-family:inherit;">↩ Responder</button>
                  </div>
                </div>
                <!-- Respostas -->
                ${replies.length?`<div style="margin-left:40px;margin-top:6px;display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--b);padding-left:12px;">
                  ${replies.map(rep=>{
                    const ru=AUTH.users.find(u=>u.id===rep.userId)||{name:rep.userName||'?',color:'#999'};
                    const ri=(ru.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
                    const rHtml=esc(rep.text).replace(/@(\w[^\s]*)/g,'<span style="color:var(--ac);font-weight:700;">@$1</span>');
                    return`<div style="display:flex;gap:8px;align-items:flex-start;">
                      <div style="width:24px;height:24px;border-radius:50%;background:${ru.color||'#999'};display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff;flex-shrink:0;">${ri}</div>
                      <div style="flex:1;min-width:0;">
                        <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:2px;">
                          <span style="font-size:11px;font-weight:700;color:var(--t1);">${esc(ru.name)}</span>
                          <span style="font-size:9px;color:var(--t3);">${fts(rep.ts)}</span>
                        </div>
                        <div style="font-size:12px;color:var(--t1);line-height:1.5;background:var(--s2);border-radius:0 7px 7px 7px;padding:6px 10px;word-break:break-word;">${rHtml}</div>
                      </div>
                    </div>`;
                  }).join('')}
                </div>`:''}
                <!-- Input de resposta (oculto por padrão) -->
                <div id="reply-input-${cm.id}" style="display:none;margin-left:40px;margin-top:6px;">
                  <div style="display:flex;gap:6px;align-items:flex-end;">
                    <textarea class="reply-textarea" data-cmid="${cm.id}" placeholder="Responder... use @ para mencionar" rows="1" style="flex:1;background:var(--s2);border:1px solid var(--b);border-radius:7px;color:var(--t1);padding:6px 10px;font-size:12px;font-family:inherit;outline:none;resize:none;line-height:1.5;"></textarea>
                    <button class="reply-submit" data-cmid="${cm.id}" data-cid="${v.id}" style="background:var(--ac);color:#fff;border:none;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;white-space:nowrap;">↩</button>
                  </div>
                </div>
              </div>`;
            }).join('')}
          </div>
          <!-- Input de comentário -->
          <div style="border-top:1px solid var(--b);padding-top:12px;position:relative;">
            <div id="mention-dropdown" style="display:none;position:absolute;bottom:100%;left:0;background:var(--s1);border:1px solid var(--b);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:300;min-width:200px;padding:4px;"></div>
            <div style="display:flex;gap:8px;align-items:flex-end;">
              <textarea id="comment-input" placeholder="Escreva um comentário... use @ para mencionar" rows="2" style="flex:1;background:var(--s2);border:1px solid var(--b);border-radius:8px;color:var(--t1);padding:8px 12px;font-size:13px;font-family:inherit;outline:none;resize:none;line-height:1.5;"></textarea>
              <button id="comment-submit" data-cid="${v.id}" style="background:var(--ac);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;white-space:nowrap;height:36px;">Enviar</button>
            </div>
          </div>
        </div>

        <!-- ABA HISTÓRICO — timeline visual -->
        <div class="tpane ${tab==='history'?'on':''}" style="display:${tab==='history'?'block':'none'};overflow-y:auto;">
          ${history.length===0?`<div style="text-align:center;padding:40px 0;color:var(--t3);font-size:13px;"><div style="font-size:28px;margin-bottom:8px;">📋</div>Nenhuma alteração registrada ainda.</div>`
          :`<div style="position:relative;padding-left:28px;">
            <div style="position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--b);border-radius:1px;"></div>
            ${history.slice().reverse().map((h,i)=>{
              const u=AUTH.users.find(u=>u.id===h.userId)||{name:h.userName||'Sistema',color:'#999'};
              const initials=(u.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
              const fieldLabels={status:'Status',title:'Título',responsible:'Responsáveis',format:'Formato',deliveryDate:'Entrega criativo',avDate:'Entrega audiovisual',publishDate:'Data de publicação',project:'Projeto',funnel:'Funil',channel:'Canal',script:'Roteiro',briefing:'Briefing',caption:'Legenda',fileLink:'Link do arquivo',fileCount:'Qtd. arquivos',approver:'Aprovador',approval:'Aprovação',created:'Criação'};
              const fl=fieldLabels[h.field]||h.field;
              const isCreated=h.field==='created';
              const isApproved=h.field==='approval'&&h.newVal?.startsWith('✅');
              const isRejected=h.field==='approval'&&h.newVal?.startsWith('❌');
              const dotColor=isCreated?'#22c55e':isApproved?'#16a34a':isRejected?'#dc2626':h.field==='status'?'var(--ac)':'var(--b)';
              return`<div style="position:relative;margin-bottom:16px;">
                <!-- Dot na linha -->
                <div style="position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:${dotColor};border:2px solid var(--s1);z-index:1;"></div>
                <div style="background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:9px 12px;">
                  <div style="display:flex;align-items:center;gap:7px;margin-bottom:${isCreated?'0':'6px'};">
                    <div style="width:20px;height:20px;border-radius:50%;background:${u.color||'#999'};display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff;flex-shrink:0;">${initials}</div>
                    <span style="font-size:11px;font-weight:700;color:var(--t1);">${esc(u.name)}</span>
                    <span style="font-size:10px;color:var(--t3);">${fts(h.ts)}</span>
                    ${isCreated?`<span style="margin-left:auto;background:#dcfce7;color:#166534;font-size:9px;font-weight:700;padding:1px 7px;border-radius:10px;">Criado</span>`:`<span style="font-size:10px;color:var(--t2);">· ${fl}</span>`}
                  </div>
                  ${!isCreated?`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    <span style="background:var(--s1);border:1px solid var(--b);padding:2px 8px;border-radius:4px;font-size:11px;color:var(--t2);">${esc(String(h.oldVal||'—'))}</span>
                    <span style="color:var(--t3);font-size:12px;">→</span>
                    <span style="background:${h.field==='status'?'var(--ac)15':'var(--s1)'};border:1px solid ${h.field==='status'?'var(--ac)':'var(--b)'};padding:2px 8px;border-radius:4px;font-size:11px;color:${h.field==='status'?'var(--ac)':'var(--t1)'};font-weight:${h.field==='status'?'700':'400'};">${esc(String(h.newVal||'—'))}</span>
                  </div>`:''}
                </div>
              </div>`;
            }).join('')}
          </div>`}
        </div>

      </div>
      <div class="mfoot">
        ${!isNew?`<button class="btn btn-d" data-action="del1" data-id="${v.id}">Deletar</button>`:''}
        <button class="btn btn-o" data-action="cls1">Cancelar</button>
        ${tab!=='comments'&&tab!=='history'&&!locked?`<button class="btn btn-p" data-action="save1" data-id="${v.id}">${isNew?'Criar Card':'Salvar'}</button>`:locked?`<span style="font-size:11px;color:var(--t3);font-style:italic;">Somente ${esc(v.approver||'o aprovador')} pode editar</span>`:''}
        ${locked&&isAdmin?`<button class="btn btn-o" data-action="force-unlock" data-id="${v.id}" style="font-size:10px;padding:4px 10px;">🔓 Desbloquear (admin)</button>`:''}
      </div>
    </div>
  </div>`;
}

// PIPELINE 2 — SOLICITAÇÕES
// ═══════════════════════════════════════

function flt2(){
  const isAdmin=AUTH.session&&AUTH.session.role==='admin';
  const f=S.filters2;
  const has=f.search||f.status||f.responsible2;
  return`<div class="filters">
    <div style="display:flex;background:var(--s2);border:1px solid var(--b);border-radius:7px;padding:2px;gap:1px;flex-shrink:0;">
      <button class="vbtn ${S.view2==='kanban'?'on':''}" data-view="kanban" style="padding:4px 10px;font-size:11px;">⊞ Kanban</button>
      <button class="vbtn ${S.view2==='list'?'on':''}" data-view="list" style="padding:4px 10px;font-size:11px;">☰ Lista</button>
    </div>
    <span class="flabel">Filtrar</span>
    <input class="fsearch" type="text" placeholder="Buscar título ou solicitante..." value="${esc(f.search)}" data-f2="search">
    <select class="fsel" data-f2="status">
      <option value="">Todos status</option>
      ${ST2.map(s=>`<option value="${s.id}"${f.status===s.id?' selected':''}>${esc(s.label)}</option>`).join('')}
    </select>
    <select class="fsel" data-f2="responsible2">
      <option value="">Todos responsáveis</option>
      ${getTeam().map(t=>`<option value="${esc(t.name)}"${f.responsible2===t.name?' selected':''}>${esc(teamLabel(t))}</option>`).join('')}
    </select>
    ${has?`<span class="fclr" data-action="clr2">✕ Limpar</span>`:''}
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px;">
      <button class="btn btn-p" data-action="new" data-st2="triage" style="padding:5px 12px;font-size:11px;">+ Nova Solicitação</button>
      ${isAdmin?`<button data-action="gen-ext-form" title="Gerar formulário externo" style="background:var(--s2);border:1px solid var(--b);border-radius:7px;color:var(--t2);cursor:pointer;font-size:11px;padding:5px 10px;font-family:inherit;display:flex;align-items:center;gap:4px;">🔗 Formulário externo</button>`:''}
      <button data-action="export-csv2" title="Exportar CSV" style="background:var(--s2);border:1px solid var(--b);border-radius:7px;color:var(--t2);cursor:pointer;font-size:11px;padding:5px 10px;font-family:inherit;display:flex;align-items:center;gap:4px;">⬇ CSV</button>
    </div>
  </div>`;
}

function sts2(){
  const c=filtered2();
  return`<div class="stats">
    <div class="stat"><div class="sdot" style="background:var(--ac)"></div><strong>${c.length}</strong> solicitações</div>
    <div class="stat"><div class="sdot" style="background:#f59e0b"></div><strong>${c.filter(x=>x.status==='progress').length}</strong> em andamento</div>
    <div class="stat"><div class="sdot" style="background:#f43f5e"></div><strong>${c.filter(x=>x.status==='waiting').length}</strong> aguardando info</div>
    <div class="stat"><div class="sdot" style="background:#22c55e"></div><strong>${c.filter(x=>x.status==='done').length}</strong> concluídas</div>
  </div>`;
}

function kban2(){
  const reqs=filtered2();
  return`<div class="kanban">${getST2().map(s=>{
    const cc=reqs.filter(r=>r.status===s.id);
    const curColor=(S.st_colors&&S.st_colors['2_'+s.id])||s.color;
    const colKey=`2_${s.id}`;
    const isCustom=!!s.custom;
    const isCol=!!(S.collapsed_cols&&S.collapsed_cols[colKey]);
    return`<div class="kcol${isCol?' kcollapsed':''}" style="--kcol-color:${curColor}">
      <div class="khead" style="position:relative;">
        <div class="kdot" style="background:${curColor}"></div>
        <div class="ktitle">${esc(s.label)}</div>
        <div class="kcount" style="background:${curColor}22;color:${curColor};">${cc.length}</div>
        ${!isCol?`<button class="kcol-menu-btn" data-stpipe="2" data-stid="${s.id}" data-stcolor="${curColor}" data-stcustom="${isCustom?'1':'0'}" title="Opções" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:4px;line-height:1;margin-left:2px;">⋯</button>
        <button class="kadd" data-action="new" data-st2="${s.id}" title="Adicionar">+</button>
        <button data-colcol="${colKey}" title="Minimizar" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:15px;padding:2px 4px;border-radius:4px;line-height:1;margin-left:2px;flex-shrink:0;">‹</button>`:''}
      </div>
      ${isCol?`<div style="display:flex;justify-content:center;padding:8px 0;flex-shrink:0;">
        <button data-colcol="${colKey}" title="Expandir" style="background:none;border:none;color:var(--ac);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:6px;line-height:1;">›</button>
      </div>`:''}
      ${!isCol?`<div class="kcards" data-dz2="${s.id}">
        ${cc.length===0?`<div class="kempty"><div class="kempty-icon">⊕</div><div class="kempty-txt">Arraste cards aqui<br>ou use + para adicionar</div></div>`:cc.map(r=>card2(r)).join('')}
      </div>`:''}
    </div>`;
  }).join('')}
  <div style="flex-shrink:0;align-self:flex-start;padding-top:2px;">
    <button data-addcol="2" style="background:none;border:2px dashed var(--b);border-radius:12px;color:var(--t3);cursor:pointer;width:200px;padding:12px 0;font-size:12px;font-family:inherit;font-weight:600;transition:.15s;" onmouseover="this.style.borderColor='var(--ac)';this.style.color='var(--ac)'" onmouseout="this.style.borderColor='var(--b)';this.style.color='var(--t3)'">+ Nova coluna</button>
  </div>
</div>`;
}

function card2(r){
  const shortOT=r.orderType?r.orderType.replace('Lâminas comerciais — campanhas ou promoções','Lâminas comerciais'):r.orderType;
  const st=gst2(r.status);
  const commentCount=(r.comments||[]).length;
  const histCount=(r.history||[]).filter(h=>h.field!=='created').length;
  const isDone2=['done','rejected'].includes(r.status);
  const resp2=Array.isArray(r.responsible)?r.responsible:(r.responsible?[r.responsible]:[]);
  return`<div class="card" draggable="true" data-rid="${r.id}" data-cpipe="2" style="border-left-color:${st.color};${isDone2?'opacity:.45;filter:grayscale(.6);':''}">
    ${r.code?`<div style="font-size:9px;font-weight:800;color:var(--ac);letter-spacing:.5px;margin-bottom:3px;">${esc(r.code)}</div>`:''}
    <div class="ctitle">${esc(r.requestTitle)||'<em style="color:var(--t3)">Sem título</em>'}</div>
    <div class="ctags">
      ${r.bizUnit?projTag(r.bizUnit):''}
      ${r.orderType?`<span class="tag t-ot">${esc(shortOT)}</span>`:''}
      ${r.deliveryMethod?`<span class="tag ${viacls(r.deliveryMethod)}">${r.deliveryMethod==='WhatsApp'?'📱 WhatsApp':'📧 E-mail'}</span>`:''}
    </div>
    ${r.desiredDate?`<div class="cdates"><div class="cdate">📅 ${fdate(r.desiredDate)}</div></div>`:''}
    ${r.nome?`<div class="cname">👤 ${esc(r.nome)}${r.setor?` · ${esc(r.setor)}`:''}</div>`:''}
    ${r.attachmentName?`<div class="cclip">${r.attachmentURL?`<a href="${esc(r.attachmentURL)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">📎 ${esc(r.attachmentName)}</a>`:`📎 ${esc(r.attachmentName)}`}</div>`:''}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
      <div style="display:flex;align-items:center;gap:8px;">
        ${commentCount?`<span style="font-size:10px;color:var(--t3);display:flex;align-items:center;gap:3px;" title="${commentCount} comentário${commentCount>1?'s':''}">💬 ${commentCount}</span>`:''}
        ${histCount?`<span style="font-size:10px;color:var(--t3);display:flex;align-items:center;gap:3px;" title="${histCount} alteraç${histCount>1?'ões':'ão'}">🕓 ${histCount}</span>`:''}
      </div>
      ${resp2.length?`<div class="avatars" style="margin-top:0;">${resp2.map(n=>{const m=getTeam().find(t=>t.name===n);return m?`<div class="avatar" style="background:${m.color}" title="${esc(n)}">${m.initials}</div>`:''}).join('')}</div>`:''}
    </div>
  </div>`;
}

function list2(){
  const reqs=filtered2();const s=S.sort2;
  const sorted=[...reqs].sort((a,b)=>{
    let av=a[s.field]||'',bv=b[s.field]||'';
    if(s.field==='createdAt'){av=Number(av);bv=Number(bv);}
    if(av<bv)return s.dir==='asc'?-1:1;if(av>bv)return s.dir==='asc'?1:-1;return 0;
  });
  const arr=f=>s.field===f?`<span class="sa">${s.dir==='asc'?'▲':'▼'}</span>`:'';
  const COLS2=[
    {key:'code',         label:'#',
     th:`<th data-sort2="code" data-col-key="code" draggable="true">#${arr('code')}</th>`,
     td:r=>`<td style="white-space:nowrap;">${r.code?`<span style="font-size:10px;font-weight:800;color:var(--ac);background:var(--ac)15;border-radius:4px;padding:1px 7px;">${esc(r.code)}</span>`:'—'}</td>`},
    {key:'requestTitle', label:'Título',
     th:`<th data-sort2="requestTitle" data-col-key="requestTitle" draggable="true">Título${arr('requestTitle')}</th>`,
     td:r=>`<td style="font-weight:600;max-width:200px;"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(r.requestTitle)||'—'}</div></td>`},
    {key:'status',       label:'Status',
     th:`<th data-sort2="status" data-col-key="status" draggable="true">Status${arr('status')}</th>`,
     td:r=>{const st=gst2(r.status);return`<td><span class="sbadge" style="background:${st.color}22;color:${st.color};white-space:nowrap">${esc(st.label)}</span></td>`;}},
    {key:'bizUnit',      label:'Unidade',
     th:`<th data-sort2="bizUnit" data-col-key="bizUnit" draggable="true">Unidade${arr('bizUnit')}</th>`,
     td:r=>`<td>${r.bizUnit?projTag(r.bizUnit):'—'}</td>`},
    {key:'orderType',    label:'Tipo de Pedido',
     th:`<th data-sort2="orderType" data-col-key="orderType" draggable="true">Tipo de Pedido${arr('orderType')}</th>`,
     td:r=>`<td style="max-width:160px;"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t2)">${esc(r.orderType)||'—'}</div></td>`},
    {key:'nome',         label:'Solicitante',
     th:`<th data-sort2="nome" data-col-key="nome" draggable="true">Solicitante${arr('nome')}</th>`,
     td:r=>`<td style="color:var(--t1)">${esc(r.nome)||'—'}</td>`},
    {key:'desiredDate',  label:'Data Desejada',
     th:`<th data-sort2="desiredDate" data-col-key="desiredDate" draggable="true">Data Desejada${arr('desiredDate')}</th>`,
     td:r=>`<td style="color:var(--t2)">${fdate(r.desiredDate)}</td>`},
    {key:'deliveryMethod',label:'Via',
     th:`<th data-sort2="deliveryMethod" data-col-key="deliveryMethod" draggable="true">Via${arr('deliveryMethod')}</th>`,
     td:r=>`<td>${r.deliveryMethod?`<span class="tag ${viacls(r.deliveryMethod)}">${esc(r.deliveryMethod)}</span>`:'—'}</td>`},
    {key:'responsible',  label:'Responsáveis',
     th:`<th data-col-key="responsible" draggable="true">Responsáveis</th>`,
     td:r=>`<td><div style="display:flex;gap:3px;">${(r.responsible&&r.responsible.length)?r.responsible.map(n=>{const m=getTeam().find(t=>t.name===n);return m?`<div class="avatar" style="background:${m.color};width:22px;height:22px;font-size:9px;" title="${esc(n)}">${m.initials}</div>`:''}).join(''):'<span style="color:var(--t3)">—</span>'}</div></td>`},
    {key:'createdAt',    label:'Criado em',
     th:`<th data-sort2="createdAt" data-col-key="createdAt" draggable="true">Criado em${arr('createdAt')}</th>`,
     td:r=>`<td style="color:var(--t3)">${r.createdAt?new Date(r.createdAt).toLocaleDateString('pt-BR'):'—'}</td>`},
  ];
  const uid=(AUTH.session&&AUTH.session.email)||'default';
  let colOrder=[];try{colOrder=JSON.parse(localStorage.getItem('kami-col-list2-'+uid)||'[]');}catch(e){}
  const cols=colOrder.length
    ?[...colOrder.map(k=>COLS2.find(c=>c.key===k)).filter(Boolean),...COLS2.filter(c=>!colOrder.includes(c.key))]
    :COLS2;
  return`<div class="listwrap"><table class="ltbl" id="ltbl2">
    <thead><tr>${cols.map(c=>c.th).join('')}</tr></thead>
    <tbody>${sorted.length===0?`<tr><td colspan="${cols.length}" style="text-align:center;padding:40px;color:var(--t3);">
      ${S.requests.length===0
        ?`<div style="font-size:13px;margin-bottom:10px;">Nenhuma solicitação ainda.</div><button class="btn btn-p" data-action="new" data-st2="triage" style="font-size:11px;padding:6px 14px;">+ Criar primeira solicitação</button>`
        :`<div style="font-size:13px;margin-bottom:10px;">Nenhuma solicitação corresponde aos filtros ativos.</div><button class="btn btn-o" data-action="clr2" style="font-size:11px;padding:6px 14px;">✕ Limpar filtros</button>`}
    </td></tr>`:sorted.map(r=>`<tr data-rid="${r.id}" data-cpipe="2">${cols.map(col=>col.td(r)).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

          <button class="mtab ${tab2==='history2'?'on':''}" data-mt2="history2">Histórico${history2.length?` <span style="background:var(--s2);color:var(--t3);border-radius:10px;font-size:9px;padding:1px 5px;font-weight:700;">${history2.length}</span>`:''}</button>

              const u2=AUTH.users.find(u=>u.id===cm.userId)||{name:cm.userName||'?',color:'#999'};

function barRows(items,max,color){
  if(!items.length)return`<div class="dash-empty">Sem dados</div>`;
  return items.map(x=>`<div class="bar-row">
    <div class="bar-label" title="${esc(x.label)}">${esc(x.label)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${max>0?Math.round(x.count/max*100):0}%;background:${color}"></div></div>
    <div class="bar-val">${x.count}</div>
  </div>`).join('');
}

function initDashCharts(){
  if(S.pipe!=='dash')return;
  const c1=S.cards;
  const c2=S.requests;
  const AF=['ideas','social-todo','av-todo','cri-todo'];
  const af1=c1.filter(c=>AF.includes(c.status)).length;
  const prog1=c1.filter(c=>c.status==='progress').length;
  const rev1=c1.filter(c=>['review','final-social'].includes(c.status)).length;
  const done1=c1.filter(c=>c.status==='done').length;

  const byProj=PROJ.map(p=>({label:p.replace('KAMI CO. ','').replace('Toctus_KAMI CO.','Toctus'),orig:p,count:c1.filter(c=>c.project===p).length})).sort((a,b)=>b.count-a.count);
  const byUnit=BIZ_UNITS.map(u=>({label:u,count:c2.filter(r=>r.bizUnit===u).length})).sort((a,b)=>b.count-a.count);
  const byOT=ORDER_TYPES.map(t=>({label:t.replace('Lâminas comerciais — campanhas ou promoções','Lâminas'),count:c2.filter(r=>r.orderType===t).length})).sort((a,b)=>b.count-a.count);
  const bySetor=SECTORS.map(s=>({label:s,count:c2.filter(r=>r.setor===s).length})).sort((a,b)=>b.count-a.count);

  const xTicks={font:{size:10},maxRotation:0,minRotation:0,callback:function(v){const l=this.getLabelForValue(v);return typeof l==='string'&&l.length>10?l.slice(0,9)+'…':l;}};
  const chartDefaults={responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:xTicks},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},stepSize:1}}}};

  // Donut: status conteúdo
  const ctxStatus=document.getElementById('chart-content-status');
  if(ctxStatus&&typeof Chart!=='undefined'){
    new Chart(ctxStatus,{type:'doughnut',data:{labels:['A Fazer','Em Andamento','Em Revisão','Concluído'],datasets:[{data:[af1,prog1,rev1,done1],backgroundColor:['#6366f1','#f59e0b','#06b6d4','#22c55e'],borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:true,cutout:'70%',plugins:{legend:{display:false}}}});
  }

  // Bar: por projeto
  const isLightBg=hex=>{try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(r*299+g*587+b*114)/1000>200;}catch(e){return false;}};
  const barBorder=bg=>isLightBg(bg)?'rgba(0,0,0,.18)':bg;
  const ctxProj=document.getElementById('chart-content-proj');
  if(ctxProj&&typeof Chart!=='undefined'&&byProj.length){
    const projBgs=byProj.map(x=>projColor(x.orig).bg);
    new Chart(ctxProj,{type:'bar',data:{labels:byProj.map(x=>x.label),datasets:[{data:byProj.map(x=>x.count),backgroundColor:projBgs,borderColor:projBgs.map(barBorder),borderWidth:1,borderRadius:6,borderSkipped:false}]},options:{...chartDefaults,scales:{x:{grid:{display:false},ticks:xTicks},y:{...chartDefaults.scales.y,ticks:{font:{size:10},stepSize:1}}}}});
  }

  // Bar: por unidade
  const ctxUnit=document.getElementById('chart-req-unit');
  if(ctxUnit&&typeof Chart!=='undefined'&&byUnit.length){
    const unitBgs=byUnit.map(x=>projColor(x.label).bg);
    new Chart(ctxUnit,{type:'bar',data:{labels:byUnit.map(x=>x.label),datasets:[{data:byUnit.map(x=>x.count),backgroundColor:unitBgs,borderColor:unitBgs.map(barBorder),borderWidth:1,borderRadius:6,borderSkipped:false}]},options:{...chartDefaults,scales:{x:{grid:{display:false},ticks:xTicks},y:{...chartDefaults.scales.y,ticks:{font:{size:10},stepSize:1}}}}});
  }

  // Bar: tipo de pedido
  const ctxType=document.getElementById('chart-req-type');
  if(ctxType&&typeof Chart!=='undefined'&&byOT.length){
    const chumbo=['#463e3f','#8d8082'];

// DASH CENTRAIS
function renderDashCentrals(){
  const metrics=S.portal_metrics||{};
  const pc=S.portal_content||{portals:[]};
  const pd=S.portal_dist_content||{portals:[]};
  const allPortals=[...(pc.portals||[]).map(p=>({...p,tipo:'Interna'})),...(pd.portals||[]).map(p=>({...p,tipo:'Distribuidor'}))];
  const fmtDate=ts=>ts?new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}):'—';

  // Agrega cliques por portal
  const portalStats=allPortals.map(portal=>{
    const keys=Object.keys(metrics).filter(k=>k.startsWith(portal.id+'|'));
    const total=keys.reduce((s,k)=>s+(metrics[k].count||0),0);
    const lastAt=keys.reduce((m,k)=>Math.max(m,metrics[k].lastAt||0),0);
    return{id:portal.id,name:portal.name,tipo:portal.tipo,color:portal.color||'#6366f1',total,lastAt};
  }).sort((a,b)=>b.total-a.total);

  // Top links globais
  const allLinks=Object.entries(metrics).map(([key,val])=>{
    const parts=key.split('|');
    return{portalId:parts[0],item:parts[1]||'',link:parts[2]||'',count:val.count||0,lastAt:val.lastAt||0};
  }).sort((a,b)=>b.count-a.count).slice(0,10);

  const totalClicks=Object.values(metrics).reduce((s,v)=>s+(v.count||0),0);
  const portaisAtivos=portalStats.filter(p=>p.total>0).length;

  return`<div style="padding:32px 36px;">
    <div style="margin-bottom:28px;">
      <div style="font-size:10px;color:var(--ac);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px;">Dashboard</div>
      <div style="font-size:22px;font-weight:900;color:var(--t1);letter-spacing:-.3px;">Dash das Centrais</div>
    </div>

    <!-- KPIs -->
    <div class="dash-kpi-row" style="margin-bottom:28px;">
      <div class="dash-kpi-card"><div><div class="dash-kpi-num" style="color:#6366f1;">${totalClicks}</div><div class="dash-kpi-label">Total de Acessos</div><div class="dash-kpi-sub">todos os portais</div></div></div>
      <div class="dash-kpi-card"><div><div class="dash-kpi-num" style="color:#10b981;">${portaisAtivos}</div><div class="dash-kpi-label">Portais com Acesso</div><div class="dash-kpi-sub">de ${allPortals.length} cadastrados</div></div></div>
      <div class="dash-kpi-card"><div><div class="dash-kpi-num" style="color:#f59e0b;">${allLinks.length?allLinks[0].count:0}</div><div class="dash-kpi-label">Link Mais Acessado</div><div class="dash-kpi-sub">${allLinks.length?allLinks[0].link:'—'}</div></div></div>
      <div class="dash-kpi-card"><div><div class="dash-kpi-num" style="color:#c8192b;">${allPortals.length}</div><div class="dash-kpi-label">Total de Portais</div><div class="dash-kpi-sub">interna + distribuidor</div></div></div>
    </div>

    <div class="dash-cols">
      <!-- Acessos por portal -->
      <div class="dash-section-wrap">
        <div class="dash-col-header">Acessos por Portal</div>
        <div class="dash-chart-card" style="padding:0;overflow:hidden;">
          ${portalStats.length===0?`<div style="padding:32px;text-align:center;color:var(--t3);font-size:13px;">Nenhum acesso registrado ainda.</div>`:`
          <table style="width:100%;border-collapse:collapse;">
            <thead><tr style="background:var(--s2);">
              <th style="text-align:left;padding:10px 16px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;">Portal</th>
              <th style="text-align:left;padding:10px 8px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;">Tipo</th>
              <th style="text-align:right;padding:10px 16px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;">Cliques</th>
              <th style="text-align:right;padding:10px 16px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;">Último acesso</th>
            </tr></thead>
            <tbody>
              ${portalStats.map((p,i)=>`<tr style="border-top:1px solid var(--b);">
                <td style="padding:10px 16px;display:flex;align-items:center;gap:8px;">
                  <div style="width:10px;height:10px;border-radius:50%;background:${p.color};flex-shrink:0;"></div>
                  <span style="font-size:12px;font-weight:600;color:var(--t1);">${p.name}</span>
                </td>
                <td style="padding:10px 8px;font-size:11px;color:var(--t3);">${p.tipo}</td>
                <td style="padding:10px 16px;text-align:right;font-size:13px;font-weight:800;color:${p.total>0?'var(--ac)':'var(--t3)'};">${p.total||'—'}</td>
                <td style="padding:10px 16px;text-align:right;font-size:11px;color:var(--t3);">${p.lastAt?fmtDate(p.lastAt):'—'}</td>
              </tr>`).join('')}
            </tbody>
          </table>`}
        </div>
      </div>

      <!-- Top 10 links -->
      <div class="dash-section-wrap">
        <div class="dash-col-header">Top Links Acessados</div>
        <div class="dash-chart-card" style="padding:0;overflow:hidden;">
          ${allLinks.length===0?`<div style="padding:32px;text-align:center;color:var(--t3);font-size:13px;">Nenhum acesso registrado ainda.</div>`:`
          <table style="width:100%;border-collapse:collapse;">
            <thead><tr style="background:var(--s2);">
              <th style="text-align:left;padding:10px 16px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;">Item</th>
              <th style="text-align:left;padding:10px 8px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;">Link</th>
              <th style="text-align:right;padding:10px 16px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;">Cliques</th>
              <th style="text-align:right;padding:10px 16px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;">Último</th>
            </tr></thead>
            <tbody>
              ${allLinks.map(l=>{
                const portal=allPortals.find(p=>p.id===l.portalId);
                return`<tr style="border-top:1px solid var(--b);">
                  <td style="padding:10px 16px;">
                    <div style="font-size:12px;font-weight:600;color:var(--t1);">${l.item}</div>
                    ${portal?`<div style="font-size:10px;color:var(--t3);">${portal.name}</div>`:''}
                  </td>
                  <td style="padding:10px 8px;font-size:11px;color:var(--t2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${l.link}</td>
                  <td style="padding:10px 16px;text-align:right;font-size:13px;font-weight:800;color:var(--ac);">${l.count}</td>
                  <td style="padding:10px 16px;text-align:right;font-size:11px;color:var(--t3);">${l.lastAt?fmtDate(l.lastAt):'—'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>`}
        </div>
      </div>
    </div>
  </div>`;
}

// logo da plataforma via favicon
function platLogo(id,size=28){
  const domains={instagram:'instagram.com',facebook:'facebook.com',tiktok:'tiktok.com',linkedin:'linkedin.com',linkedin_p:'linkedin.com',youtube:'youtube.com',threads:'threads.net',pinterest:'pinterest.com',twitter:'x.com',google_biz:'business.google.com',meta_ads:'facebook.com',google_ads:'ads.google.com'};
  const d=domains[id];
  return d?`<img src="https://www.google.com/s2/favicons?domain=${d}&sz=64" style="width:${size}px;height:${size}px;object-fit:contain;" onerror="this.style.display='none'">`:`<span style="font-size:${size*.6}px;font-weight:800;">${(id||'').toUpperCase().slice(0,2)}</span>`;
}

function socDashboard(){
  const connected=S.social_accounts;
  const selAcc=S.social_selected_acc;

  // Profile selector bar
  const profileBar=connected.length?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
