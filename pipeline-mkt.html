    });
    cepInput.addEventListener('blur',async()=>{
      const raw=cepInput.value.replace(/\D/g,'');
      if(raw.length!==8)return;
      const spin=document.getElementById('c-cep-spin');
      if(spin)spin.style.display='inline-block';
      try{
        const res=await fetch(`https://viacep.com.br/ws/${raw}/json/`);
        const d=await res.json();
        if(d.erro){showToast('CEP não encontrado.','warn');return;}
        const stateEl=document.getElementById('c-state');
        const cityEl=document.getElementById('c-city');
        const neighEl=document.getElementById('c-neighborhood');
        const addrEl=document.getElementById('c-address');
        const regionEl=document.getElementById('c-region');
        if(stateEl&&!stateEl.value)stateEl.value=d.uf||'';
        if(cityEl&&!cityEl.value)cityEl.value=d.localidade||'';
        if(neighEl&&!neighEl.value)neighEl.value=d.bairro||'';
        if(addrEl&&!addrEl.value)addrEl.value=d.logradouro||'';
        // mapeia UF para região
        if(regionEl&&!regionEl.value&&d.uf){
          const UF_REGION={AC:'Norte',AP:'Norte',AM:'Norte',PA:'Norte',RO:'Norte',RR:'Norte',TO:'Norte',AL:'Nordeste',BA:'Nordeste',CE:'Nordeste',MA:'Nordeste',PB:'Nordeste',PE:'Nordeste',PI:'Nordeste',RN:'Nordeste',SE:'Nordeste',DF:'Centro-Oeste',GO:'Centro-Oeste',MS:'Centro-Oeste',MT:'Centro-Oeste',ES:'Sudeste',MG:'Sudeste',RJ:'Sudeste',SP:'Sudeste',PR:'Sul',RS:'Sul',SC:'Sul'};
          const reg=UF_REGION[d.uf];
          if(reg){for(const opt of regionEl.options){if(opt.value===reg){regionEl.value=reg;break;}}}
        }
        showToast('✓ Endereço preenchido','ok',1400);
      }catch(e){showToast('Erro ao buscar CEP.','warn');}
      finally{if(spin)spin.style.display='none';}
    });

  r.querySelectorAll('.portal-edit-card[draggable]').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      _pdragSi=card.dataset.si!==undefined?parseInt(card.dataset.si):null;

      card.classList.add('pdragging');

    card.addEventListener('dragover',e=>{
      e.preventDefault();e.stopPropagation();
      card.classList.add('pdrag-over');
    });
    card.addEventListener('dragleave',()=>card.classList.remove('pdrag-over'));
    card.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      card.classList.remove('pdrag-over');
      const tSi=card.dataset.si!==undefined?parseInt(card.dataset.si):null;
      const tIi=parseInt(card.dataset.ii);
      if(_pdragIi===tIi&&_pdragSi===tSi)return;
      // sync form → state before reordering
      syncPortalFormToState();
      const p=(_pc().portals||[]).find(x=>x.id===_peid());
      if(!p)return;
      const srcArr=_pdragSi!==null?p.sections?.[_pdragSi]?.items:p.items;
      const tgtArr=tSi!==null?p.sections?.[tSi]?.items:p.items;
      if(srcArr&&tgtArr&&!isNaN(_pdragIi)){
        const[moved]=srcArr.splice(_pdragIi,1);
        if(moved)tgtArr.splice(tIi,0,moved);
      }
      _pdragSi=null;_pdragIi=null;
      render();
    });

      checked.forEach(cb=>{
        const pid=cb.dataset.pid;

        // Build links for this portal based on per-link checkboxes
        const portalLinks=allLinks.filter((_,li)=>{
          const cb2=r.querySelector(`.dup-link-check[data-li="${li}"][data-pid="${pid}"]`);
          return !cb2||cb2.checked; // include if checked (or no checkbox found)
        });
        const syncFields={title:dm.item.title,desc:dm.item.desc,color:dm.item.color,icon:dm.item.icon,links:portalLinks};
        let found=false;
        const updateItems=(items)=>{
          items.forEach((it,idx)=>{
            if(it.title===dm.item.title||(dm.item.syncId&&it.syncId===dm.item.syncId)){
              items[idx]={...it,...syncFields,syncId:dm.item.syncId||it.syncId};
              found=true;
            }
          });
        };
        (p.sections||[]).forEach(sec=>updateItems(sec.items||[]));
        updateItems(p.items||[]);
        if(!found){
          const newItem={...dm.item,links:portalLinks};
          (p.items=p.items||[]).push(newItem);
        }
      });
    } else {
      // DUPLICATE MODE

    const existingItem=m.secId
      ?(portal.sections?.find(s=>s.id===m.secId)?.items?.[m.itemIdx])
      :(portal.items?.[m.itemIdx]);
    const syncId=wantSync?(existingItem?.syncId||uid()):null;
    const item={icon,title,desc,color,links,syncId};
    const isNew=m.itemIdx===null||m.itemIdx===undefined;
    const targetSecId=document.getElementById('pim-move-sec')?.value||m.secId;
    const moving=!isNew&&targetSecId&&targetSecId!==m.secId;
    if(moving){
      // Remove from current section
      const oldSec=portal.sections?.find(s=>s.id===m.secId);

          });
        });

    const typing=e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'||e.target.isContentEditable;
    if(e.key==='n'&&!S.modal.open&&!S.modal2.open&&!typing){
      // Só nas telas onde "novo" faz sentido — em portais/dashboard o N não faz nada
      if(S.pipe==='content'&&canAccess('content')){S.modal={open:true,id:null,defStatus:'ideas',tab:'basic'};render();}
      else if(S.pipe==='requests'&&canAccess('requests')){S.modal2={open:true,id:null,defStatus:'triage',tab:'form',attachmentName:''};render();}
    }
  };
}

function syncPortalFormToState(){

  if(pidx<0)return;
  const p=pc.portals[pidx];
  if(p.sections&&p.sections.length){

      (sec.items||[]).forEach((item,ii)=>{

        const titleEl=document.querySelector(`.pe-sec-item-title[data-si="${si}"][data-ii="${ii}"]`);

        if(titleEl)item.title=titleEl.value;
        if(descEl)item.desc=descEl.value;
        if(colorEl)item.color=colorEl.value;
        const labels=document.querySelectorAll(`.pe-sec-link-label[data-si="${si}"][data-ii="${ii}"]`);
        const urls=document.querySelectorAll(`.pe-sec-link-url[data-si="${si}"][data-ii="${ii}"]`);
        item.links=[];
        labels.forEach((_,li)=>{if(urls[li]?.value)item.links.push({label:labels[li].value,url:urls[li].value});});

    (p.items||[]).forEach((item,ii)=>{

      const titleEl=document.querySelector(`.pe-item-title[data-ii="${ii}"]`);
      const descEl=document.querySelector(`.pe-item-desc[data-ii="${ii}"]`);
      const colorEl=document.querySelector(`.pe-item-color[data-ii="${ii}"]`);

      if(colorEl)item.color=colorEl.value;
      const labels=document.querySelectorAll(`.pe-item-link-label[data-ii="${ii}"]`);
      const urls=document.querySelectorAll(`.pe-item-link-url[data-ii="${ii}"]`);
      item.links=[];
      labels.forEach((_,li)=>{if(urls[li]?.value)item.links.push({label:labels[li].value,url:urls[li].value});});
    });
  }
}

window.pimReplicateLink = function(btn){
  const row=btn.closest('[data-link-idx]');
  if(!row)return;
  const label=row.querySelector('.pim-link-label')?.value||'';
  const url=row.querySelector('.pim-link-url')?.value||'';
  if(!url){alert('Preencha a URL antes de replicar.');return;}
  document.querySelectorAll('.pim-replicate-picker').forEach(el=>el.remove());
  const m=S.portal_item_modal;
  const pc=_pc();
  const otherPortals=(pc.portals||[]).filter(p=>p.id!==m.portalId&&!p.hidden);
  const picker=document.createElement('div');
  picker.className='pim-replicate-picker';
  picker.style.cssText='position:absolute;background:var(--s1);border:1px solid var(--b);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:10000;min-width:220px;padding:12px;margin-top:4px;';
  picker.innerHTML=`
    <div style="font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;">Replicar para:</div>
    ${otherPortals.map(p=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;border-bottom:1px solid var(--b);">
      <input type="checkbox" class="pim-rep-check" data-pid="${p.id}" checked style="accent-color:var(--ac);cursor:pointer;">
      <span style="font-size:12px;color:var(--t1);">${esc(p.name)}${p.badge?` <span style="font-size:10px;color:var(--t3);">${esc(p.badge)}</span>`:''}</span>
    </label>`).join('')}
    <div style="display:flex;gap:6px;margin-top:10px;">
      <button onclick="this.closest('.pim-replicate-picker').remove()" style="flex:1;background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t2);cursor:pointer;padding:6px;font-size:11px;font-family:inherit;">Cancelar</button>
      <button id="pim-rep-confirm" style="flex:2;background:var(--ac);color:#fff;border:none;border-radius:6px;cursor:pointer;padding:6px;font-size:11px;font-weight:700;font-family:inherit;">Replicar →</button>
    </div>`;
  btn.parentElement.style.position='relative';
  btn.parentElement.appendChild(picker);
  picker.querySelector('#pim-rep-confirm').addEventListener('click',()=>{
    const selectedIds=[...picker.querySelectorAll('.pim-rep-check:checked')].map(cb=>cb.dataset.pid);
    if(!selectedIds.length){picker.remove();return;}
    const sourceItem=m.secId
      ?((pc.portals.find(p=>p.id===m.portalId)?.sections?.find(s=>s.id===m.secId)?.items||[])[m.itemIdx])
      :((pc.portals.find(p=>p.id===m.portalId)?.items||[])[m.itemIdx]);
    const syncId=sourceItem?.syncId;
    const link={label,url};
    const sourceTitle=sourceItem?.title||'';
    let count=0;
    pc.portals.filter(p=>selectedIds.includes(p.id)).forEach(p=>{
      const addLink=(items)=>{
        items.forEach(it=>{
          const matches=(syncId&&it.syncId===syncId)||(sourceTitle&&it.title===sourceTitle);
          if(matches){
            if(!it.links)it.links=[];
            const existing=it.links.findIndex(l=>l.label===label);
            if(existing>=0)it.links[existing]=link;else it.links.push(link);
            count++;
          }
        });
      };
      (p.sections||[]).forEach(sec=>addLink(sec.items||[]));
      addLink(p.items||[]);
    });
    picker.remove();
    if(count>0){
      _psave();
      btn.textContent='✅';btn.style.color='#166634';
      setTimeout(()=>{btn.textContent='↗';btn.style.color='';},2000);
    } else {
      alert(`Nenhum item chamado "${sourceTitle}" encontrado nas centrais selecionadas.\n\nCrie um item com o mesmo nome nas outras centrais primeiro.`);
    }
  });
  setTimeout(()=>{
    document.addEventListener('click',function h(e){
      if(!picker.contains(e.target)&&e.target!==btn){picker.remove();document.removeEventListener('click',h);}
    });
  },10);
};

// ── VALIDAÇÃO DE BRIEFING ────────────────────────
// Status que exigem briefing preenchido para entrar
// Regras de campo obrigatório por status de destino
const STATUS_FIELD_RULES=[
  {status:'cri-todo',   field:'briefing', label:'Briefing Criativo',    tab:'content', focusSelector:'textarea[name="briefing"]', msg:'Preencha o briefing antes de mover para A Fazer Criativo.'},
  {status:'av-todo',    field:'script',   label:'Roteiro Audiovisual',  tab:'content', focusSelector:'textarea[name="script"]',   msg:'Preencha o roteiro antes de mover para A Fazer Audiovisual.'},
  {status:'review',     field:'briefing', label:'Briefing Criativo',    tab:'content', focusSelector:'textarea[name="briefing"]', msg:'Preencha o briefing antes de enviar para Revisão.'},
  {status:'final-social',field:'briefing',label:'Briefing Criativo',   tab:'content', focusSelector:'textarea[name="briefing"]', msg:'Preencha o briefing antes de finalizar.'},
];

function checkBriefingRequired(card, newStatus){
  const rule=STATUS_FIELD_RULES.find(r=>r.status===newStatus);
  if(!rule)return true;
  if(card[rule.field]&&card[rule.field].trim())return true;
  const stLabel=ST.find(s=>s.id===newStatus)?.label||newStatus;
  openConfirm(
    `📋 ${rule.label} obrigatório`,
    `O card "${card.title||'Sem título'}" não pode ir para "${stLabel}" sem ${rule.label.toLowerCase()} preenchido.\n\n${rule.msg}`,
    ()=>{
      S.modal={open:true,id:card.id,tab:rule.tab};
      render();
      setTimeout(()=>{
        const el=document.querySelector(rule.focusSelector);
        if(el){el.focus();el.scrollIntoView({behavior:'smooth',block:'center'});}
      },80);
    },
    `Preencher ${rule.label.split(' ')[0].toLowerCase()}`,
    'Cancelar'
  );
  return false;
}

function enableKanbanScroll(r){
  const kb=r.querySelector('.kanban');
  if(!kb)return;
  let down=false,startX=0,scrollX=0;
  kb.addEventListener('mousedown',e=>{
    if(e.target.closest('.card')||e.target.closest('button')||e.target.closest('.khead'))return;
    down=true;startX=e.pageX;scrollX=kb.scrollLeft;
    kb.classList.add('kb-dragging');e.preventDefault();
  });
  const up=()=>{if(down){down=false;kb.classList.remove('kb-dragging');}};
  window.addEventListener('mouseup',up,{once:false});
  kb.addEventListener('mouseleave',up);
  kb.addEventListener('mousemove',e=>{
    if(!down)return;
    e.preventDefault();
    kb.scrollLeft=scrollX-(e.pageX-startX);
  });
}

function dnd1(r){
  enableKanbanScroll(r);
  let dragId=null;
  r.querySelectorAll('.card[data-cid]').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=el.dataset.cid;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');dragId=null;});
  });
  r.querySelectorAll('[data-dz]').forEach(z=>{
    z.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';z.classList.add('dover');});
    z.addEventListener('dragleave',()=>z.classList.remove('dover'));
    z.addEventListener('drop',e=>{
      e.preventDefault();z.classList.remove('dover');
      if(!dragId)return;
      const c=S.cards.find(x=>x.id===dragId);
      if(!c||c.status===z.dataset.dz)return;
      if(!checkBriefingRequired(c,z.dataset.dz))return;
      const prevStatus=c.status;
      c.status=z.dataset.dz;
      // Registrar mudança de status no histórico
      const me=AUTH.session||{};
      c.history=[...(c.history||[]),{id:uid(),userId:me.id,userName:me.name,field:'status',oldVal:prevStatus,newVal:c.status,ts:Date.now()}];
      // Notificar aprovador ao entrar em revisão
      if(c.status==='review'&&c.approver){
        const approverUser=AUTH.users.find(u=>u.name===c.approver);
        if(approverUser)pushNotif('assigned',`Card "${c.title}" aguarda sua aprovação`,{cardId:c.id,pipe:'content',targetUserId:approverUser.id});
      }
      // Notificar responsáveis sobre mudança de status
      notifAssigned(c,'content');
      // Disparar automações
      runAutomations(c,'status_change','content');
      save1();render();
    });
  });
}

(function(){

    const root=document.getElementById('root');

    if(!_code){document.getElementById('pub-status-body').innerHTML='<span style="color:#ef4444">Código não informado.</span>';return;}
    // Aguarda Firebase inicializar (max 8s)
    let _waited=0;
    const _tick=setInterval(()=>{
      _waited+=200;
      if(_waited>8000){clearInterval(_tick);document.getElementById('pub-status-body').innerHTML='<span style="color:#ef4444">Não foi possível conectar. Tente novamente.</span>';return;}
      if(typeof _db==='undefined')return;
      clearInterval(_tick);
      _db.collection('requests').get().then(snap=>{
        let found=null;
        snap.forEach(doc=>{
          const d=doc.data();
          if((d.code||'').toUpperCase()===_code)found=d;
        });
        const el=document.getElementById('pub-status-body');
        if(!el)return;
        if(!found){el.innerHTML='<span style="color:#ef4444">Solicitação não encontrada. Verifique o código.</span>';return;}

        const STATUS_COLOR={done:'#16a34a',progress:'#2563eb',approval:'#d97706',standby:'#6366f1',triage:'#64748b'};
        const label=ST_LABELS[found.status]||found.status||'—';

        el.innerHTML=`<div style="margin-bottom:16px"><span style="display:inline-block;padding:6px 18px;border-radius:999px;background:${color}18;color:${color};font-weight:600;font-size:15px">${label}</span></div><table style="width:100%;text-align:left;font-size:13px;border-collapse:collapse">${[['Título',found.requestTitle||'—'],['Tipo',found.orderType||'—'],['Solicitante',found.nome||'—'],['Área',found.setor||'—'],['Prazo desejado',found.desiredDate||'—']].map(([k,v])=>`<tr><td style="padding:6px 8px;color:#94a3b8;white-space:nowrap">${k}</td><td style="padding:6px 8px;color:#0f172a">${v}</td></tr>`).join('')}</table>`;
      }).catch(()=>{const el=document.getElementById('pub-status-body');if(el)el.innerHTML='<span style="color:#ef4444">Erro ao buscar. Tente novamente.</span>';});
    },200);
    return; // não inicializa o resto do app
  }

// ═══════════════════════════════════════════════════════════════════
// ENGINE DE PUBLICAÇÃO AUTOMÁTICA
// Requisito: access token válido na conta conectada.
// Para Instagram/Facebook: image_url deve ser URL pública acessível.
// Limitação: Google Drive links não são URLs públicas diretas —
// substituir por URL de CDN ou storage público para publicação real.
// ═══════════════════════════════════════════════════════════════════

async function publishToInstagram(acc, post) {
  const igUserId = acc.platformId;
  const token = acc.accessToken;
  if (!igUserId || !token) throw new Error('Instagram: platformId e accessToken obrigatórios.');
  const caption = [post.text, post.hashtags].filter(Boolean).join('\n\n');
  // Step 1: create media container
  const createRes = await fetch(`https://graph.facebook.com/v19.0/${igUserId}/media`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({image_url: post.driveLink, caption, access_token: token}),
  });
  const createData = await createRes.json();
  if (createData.error) throw new Error('IG create: ' + createData.error.message);
  // Step 2: publish
  const pubRes = await fetch(`https://graph.facebook.com/v19.0/${igUserId}/media_publish`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({creation_id: createData.id, access_token: token}),
  });
  const pubData = await pubRes.json();
  if (pubData.error) throw new Error('IG publish: ' + pubData.error.message);
  return pubData.id;
}

async function publishToFacebook(acc, post) {
  const pageId = acc.platformId;
  const token = acc.accessToken;
  if (!pageId || !token) throw new Error('Facebook: platformId e accessToken obrigatórios.');
  const message = [post.text, post.hashtags].filter(Boolean).join('\n\n');
  const body = {message, access_token: token};
  if (post.driveLink) body.link = post.driveLink;
  const res = await fetch(`https://graph.facebook.com/v19.0/${pageId}/feed`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (data.error) throw new Error('FB: ' + data.error.message);
  return data.id;
}

async function publishToTikTok(acc, post) {
  const openId = acc.platformId;
  const token = acc.accessToken;
  if (!openId || !token) throw new Error('TikTok: platformId (open_id) e accessToken obrigatórios.');
  // TikTok Content Posting API — direct post
  const res = await fetch('https://open.tiktokapis.com/v2/post/publish/content/init/', {
    method: 'POST',
    headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json; charset=UTF-8'},
    body: JSON.stringify({
      post_info: {title: post.text?.slice(0, 150) || '', privacy_level: 'PUBLIC_TO_EVERYONE',
        disable_comment: post.disableComments || false},
      source_info: {source: 'PULL_FROM_URL', video_url: post.driveLink},
    }),
  });
  const data = await res.json();
  if (data.error?.code && data.error.code !== 'ok') throw new Error('TikTok: ' + JSON.stringify(data.error));
  return data.data?.publish_id;
}

async function publishPost(post) {
  const errors = [];
  const platforms = post.channels || [];
  const accs = S.social_accounts || [];
  let anySuccess = false;

  for (const platform of platforms) {
    const acc = accs.find(a => a.platform === platform && (post.profiles || []).includes(a.id));
    if (!acc) { errors.push(`${platform}: conta não encontrada`); continue; }
    try {
      if (platform === 'instagram') await publishToInstagram(acc, post);
      else if (platform === 'facebook') await publishToFacebook(acc, post);
      else if (platform === 'tiktok') await publishToTikTok(acc, post);
      else { errors.push(`${platform}: plataforma não suportada para publicação automática`); continue; }
      anySuccess = true;
    } catch (e) {
      errors.push(`${platform}: ${e.message}`);
    }
  }
  if (!anySuccess && errors.length) throw new Error(errors.join(' | '));
  return errors; // partial errors (some platforms succeeded, some failed)
}

let _pubSchedulerRunning = false;

async function runPublicationScheduler() {
  if (_pubSchedulerRunning) return;
  _pubSchedulerRunning = true;
  try {
    const now = Date.now();
    const due = (S.social_posts || []).filter(p =>
      ['approved','scheduled'].includes(p.status) && p.scheduledAt && new Date(p.scheduledAt).getTime() <= now
    );
    for (const post of due) {
      post.status = 'publishing';
      try {
        const partialErrors = await publishPost(post);
        post.status = 'published';
        post.publishedAt = Date.now();
        if (partialErrors.length) {
          post.publishNotes = partialErrors.join(' | ');
        }
      } catch (e) {
        post.retryCount = (post.retryCount || 0) + 1;
        if (post.retryCount >= 3) {
          post.status = 'failed';
          post.failReason = e.message;
          // Notificar coordenadora
          const coordinator = (AUTH.users || []).find(u => u.role === 'admin' || u.role === 'coordenador');
          if (coordinator) {
            pushNotif('error', `Publicação falhou após 3 tentativas: "${(post.text || 'post').slice(0, 40)}"`,
              {pipe: 'social', targetUserId: coordinator.id});
          }
        } else {
          post.status = 'approved'; // volta para tentar de novo no próximo ciclo
          post.lastError = e.message;
        }
      }
      save_soc_post();
      render();
    }
  } finally {
    _pubSchedulerRunning = false;
  }
}

// Inicia o scheduler após o login (60s de intervalo)
let _pubSchedulerInterval = null;
function startPublicationScheduler() {
  if (_pubSchedulerInterval) return;
  _pubSchedulerInterval = setInterval(runPublicationScheduler, 60_000);
  runPublicationScheduler(); // executa imediatamente na inicialização
}
function stopPublicationScheduler() {
  if (_pubSchedulerInterval) { clearInterval(_pubSchedulerInterval); _pubSchedulerInterval = null; }
}
