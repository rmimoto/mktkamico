  </div>`:'';

  // Filter platforms by selected account
  const filteredPlats=selAcc
    ? SOCIAL_PLAT.filter(p=>connected.find(a=>a.id===selAcc&&a.platform===p.id)||!connected.find(a=>a.platform===p.id))
    : SOCIAL_PLAT;

  // Token expiry warnings
  const today=new Date(); today.setHours(0,0,0,0);
  const in7=new Date(today); in7.setDate(in7.getDate()+7);
  const expiringAccs=connected.filter(a=>{if(!a.tokenExpiry)return false;const exp=new Date(a.tokenExpiry);return exp<=in7;});
  const tokenWarning=expiringAccs.length?`<div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;">
    <span style="font-size:16px;">⚠️</span>
    <div><div style="font-size:12px;font-weight:700;color:#92400e;">Token de API expirando</div>
    <div style="font-size:11px;color:#78350f;margin-top:2px;">${expiringAccs.map(a=>`<strong>${esc(a.accountName)}</strong> expira em ${a.tokenExpiry}`).join(' · ')} — atualize antes da próxima publicação.</div></div>
  </div>`:'';

  // Failed posts notification
  const failedPosts=(S.social_posts||[]).filter(p=>p.status==='failed');
  const failedBanner=failedPosts.length?`<div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;">
    <span style="font-size:16px;">❌</span>
    <div><div style="font-size:12px;font-weight:700;color:#991b1b;">Publicação falhou</div>
    <div style="font-size:11px;color:#7f1d1d;margin-top:2px;">${failedPosts.length} post(s) falharam após 3 tentativas. Acesse o Calendário para revisar.</div></div>
  </div>`:'';

  return`<div style="flex:1;overflow-y:auto;padding:20px;">
    ${tokenWarning}${failedBanner}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${connected.length?'8':'16'}px;">
      <div>
        <div style="font-size:15px;font-weight:700;color:var(--t1)">Contas conectadas</div>
        <div style="font-size:11px;color:var(--t3);margin-top:2px">${connected.length} de ${SOCIAL_PLAT.length} plataformas</div>
      </div>
    </div>
    ${profileBar}
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;max-width:1100px;margin:0 auto;">
      ${filteredPlats.map(plat=>{
        const acc=connected.find(a=>a.platform===plat.id&&(!selAcc||a.id===selAcc));

          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

async function fetchMetaAnalytics(acc, period){
  // period: 'last_7d' | 'last_30d' | 'last_90d'
  if(!acc||!acc.accessToken||!acc.platformId)return null;
  const days={'last_7d':7,'last_30d':30,'last_90d':90}[period]||30;
  const until=Math.floor(Date.now()/1000);
  const since=until-days*86400;
  const igId=acc.platformId;
  const token=acc.accessToken;
  // Fields: impressions, reach, follower_count, likes via media insights aggregation
  // Use /{ig-user-id}?fields=followers_count,media_count for account-level
  try{
    const [profileRes, mediaRes]=await Promise.all([
      fetch(`https://graph.facebook.com/v19.0/${igId}?fields=followers_count,media_count,username&access_token=${token}`),
      fetch(`https://graph.facebook.com/v19.0/${igId}/media?fields=id,like_count,comments_count,timestamp&since=${since}&until=${until}&limit=50&access_token=${token}`)
    ]);
    const profile=await profileRes.json();
    const media=await mediaRes.json();
    if(profile.error||media.error)return{error:profile.error?.message||media.error?.message};
    const posts=media.data||[];
    const totalLikes=posts.reduce((a,p)=>a+(p.like_count||0),0);
    const totalComments=posts.reduce((a,p)=>a+(p.comments_count||0),0);
    // Insights endpoint for reach/impressions on account level
    let reach=null,impressions=null;
    try{
      const insRes=await fetch(`https://graph.facebook.com/v19.0/${igId}/insights?metric=impressions,reach&period=day&since=${since}&until=${until}&access_token=${token}`);
      const ins=await insRes.json();
      if(!ins.error&&ins.data){
        const sumVals=arr=>(arr||[]).reduce((a,v)=>a+v,0);
        (ins.data||[]).forEach(d=>{
          const vals=d.values?.map(v=>v.value)||[];
          if(d.name==='impressions')impressions=sumVals(vals);
          if(d.name==='reach')reach=sumVals(vals);
        });
      }
    }catch(_){}
    return{followers:profile.followers_count,mediaCount:profile.media_count,username:profile.username,likes:totalLikes,comments:totalComments,posts:posts.length,reach,impressions,period,fetched:Date.now()};
  }catch(e){return{error:e.message};}
}

    music:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
    play:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
    warning:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="13" height="13"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    xcirc:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="13" height="13"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
  };

  if(!S.windsor_api_key){
    return`<div class="dash-wrap" style="display:flex;align-items:center;justify-content:center;">
      <div style="text-align:center;max-width:320px;">
        <div style="color:var(--t3);margin-bottom:14px;display:flex;justify-content:center;">${ASVG.plug}</div>
        <div style="font-size:14px;font-weight:700;color:var(--t1);margin-bottom:6px;">Windsor.ai não configurado</div>
        <div style="font-size:12px;color:var(--t3);margin-bottom:16px;">Configure sua API Key para carregar analytics reais de Instagram, TikTok e YouTube.</div>
        <button data-action="open-config" style="background:var(--ac);color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;">${ASVG.settings} Abrir Configurações</button>
      </div>
    </div>`;
  }

  const period=S.windsor_period||'last_30d';
  const periodLabels={'last_7d':'7 dias','last_30d':'30 dias','last_90d':'90 dias'};
  const wd=S.windsor_data;

  const updatedStr=wd?.updated?`Atualizado ${new Date(wd.updated).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`:'Nunca atualizado';
  const header=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:24px;">
    <div style="font-size:18px;font-weight:800;color:var(--t1);flex:1;min-width:120px;letter-spacing:-.3px;">Analytics</div>
    <div style="display:flex;gap:4px;">
      ${['last_7d','last_30d','last_90d'].map(p=>`<button data-windsor-period="${p}" style="background:${period===p?'var(--ac)':'var(--s2)'};color:${period===p?'#fff':'var(--t2)'};border:1px solid ${period===p?'var(--ac)':'var(--b)'};border-radius:6px;padding:5px 11px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;">${periodLabels[p]}</button>`).join('')}
    </div>
    <button data-action="windsor-refresh" style="background:var(--s2);border:1px solid var(--b);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;">${ASVG.refresh} Atualizar</button>
    <span style="font-size:10px;color:var(--t3);">${esc(updatedStr)}</span>
  </div>`;

  if(S.windsor_loading){
    const retryMsg=S.windsor_data?._retrying||'';
    return`<div class="dash-wrap">${header}
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;gap:12px;">
        <span class="ai-spinner" style="width:28px;height:28px;border-width:3px;"></span>
        <span style="font-size:13px;color:var(--t3);">Carregando dados Windsor...</span>
        ${retryMsg?`<span style="font-size:11px;color:var(--ac);font-weight:600;">${esc(retryMsg)}</span>`:''}
      </div>
    </div>`;
  }

  if(!wd){
    return`<div class="dash-wrap">${header}
      <div style="text-align:center;padding:50px 0;color:var(--t3);">
        <div style="margin-bottom:10px;display:flex;justify-content:center;">${ASVG.barchart}</div>
        <div style="font-size:13px;font-weight:600;color:var(--t2);margin-bottom:4px;">Nenhum dado carregado</div>
        <div style="font-size:11px;">Clique em "Atualizar" para buscar os dados.</div>
      </div>
    </div>`;
  }

  const errBanner=wd.errors&&wd.errors.length?`<div style="background:${wd.partial?'#fffbeb':'#fef2f2'};border:1px solid ${wd.partial?'#fde68a':'#fecaca'};border-radius:10px;padding:12px 14px;font-size:12px;margin-bottom:16px;">
    <div style="font-weight:700;color:${wd.partial?'#854d0e':'#991b1b'};margin-bottom:4px;display:flex;align-items:center;gap:5px;">${wd.partial?ASVG.warning:ASVG.xcirc} ${wd.partial?'Dados parcialmente atualizados':'Erro ao carregar'}</div>
    ${wd.errors.map(e=>`<div style="color:${wd.partial?'#92400e':'#7f1d1d'};margin-top:2px;">· ${esc(e)}</div>`).join('')}
    ${!wd.partial?`<div style="margin-top:6px;font-size:11px;color:#7f1d1d;">Verifique a API key em Configurações → Integrações.</div>`:''}
  </div>`:'';
  if(wd.errors&&!wd.instagram.length&&!wd.tiktok.length&&!wd.youtube.length){
    return`<div class="dash-wrap">${header}${errBanner}</div>`;
  }

  const ig=wd.instagram||[];
  const tt=wd.tiktok||[];
  const yt=wd.youtube||[];

  const totalViews=sumField(ig,'views')+sumField(tt,'video_views')+sumField(yt,'views');
  const totalReach=sumField(ig,'reach');
  const totalInteractions=sumField(ig,'total_interactions')+sumField(tt,'likes')+sumField(tt,'comments')+sumField(tt,'shares')+sumField(yt,'likes')+sumField(yt,'comments');
  const igFollowers=Object.values(Object.fromEntries(
    ig.filter(r=>Number(r.followers_count)>0).map(r=>[r.account_name,Number(r.followers_count)])
  )).reduce((a,b)=>a+b,0);
  const igGained=Object.values(Object.fromEntries(
    ig.filter(r=>Number(r.follower_gained)>0).map(r=>[r.account_name,Number(r.follower_gained)])
  )).reduce((a,b)=>a+b,0);
  const ttFollowers=Object.values(Object.fromEntries(
    tt.filter(r=>Number(r.total_followers_count)>0).map(r=>[r.account_name,Number(r.total_followers_count)])
  )).reduce((a,b)=>a+b,0);
  const totalFollowers=igFollowers+ttFollowers;

  const kpiSection=`<div class="dash-kpi-row" style="margin-bottom:28px;">
    ${[
      {label:'Views',value:fmt(totalViews),sub:'todas as plataformas',color:'#6366f1',svg:ASVG.eye},
      {label:'Reach',value:fmt(totalReach),sub:'Instagram',color:'#e1306c',svg:ASVG.signal},
      {label:'Interações',value:fmt(totalInteractions),sub:'likes + comments + shares',color:'#f59e0b',svg:ASVG.heart},
      {label:'Seguidores',value:fmt(totalFollowers),sub:igGained>0?`+${fmt(igGained)} em 30d · IG + TikTok`:'IG + TikTok',color:'#10b981',svg:ASVG.users},
    ].map(k=>`<div class="dash-kpi-card">
      <div>
        <div class="dash-kpi-label">${k.label}</div>
        <div class="dash-kpi-num">${k.value}</div>
        <div class="dash-kpi-sub">${k.sub}</div>
      </div>
    </div>`).join('')}
  </div>`;

  const barChart=(data,field,color,platName,platSvg)=>{
    const byDate={};
    data.forEach(r=>{if(r.date){if(!byDate[r.date])byDate[r.date]=0;byDate[r.date]+=Number(r[field])||0;}});
    const dates=Object.keys(byDate).sort().slice(-14);
    if(!dates.length)return`<div class="dash-chart-card" style="display:flex;align-items:center;justify-content:center;min-height:160px;">
      <div style="text-align:center;color:var(--t3);">
        <div style="margin-bottom:6px;display:flex;justify-content:center;">${platSvg}</div>
        <div style="font-size:11px;">Sem dados de ${platName}</div>
      </div>
    </div>`;
    const maxVal=Math.max(...dates.map(d=>byDate[d]),1);
    const total=dates.reduce((a,d)=>a+byDate[d],0);
    const avg=Math.round(total/dates.length);
    const peak=Math.max(...dates.map(d=>byDate[d]));
    const peakDate=dates.find(d=>byDate[d]===peak);
    return`<div class="dash-chart-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;">
        <div>
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px;">
            <span style="color:${color};display:flex;">${platSvg}</span>
            <span style="font-size:13px;font-weight:800;color:var(--t1);">${platName}</span>
          </div>
          <div style="font-size:10px;color:var(--t3);">últimos ${dates.length} dias</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:20px;font-weight:900;color:var(--t1);line-height:1;">${fmt(total)}</div>
          <div style="font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;">views totais</div>
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-bottom:16px;padding:10px 12px;background:${color}08;border-radius:8px;">
        <div style="flex:1;text-align:center;">
          <div style="font-size:13px;font-weight:800;color:var(--t1);">${fmt(avg)}</div>
          <div style="font-size:9px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;">média/dia</div>
        </div>
        <div style="width:1px;background:var(--b);"></div>
        <div style="flex:1;text-align:center;">
          <div style="font-size:13px;font-weight:800;color:${color};">${fmt(peak)}</div>
          <div style="font-size:9px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;">pico</div>
        </div>
        <div style="width:1px;background:var(--b);"></div>
        <div style="flex:1;text-align:center;">
          <div style="font-size:13px;font-weight:800;color:var(--t1);">${peakDate?.slice(5)||'—'}</div>
          <div style="font-size:9px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;">melhor dia</div>
        </div>
      </div>
      <div style="display:flex;align-items:flex-end;gap:3px;height:80px;margin-bottom:6px;">
        ${dates.map(d=>{
          const h=Math.max(4,Math.round((byDate[d]/maxVal)*100));
          const isPeak=byDate[d]===peak;
          return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;position:relative;">
            <div title="${d.slice(5)}: ${fmt(byDate[d])}" style="width:100%;background:${isPeak?color:color+'60'};border-radius:3px 3px 0 0;height:${h}%;transition:background .15s;cursor:default;" onmouseover="this.style.background='${color}'" onmouseout="this.style.background='${isPeak?color:color+'60'}'"></div>
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;">
        <span style="font-size:9px;color:var(--t3);">${dates[0]?.slice(5)||''}</span>
        <span style="font-size:9px;color:var(--t3);">${dates[Math.floor(dates.length/2)]?.slice(5)||''}</span>
        <span style="font-size:9px;color:var(--t3);">${dates[dates.length-1]?.slice(5)||''}</span>
      </div>
    </div>`;
  };

  const charts=`<div style="margin-bottom:28px;">
    <div class="dash-section-label" style="margin-bottom:14px;">Tendência de Views</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
      ${barChart(ig,'views','#e1306c','Instagram',ASVG.camera)}
      ${barChart(tt,'video_views','#111111','TikTok',ASVG.music)}
      ${barChart(yt,'views','#ff0000','YouTube',ASVG.play)}
    </div>
  </div>`;

  const platformSection=(data,platColor,platName,platSvg,fields)=>{
    if(!data.length)return'';
    const byAcc=groupBy(data,'account_name');
    const accs=Object.entries(byAcc);
    return`<div style="margin-bottom:28px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--b);">
        <div style="width:32px;height:32px;border-radius:8px;background:${platColor};display:flex;align-items:center;justify-content:center;color:#fff;">${platSvg}</div>
        <div>
          <div style="font-size:13px;font-weight:800;color:var(--t1);">${platName}</div>
          <div style="font-size:10px;color:var(--t3);">${accs.length} conta${accs.length!==1?'s':''}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;">
        ${accs.map(([acc,rows])=>{
          const fv=f=>fmt(sumField(rows,f));
          return`<div style="background:var(--s1);border:1px solid var(--b);border-radius:12px;overflow:hidden;">
            <div style="background:${platColor}12;border-bottom:2px solid ${platColor}30;padding:12px 14px;display:flex;align-items:center;gap:10px;">
              <div style="width:32px;height:32px;border-radius:50%;background:${platColor};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;flex-shrink:0;">${esc(acc).replace('@','').substring(0,2).toUpperCase()}</div>
              <div style="font-size:12px;font-weight:700;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">@${esc(acc)}</div>
            </div>
            <div style="padding:12px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
              ${fields.filter(f=>f.key).map(f=>{
                const isSnap=['total_followers_count','followers_count','subscriber_count'].includes(f.key);
                const isLost=f.key==='daily_lost_followers';
                const isGain=f.key==='daily_total_followers';
                const val=fv(f.key);
                return`<div>
                  <div style="font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;">${f.label}</div>
                  <div style="font-size:16px;font-weight:800;color:${isLost?'#dc2626':isGain?'#10b981':'var(--t1)'};">${isLost&&val!=='—'&&val!=='0'?'-'+val:isGain&&val!=='—'&&val!=='0'?'+'+val:val}</div>
                  <div style="font-size:8px;color:var(--t3);margin-top:1px;">${isSnap?'atual':'∑ '+periodLabels[period]}</div>
                </div>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  };

  const IG_GROUPS=[
    {label:'Institucional',   color:'#1c1c1c', accounts:['kamicogroup']},
    {label:'Marca Própria',   color:'#c8192b', accounts:['balensbrand','thesmoothedit','958brand']},
    {label:'Distribuidora BR',color:'#009c3b', accounts:['kamicobrasil','toctus_kamico']},
    {label:'Distribuidora PT',color:'#d60000', accounts:['kamicoportugal','cadiveuportugal','purhairportugal']},
  ];
  const HANDLE_TO_PROJ={
    'kamicogroup':    'KAMI CO. Group',
    'balensbrand':    'Balens',
    'thesmoothedit':  'The Smooth Edit',
    '958brand':       '958',
    'kamicobrasil':   'KAMI CO. BR',
    'toctus_kamico':  'Toctus BR',
    'kamicoportugal': 'KAMI CO. PT',
    'cadiveuportugal':'Cadiveu PT',
    'purhairportugal':'Pur Hair',
  };
  const getHandle=name=>(name.match(/\(([^)]+)\)/)||[])[1]||name.toLowerCase().replace(/\s+/g,'');
  const igByAcc=groupBy(ig,'account_name');
  const igFields=[
    {label:'Seguidores',key:'followers_count'},{label:'+ Seguid. 30d',key:'follower_gained'},{label:'Views',key:'views'},
    {label:'Reach',key:'reach'},{label:'Likes',key:'likes'},{label:'Saves',key:'saves'},
  ];
  const renderIgGroup=(group)=>{
    const groupAccs=Object.entries(igByAcc).filter(([acc])=>group.accounts.includes(getHandle(acc)));
    if(!groupAccs.length)return'';
    return`<div style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px;">
        <div style="width:8px;height:8px;border-radius:50%;background:${group.color};"></div>
        <span style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;">${group.label}</span>
        <span style="font-size:10px;color:var(--t3);">${groupAccs.length} conta${groupAccs.length>1?'s':''}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${groupAccs.map(([acc,rows])=>{
          const fv=f=>fmt(sumField(rows,f));
          const handle=getHandle(acc);
          const proj=HANDLE_TO_PROJ[handle]||null;
          const pc=proj?projColor(proj):{bg:group.color+'18',color:group.color};
          const lightBg=['#ffffff','#f3f4f6','#fdf6ec','#f5f0e8','#fef9c3','#fed7aa'].includes(pc.bg);
          const accentColor=lightBg?group.color:pc.color==='#ffffff'?group.color:pc.color;
          const textColor=lightBg?'var(--t1)':pc.color;
          return`<div style="background:var(--s1);border:1px solid var(--b);border-left:3px solid ${accentColor};border-radius:12px;overflow:hidden;">
            <div style="background:${pc.bg};padding:10px 14px;display:flex;align-items:center;gap:8px;">
              <div style="width:28px;height:28px;border-radius:50%;background:${accentColor};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;flex-shrink:0;">${esc(acc).replace('@','').substring(0,2).toUpperCase()}</div>
              <div style="font-size:11px;font-weight:700;color:${textColor};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">@${esc(handle)}</div>
            </div>
            <div style="padding:10px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
              ${igFields.filter(f=>f.key).map(f=>{
                const isSnap=f.key==='followers_count';
                const isGain=f.key==='follower_gained';
                const val=fv(f.key);
                return`<div>
                  <div style="font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;">${f.label}</div>
                  <div style="font-size:15px;font-weight:800;color:${isGain&&val!=='—'&&val!=='0'?'#10b981':'var(--t1)'};">${isGain&&val!=='—'&&val!=='0'?'+'+val:val}</div>
                  <div style="font-size:8px;color:var(--t3);margin-top:1px;">${isSnap?'atual':isGain?'∑ 30d':'∑ '+periodLabels[period]}</div>
                </div>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  };

  const igBreakdown=`<div style="margin-bottom:28px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--b);">
      <div style="width:32px;height:32px;border-radius:8px;background:#e1306c;display:flex;align-items:center;justify-content:center;color:#fff;">${ASVG.camera}</div>
      <div><div style="font-size:13px;font-weight:800;color:var(--t1);">Instagram</div>
      <div style="font-size:10px;color:var(--t3);">${Object.keys(igByAcc).length} contas · 4 grupos</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
      <div>${renderIgGroup(IG_GROUPS[0])}${renderIgGroup(IG_GROUPS[1])}</div>
      <div>${renderIgGroup(IG_GROUPS[2])}${renderIgGroup(IG_GROUPS[3])}</div>
    </div>
  </div>`;
  const ttBreakdown=platformSection(tt,'#111111','TikTok Organic',ASVG.music,[
    {label:'Seguidores',key:'total_followers_count'},{label:'Novos segs',key:'daily_total_followers'},{label:'Saíram',key:'daily_lost_followers'},
    {label:'Views',key:'video_views'},{label:'Likes',key:'likes'},{label:'Coment.',key:'comments'},
  ]);
  const ytBreakdown=platformSection(yt,'#ff0000','YouTube',ASVG.play,[
    {label:'Views',key:'views'},{label:'Likes',key:'likes'},{label:'Coment.',key:'comments'},
    {label:'Shares',key:'shares'},{label:'Subs +',key:'subscribers_gained'},{label:'Min. Watch',key:'estimated_minutes_watched'},
  ]);

  // Meta Graph API panel (for accounts with accessToken configured)
  const connectedAccs=(S.social_accounts||[]).filter(a=>a.accessToken&&a.platformId&&(a.platform==='instagram'||a.platform==='facebook'));
  let metaPanel='';
  if(connectedAccs.length){
    const cache=S.meta_analytics_cache||{};
    const currentPeriod=S.windsor_period||'last_30d';
    const metaCards=connectedAccs.map(acc=>{
      const ckey=acc.id+'_'+currentPeriod;
      const d=cache[ckey];
      if(!d){
        return`<div style="border:1px solid var(--b);border-radius:10px;padding:16px;background:var(--s2);min-width:200px;">
          <div style="font-size:12px;font-weight:700;color:var(--t1);margin-bottom:8px;">${esc(acc.name||acc.handle||acc.platform)}</div>
          <div style="font-size:11px;color:var(--t3);">Clique em Atualizar para buscar dados via Meta API</div>
          <button data-action="meta-fetch-acc" data-acc-id="${esc(acc.id)}" style="margin-top:10px;background:var(--ac);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;">Buscar</button>

async function fetchWindsorData(){
  if(!S.windsor_api_key)return;
  S.windsor_loading=true;render();
  const period=S.windsor_period||'last_30d';
  const base='https://connectors.windsor.ai';

  // Converter period em date_from / date_to
  const periodDays={'last_7d':7,'last_30d':30,'last_90d':90};
  const days=periodDays[period]||30;
  const dateTo=new Date();
  const dateFrom=new Date(dateTo);dateFrom.setDate(dateTo.getDate()-days);
  const fmt2=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const df=fmt2(dateFrom),dt=fmt2(dateTo);
  const key=encodeURIComponent(S.windsor_api_key);

  const fetchWithTimeout=(url,ms=25000)=>{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),ms);
    return fetch(url,{signal:ctrl.signal}).finally(()=>clearTimeout(timer));
  };

  const safeGet=async(url,retries=3)=>{
    let lastError='';
    for(let attempt=1;attempt<=retries;attempt++){
      try{
        const res=await fetchWithTimeout(url,25000);
        if(!res.ok){
          let txt='';try{txt=await res.text();}catch(e2){}
          // Não tenta novamente em erros 4xx (cliente) — só 5xx (servidor)
          if(res.status<500)return{error:`HTTP ${res.status}${txt?' — '+txt.slice(0,180):''}`,data:[]};
          lastError=`HTTP ${res.status}`;
        } else {
          const json=await res.json();
          return{data:Array.isArray(json)?json:(json.data||json.result||[])};
        }
      }catch(e){
        lastError=e.name==='AbortError'?`Timeout tentativa ${attempt}/3`:String(e);
      }
      if(attempt<retries){
        // Espera exponencial: 1s, 2s, 4s
        await new Promise(res=>setTimeout(res,1000*Math.pow(2,attempt-1)));
        S.windsor_data={...S.windsor_data,_retrying:`Tentativa ${attempt+1}/3...`};
        render();
      }
    }
    return{error:`${lastError} (após ${retries} tentativas)`,data:[]};
  };

  // followers_count só suporta últimos 30 dias — busca separada com janela fixa
  const foll30From=fmt2(new Date(dateTo.getTime()-29*86400000));
  const [ig,tt,yt,igFollowers]=await Promise.all([
    safeGet(`${base}/instagram?api_key=${key}&date_from=${df}&date_to=${dt}&fields=account_name,date,views,reach,likes,comments,saves,shares,total_interactions`),
    safeGet(`${base}/tiktok_organic?api_key=${key}&date_from=${df}&date_to=${dt}&fields=account_name,date,video_views,likes,comments,shares,total_followers_count,daily_total_followers,daily_lost_followers`),
    safeGet(`${base}/youtube?api_key=${key}&date_from=${df}&date_to=${dt}&fields=account_name,date,views,likes,comments,shares,estimated_minutes_watched,subscribers_gained`),
    safeGet(`${base}/instagram?api_key=${key}&date_from=${foll30From}&date_to=${dt}&fields=account_name,date,followers_count,follower_count_1d`),
  ]);

  const errors=[ig,tt,yt].filter(r=>r.error).map(r=>r.error);
  const prev=S.windsor_data||{}; // dados anteriores — usados como fallback se endpoint falhar

  // Processar Instagram apenas se não houve erro
  let igMerged=ig.error?(prev.instagram||[]):(() => {
    const follMap={},follGainMap={};
    (igFollowers.data||[]).forEach(r=>{
      if(!r.account_name||!r.date)return;
      if(!follMap[r.account_name]||r.date>follMap[r.account_name].date)
        follMap[r.account_name]={date:r.date,count:Number(r.followers_count)||0};
      if(Number(r.follower_count_1d)>0)
        follGainMap[r.account_name]=(follGainMap[r.account_name]||0)+Number(r.follower_count_1d);
    });
    const latestDateByAcc={};
    (ig.data||[]).forEach(r=>{if(r.account_name&&r.date&&(!latestDateByAcc[r.account_name]||r.date>latestDateByAcc[r.account_name]))latestDateByAcc[r.account_name]=r.date;});
    return (ig.data||[]).map(r=>({
      ...r,
      followers_count:r.date===latestDateByAcc[r.account_name]?(follMap[r.account_name]?.count||0):0,
      follower_gained:r.date===latestDateByAcc[r.account_name]?(follGainMap[r.account_name]||0):0,
    }));
  })();

  // Processar TikTok apenas se não houve erro
  let ttMerged=tt.error?(prev.tiktok||[]):(() => {
    const ttData=tt.data||[];
    const ttLatestDate={};
    ttData.forEach(r=>{if(r.account_name&&r.date&&(!ttLatestDate[r.account_name]||r.date>ttLatestDate[r.account_name]))ttLatestDate[r.account_name]=r.date;});
    return ttData.map(r=>({...r,total_followers_count:r.date===ttLatestDate[r.account_name]?Number(r.total_followers_count||0):0}));
  })();

  // YouTube: preservar dados anteriores se falhou
  const ytFinal=yt.error?(prev.youtube||[]):(yt.data||[]);

  // Construir erros com indicação de fallback
  const errMessages=[];
  if(ig.error)errMessages.push(`Instagram: ${ig.error}${prev.instagram?.length?' (exibindo dados anteriores)':''}`);
  if(tt.error)errMessages.push(`TikTok: ${tt.error}${prev.tiktok?.length?' (exibindo dados anteriores)':''}`);
  if(yt.error)errMessages.push(`YouTube: ${yt.error}${prev.youtube?.length?' (exibindo dados anteriores)':''}`);

  S.windsor_data={
    instagram:igMerged,
    tiktok:ttMerged,
    youtube:ytFinal,
    errors:errMessages.length?errMessages:null,
    updated:Date.now(),
    period,
    partial:errMessages.length>0, // indica que alguns dados são do cache anterior
  };
  S.windsor_loading=false;render();
}

        ${nextTrade?`<div style="font-size:10px;color:var(--t3);margin-top:2px;">${new Date(nextTrade.date+'T00:00:00').toLocaleDateString('pt-BR')}</div>`:''}
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div style="font-size:12px;font-weight:700;color:var(--t1);">Histórico de ações</div>
      ${!showTradeForm?`<button data-action="trade-new" data-cid="${c.id}" style="background:var(--ac);color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;">+ Nova ação</button>`:''}
    </div>
    ${tradeFormHtml}
    <div style="border:1px solid var(--b);border-radius:8px;overflow:hidden;background:var(--s1);">
      ${tradeList.length>0?`<div style="display:grid;grid-template-columns:95px 1fr 130px 110px 60px;gap:10px;padding:8px 12px;background:var(--s2);font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;">
        <span>Data</span><span>Ação</span><span>Tipo</span><span>Status</span><span></span>
      </div>`:''}
      ${tradeList.length?tradeList.map(a=>`<div style="display:grid;grid-template-columns:95px 1fr 130px 110px 60px;align-items:start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--b);font-size:12px;">
        <div style="color:var(--t3);padding-top:1px;">${a.date?new Date(a.date+'T00:00:00').toLocaleDateString('pt-BR'):'—'}</div>
        <div>
          <div style="font-weight:600;color:var(--t1);">${esc(a.title||'')}</div>
          ${a.desc?`<div style="font-size:10px;color:var(--t3);margin-top:2px;">${esc(a.desc)}</div>`:''}
          ${a.result?`<div style="font-size:10px;color:var(--t2);margin-top:3px;font-style:italic;">"${esc(a.result)}"</div>`:''}
        </div>
        <div style="padding-top:1px;">${a.type?`<span style="font-size:10px;color:var(--t3);">${esc(a.type)}</span>`:'—'}</div>
        <div style="padding-top:1px;">${a.status?tradeBadge(a.status):'—'}</div>
        <div style="display:flex;gap:4px;justify-content:flex-end;">
          <button data-action="trade-edit" data-cid="${c.id}" data-pid="${a.id}" title="Editar" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px;">✎</button>
          <button data-action="trade-del" data-cid="${c.id}" data-pid="${a.id}" title="Excluir" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px;">✕</button>
        </div>
      </div>`).join(''):`<div style="text-align:center;padding:32px;color:var(--t3);">
        <div style="font-size:11px;font-weight:600;margin-bottom:4px;">Nenhuma ação registrada</div>
        <div style="font-size:11px;">Clique em "+ Nova ação" para começar</div>
      </div>`}
    </div>`;

  // ── Tab: NPS & CSAT ─────────────────────────────────────
  // cores por nota — escala gradual vermelho→laranja→amarelo→verde
  const NPS_COLORS=_NPS_COLORS;
  const CSAT_COLORS=_CSAT_COLORS;
  const npsClass=(s)=>s<=6?{...NPS_COLORS[s],label:'Detrator'}:s<=8?{...NPS_COLORS[s],label:'Neutro'}:{...NPS_COLORS[s],label:'Promotor'};
  const csatClass=(s)=>s<=2?{...CSAT_COLORS[s],label:'Insatisfeito'}:s===3?{...CSAT_COLORS[s],label:'Neutro'}:{...CSAT_COLORS[s],label:'Satisfeito'};
  const npsTag=(s)=>{const cl=npsClass(s);return`<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:${cl.bg};color:${cl.color};">${cl.label}</span>`;};
  const csatTag=(s)=>{const cl=csatClass(s);return`<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:${cl.bg};color:${cl.color};">${cl.label}</span>`;};

  const npsList=(c.nps_surveys||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const csatList=(c.csat_surveys||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const avgNps=npsList.length?Math.round(npsList.reduce((s,p)=>s+p.score,0)/npsList.length*10)/10:null;
  const avgCsat=csatList.length?Math.round(csatList.reduce((s,p)=>s+p.score,0)/csatList.length*10)/10:null;
  const lastNps=npsList[0];const lastCsat=csatList[0];

  // NPS score selector (0-10)
  const npsForm=S.customer_nps_form;
  const showNpsForm=npsForm.open&&npsForm.cid===c.id;
  const editNps=showNpsForm&&npsForm.editId?(c.nps_surveys||[]).find(p=>p.id===npsForm.editId):null;
  const npsScoreVal=editNps?.score??null;

  // CSAT score selector (1-5)
  const csatForm=S.customer_csat_form;
  const showCsatForm=csatForm.open&&csatForm.cid===c.id;
  const editCsat=showCsatForm&&csatForm.editId?(c.csat_surveys||[]).find(p=>p.id===csatForm.editId):null;
  const csatScoreVal=editCsat?.score??null;

  const npsFormHtml=showNpsForm?`<div style="background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:16px;margin-bottom:14px;">
    <div style="font-size:12px;font-weight:700;color:var(--t1);margin-bottom:12px;">${editNps?'Editar pesquisa NPS':'Nova pesquisa NPS'}</div>
    <div class="cmodal-grid" style="margin-bottom:12px;">
      <div class="cfield"><label>Data <span style="color:var(--ac)">*</span></label><input id="nps-date" type="date" value="${esc(editNps?.date||new Date().toISOString().slice(0,10))}"></div>
      <div class="cfield"><label>Motivo / contexto</label><input id="nps-context" type="text" value="${esc(editNps?.context||'')}" placeholder="Ex: pós-evento, pós-compra..."></div>
    </div>
    <div class="cfield" style="margin-bottom:12px;">
      <label>Nota NPS (0–10) <span style="color:var(--ac)">*</span></label>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;" id="nps-score-btns">
        ${Array.from({length:11},(_,i)=>{const cl=npsClass(i);const sel=npsScoreVal===i;return`<button type="button" data-action="nps-score-pick" data-val="${i}" style="width:36px;height:36px;border-radius:6px;border:2px solid ${sel?cl.color:'var(--b)'};background:${sel?cl.bg:'var(--s1)'};color:${sel?cl.color:'var(--t2)'};font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.1s;">${i}</button>`;}).join('')}
      </div>
      <input type="hidden" id="nps-score" value="${npsScoreVal??''}">
    </div>
    <div class="cfield" style="margin-bottom:12px;"><label>Comentário do cliente</label><textarea id="nps-notes" placeholder="O que o cliente disse?">${esc(editNps?.notes||'')}</textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button data-action="nps-cancel" style="background:none;border:1px solid var(--b);border-radius:6px;padding:6px 14px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--t2);">Cancelar</button>
      <button data-action="nps-save" data-cid="${c.id}" data-pid="${editNps?.id||''}" style="background:var(--ac);color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;">${editNps?'Salvar':'Registrar NPS'}</button>
    </div>
  </div>`:'';

  const csatFormHtml=showCsatForm?`<div style="background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:16px;margin-bottom:14px;">
    <div style="font-size:12px;font-weight:700;color:var(--t1);margin-bottom:12px;">${editCsat?'Editar pesquisa CSAT':'Nova pesquisa CSAT'}</div>
    <div class="cmodal-grid" style="margin-bottom:12px;">
      <div class="cfield"><label>Data <span style="color:var(--ac)">*</span></label><input id="csat-date" type="date" value="${esc(editCsat?.date||new Date().toISOString().slice(0,10))}"></div>
      <div class="cfield"><label>O que foi avaliado</label><input id="csat-context" type="text" value="${esc(editCsat?.context||'')}" placeholder="Ex: atendimento, entrega, produto..."></div>
    </div>
    <div class="cfield" style="margin-bottom:12px;">
      <label>Nota CSAT (1–5) <span style="color:var(--ac)">*</span></label>
      <div style="display:flex;gap:10px;margin-top:8px;">
        ${[1,2,3,4,5].map(i=>{const sel=csatScoreVal===i;const cl=csatClass(i);return`<button type="button" data-action="csat-score-pick" data-val="${i}" style="width:44px;height:44px;border-radius:6px;border:2px solid ${sel?cl.color:'var(--b)'};background:${sel?cl.bg:'var(--s1)'};color:${sel?cl.color:'var(--t2)'};font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.1s;">${i}</button>`;}).join('')}
      </div>
      <input type="hidden" id="csat-score" value="${csatScoreVal??''}">
    </div>
    <div class="cfield" style="margin-bottom:12px;"><label>Comentário do cliente</label><textarea id="csat-notes" placeholder="O que o cliente disse?">${esc(editCsat?.notes||'')}</textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button data-action="csat-cancel" style="background:none;border:1px solid var(--b);border-radius:6px;padding:6px 14px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--t2);">Cancelar</button>
      <button data-action="csat-save" data-cid="${c.id}" data-pid="${editCsat?.id||''}" style="background:var(--ac);color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;">${editCsat?'Salvar':'Registrar CSAT'}</button>
    </div>
  </div>`:'';

  const mkSurveyRow=(p,type)=>`<div style="display:grid;grid-template-columns:100px 80px 1fr 100px 60px;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--b);font-size:12px;">
    <div style="color:var(--t3);">${p.date?new Date(p.date+'T00:00:00').toLocaleDateString('pt-BR'):'—'}</div>
    <div style="font-size:20px;font-weight:800;color:var(--t1);text-align:center;">${p.score}</div>
    <div>
      ${type==='nps'?npsTag(p.score):csatTag(p.score)}
      ${p.context?`<div style="font-size:10px;color:var(--t3);margin-top:2px;">${esc(p.context)}</div>`:''}
      ${p.notes?`<div style="font-size:10px;color:var(--t2);margin-top:2px;font-style:italic;">"${esc(p.notes)}"</div>`:''}
    </div>
    <div></div>
    <div style="display:flex;gap:4px;justify-content:flex-end;">
      <button data-action="${type}-edit" data-cid="${c.id}" data-pid="${p.id}" title="Editar" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px;">✎</button>
      <button data-action="${type}-del" data-cid="${c.id}" data-pid="${p.id}" title="Excluir" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px;">✕</button>
    </div>
  </div>`;

  // Promoter score (% promotores - % detratores)
  const promoters=npsList.filter(p=>p.score>=9).length;
  const detractors=npsList.filter(p=>p.score<=6).length;
  const npsScore=npsList.length?Math.round(((promoters-detractors)/npsList.length)*100):null;

  const tabNpsCsat=`
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;">
      <div class="dash-kpi-card" style="padding:12px 14px;">
        <div class="dash-kpi-label">NPS Score</div>
        <div class="dash-kpi-num" style="font-size:20px;color:${npsScore===null?'var(--t1)':npsScore>=50?'#16a34a':npsScore>=0?'#d97706':'#dc2626'};">${npsScore===null?'—':npsScore}</div>
        ${npsScore!==null?`<div style="font-size:10px;color:var(--t3);margin-top:2px;">${npsScore>=50?'Excelente':npsScore>=0?'Precisa melhorar':'Crítico'}</div>`:''}
      </div>
      <div class="dash-kpi-card" style="padding:12px 14px;">
        <div class="dash-kpi-label">Média NPS</div>
        <div class="dash-kpi-num" style="font-size:20px;">${avgNps??'—'}</div>
        <div style="font-size:10px;color:var(--t3);margin-top:2px;">${npsList.length} pesquisa${npsList.length!==1?'s':''}</div>
      </div>
      <div class="dash-kpi-card" style="padding:12px 14px;">
        <div class="dash-kpi-label">Média CSAT</div>
        <div class="dash-kpi-num" style="font-size:20px;">${avgCsat??'—'}<span style="font-size:12px;color:var(--t3);">${avgCsat?' /5':''}</span></div>
        <div style="font-size:10px;color:var(--t3);margin-top:2px;">${csatList.length} pesquisa${csatList.length!==1?'s':''}</div>
      </div>
      <div class="dash-kpi-card" style="padding:12px 14px;">
        <div class="dash-kpi-label">Último NPS</div>
        <div style="margin-top:4px;">${lastNps?npsTag(lastNps.score):'<span style="font-size:12px;color:var(--t3);">—</span>'}</div>
        ${lastNps?`<div style="font-size:10px;color:var(--t3);margin-top:3px;">${new Date(lastNps.date+'T00:00:00').toLocaleDateString('pt-BR')}</div>`:''}
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div style="font-size:12px;font-weight:700;color:var(--t1);">Pesquisas NPS</div>
      ${!showNpsForm?`<button data-action="nps-new" data-cid="${c.id}" style="background:var(--ac);color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;">+ Registrar NPS</button>`:''}
    </div>
    ${npsFormHtml}
    <div style="border:1px solid var(--b);border-radius:8px;overflow:hidden;background:var(--s1);margin-bottom:20px;">
      ${npsList.length>0?`<div style="display:grid;grid-template-columns:100px 80px 1fr 100px 60px;gap:10px;padding:8px 12px;background:var(--s2);font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;"><span>Data</span><span style="text-align:center;">Nota</span><span>Classificação</span><span></span><span></span></div>`:''}
      ${npsList.length?npsList.map(p=>mkSurveyRow(p,'nps')).join(''):`<div style="text-align:center;padding:24px;color:var(--t3);font-size:12px;">Nenhuma pesquisa NPS registrada</div>`}
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div style="font-size:12px;font-weight:700;color:var(--t1);">Pesquisas CSAT</div>
      ${!showCsatForm?`<button data-action="csat-new" data-cid="${c.id}" style="background:var(--ac);color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;">+ Registrar CSAT</button>`:''}
    </div>
    ${csatFormHtml}
    <div style="border:1px solid var(--b);border-radius:8px;overflow:hidden;background:var(--s1);">
      ${csatList.length>0?`<div style="display:grid;grid-template-columns:100px 80px 1fr 100px 60px;gap:10px;padding:8px 12px;background:var(--s2);font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;"><span>Data</span><span style="text-align:center;">Nota</span><span>Classificação</span><span></span><span></span></div>`:''}
      ${csatList.length?csatList.map(p=>mkSurveyRow(p,'csat')).join(''):`<div style="text-align:center;padding:24px;color:var(--t3);font-size:12px;">Nenhuma pesquisa CSAT registrada</div>`}
    </div>`;

  // ── Tab: Relacionamento ─────────────────────────────────
  const hasRel=!!(c.rel_consultant||c.rel_truss||c.rel_talento||c.rel_brands||c.rel_portfolio?.length);
  const yesno=(val)=>`
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:7px 12px;border-radius:7px;border:2px solid ${val===true?'var(--ac)':'var(--b)'};background:${val===true?'var(--ac)10':'var(--s2)'};font-size:12px;font-weight:700;color:${val===true?'var(--ac)':'var(--t2)'};">
      <input type="radio" name="yn-PLACEHOLDER" value="true" ${val===true?'checked':''} style="accent-color:var(--ac);"> Sim
    </label>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:7px 12px;border-radius:7px;border:2px solid ${val===false?'var(--ac)':'var(--b)'};background:${val===false?'var(--ac)10':'var(--s2)'};font-size:12px;font-weight:700;color:${val===false?'var(--ac)':'var(--t2)'};">
      <input type="radio" name="yn-PLACEHOLDER" value="false" ${val===false?'checked':''} style="accent-color:var(--ac);"> Não
    </label>`;
  const trussVal=c.rel_truss===true?true:c.rel_truss===false?false:null;
  const talentoVal=c.rel_talento===true?true:c.rel_talento===false?false:null;

  const tabRel=`
    <div class="cmodal-section">
      <div class="cmodal-section-label">Consultor de negócios</div>
      <div class="cmodal-grid">
        <div class="cfield"><label>Consultor responsável</label>
          <select id="r-consultant">
            <option value="">Sem consultor</option>
            ${team.map(t=>`<option value="${esc(t.name)}"${c.rel_consultant===t.name?' selected':''}>${esc(t.name)}</option>`).join('')}
          </select>
        </div>
        <div class="cfield"><label>Observações do consultor</label><input id="r-consultant-notes" type="text" value="${esc(c.rel_consultant_notes||'')}" placeholder="Contexto do atendimento, preferências..."></div>
      </div>
    </div>
    <div class="cmodal-section">
      <div class="cmodal-section-label">Relacionamento KAMI CO.</div>
      <div class="cmodal-grid" style="margin-bottom:14px;">
        <div class="cfield">
          <label>Base cliente TRUSS?</label>
          <div style="display:flex;gap:8px;margin-top:2px;">
            ${yesno(trussVal).replace(/yn-PLACEHOLDER/g,'r-truss')}
          </div>
        </div>
        <div class="cfield">
          <label>KAMI Talent's?</label>
          <div style="display:flex;gap:8px;margin-top:2px;">
            ${yesno(talentoVal).replace(/yn-PLACEHOLDER/g,'r-talento')}
          </div>
        </div>
      </div>
      <div class="cfield" style="margin-bottom:10px;"><label>Marcas que utiliza atualmente</label><input id="r-brands" type="text" value="${esc(c.rel_brands||'')}" placeholder="Ex: L'Oréal, Wella, Cadiveu..."></div>
      <div class="cfield"><label>Portfólio de categorias</label>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px 16px;margin-top:4px;">
          ${C_PORTFOLIOS.map(o=>{const chk=(c.rel_portfolio||[]).includes(o);return`<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t1);cursor:pointer;padding:4px 0;"><input type="checkbox" name="r-portfolio" value="${esc(o)}" ${chk?'checked':''} style="accent-color:var(--ac);width:13px;height:13px;flex-shrink:0;"> ${esc(o)}</label>`;}).join('')}
        </div>
      </div>
    </div>`;

  // ── Tab: ERP / UNO ──────────────────────────────────────
  const hasErp=!!(c.erp_code||c.erp_credit_status||c.erp_credit_limit||c.erp_balance_open);
  const tabErp=`
    <div style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--s2);border:1px solid var(--b);border-radius:8px;margin-bottom:20px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span style="font-size:11px;color:var(--t3);">Dados sincronizados manualmente com o ERP UNO. Preencha após consulta no sistema.</span>
    </div>
    <div class="cmodal-section">
      <div class="cmodal-section-label">Identificação no ERP</div>
      <div class="cmodal-grid">
        <div class="cfield"><label>Código UNO</label><input id="e-code" type="text" value="${esc(c.erp_code||'')}" placeholder="Código do cliente no sistema"></div>
        <div class="cfield"><label>Status de aprovação de crédito</label>
          <select id="e-credit-status">
            <option value="">Selecione...</option>
            ${['Aprovado','Aprovado com restrição','Em análise','Reprovado','Bloqueado','Sem cadastro'].map(o=>`<option value="${o}"${c.erp_credit_status===o?' selected':''}>${o}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div class="cmodal-section">
      <div class="cmodal-section-label">Crédito</div>
      <div class="cmodal-grid">
        <div class="cfield"><label>Limite de crédito (R$)</label><input id="e-credit-limit" type="number" min="0" step="0.01" value="${c.erp_credit_limit||''}" placeholder="0,00"></div>
        <div class="cfield"><label>Saldo em aberto (R$)</label><input id="e-balance-open" type="number" min="0" step="0.01" value="${c.erp_balance_open||''}" placeholder="0,00"></div>
        <div class="cfield"><label>Saldo a pagar (R$)</label><input id="e-balance-due" type="number" min="0" step="0.01" value="${c.erp_balance_due||''}" placeholder="0,00"></div>
        <div class="cfield"><label>Vencimento mais próximo</label><input id="e-next-due" type="date" value="${esc(c.erp_next_due||'')}"></div>
      </div>
    </div>
    <div class="cmodal-section">
      <div class="cmodal-section-label">Documentação e observações</div>

      </div>

  // ── Tab: Origem ─────────────────────────────────────────
  const hasOrigin=!!(c.origin_channel||c.origin_campaign||c.origin_referral||c.origin_date||c.origin_responsible||c.origin_stage||c.origin_notes);

        <div class="cfield"><label>Responsável pela prospecção</label>

            ${team.map(t=>`<option value="${esc(t.name)}"${c.origin_responsible===t.name?' selected':''}>${esc(t.name)}</option>`).join('')}

        </div>
        <div class="cfield"><label>Etapa de entrada no funil</label>
          <select id="c-origin-stage">
            <option value="">Selecione...</option>
            ${['Lead','MQL','SQL','Oportunidade','Cliente'].map(s=>`<option value="${s}"${c.origin_stage===s?' selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div class="cmodal-section">
      <div class="cmodal-section-label">Contexto da prospecção</div>
      <div class="cfield"><textarea id="c-origin-notes" placeholder="Como esse cliente chegou até nós? Qual era o contexto, dor ou momento de compra?">${esc(c.origin_notes||'')}</textarea></div>
    </div>
    ${hasOrigin&&c.origin_channel?`<div style="background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:10px;">
      <div style="width:32px;height:32px;background:var(--ac)15;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--t1);">Origem identificada</div>
        <div style="font-size:11px;color:var(--t3);">${esc(c.origin_channel)}${c.origin_campaign?' · '+esc(c.origin_campaign):''}${c.origin_date?' · '+new Date(c.origin_date+'T00:00:00').toLocaleDateString('pt-BR'):''}</div>
      </div>
    </div>`:''}`;

  const tabs=isNew?'':`<div class="mtabs" style="padding:0 20px;border-bottom:1px solid var(--b);flex-shrink:0;">
    <button class="mtab ${tab==='dados'?'on':''}" data-action="client-tab" data-tab="dados">Dados</button>
    <button class="mtab ${tab==='persona'?'on':''}" data-action="client-tab" data-tab="persona">Persona${hasPersona?` <span style="width:6px;height:6px;background:var(--ac);border-radius:50%;display:inline-block;margin-left:5px;"></span>`:''}</button>
    <button class="mtab ${tab==='rel'?'on':''}" data-action="client-tab" data-tab="rel">Relacionamento${hasRel?` <span style="width:6px;height:6px;background:var(--ac);border-radius:50%;display:inline-block;margin-left:5px;"></span>`:''}</button>
    <button class="mtab ${tab==='origem'?'on':''}" data-action="client-tab" data-tab="origem">Origem${hasOrigin?` <span style="width:6px;height:6px;background:var(--ac);border-radius:50%;display:inline-block;margin-left:5px;"></span>`:''}</button>
    <button class="mtab ${tab==='erp'?'on':''}" data-action="client-tab" data-tab="erp">UNO / ERP${hasErp?` <span style="width:6px;height:6px;background:var(--ac);border-radius:50%;display:inline-block;margin-left:5px;"></span>`:''}</button>
    <button class="mtab ${tab==='trade'?'on':''}" data-action="client-tab" data-tab="trade">Trade Mkt${tradeList.length>0?` <span style="background:var(--ac);color:#fff;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:700;margin-left:4px;">${tradeList.length}</span>`:''}</button>
    <button class="mtab ${tab==='npscsat'?'on':''}" data-action="client-tab" data-tab="npscsat">NPS & CSAT${(npsList.length+csatList.length)>0?` <span style="background:var(--ac);color:#fff;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:700;margin-left:4px;">${npsList.length+csatList.length}</span>`:''}</button>
    <button class="mtab ${tab==='compras'?'on':''}" data-action="client-tab" data-tab="compras">Compras${purchases.length>0?` <span style="background:var(--ac);color:#fff;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:700;margin-left:4px;">${purchases.length}</span>`:''}</button>
  </div>`;

  const footDados=`
    ${!isNew?`<button class="btn btn-d" data-action="client-delete-modal" data-cid="${c.id}" style="margin-right:auto;">Excluir</button>`:''}
    <button class="btn btn-o" data-action="client-modal-close">Cancelar</button>
    <button class="btn btn-p" data-action="client-save" data-cid="${isNew?'':c.id}" style="margin-right:0;">${isNew?'Criar Cliente':'Salvar alterações'}</button>`;
  const footOrigem=`
    <button class="btn btn-o" data-action="client-modal-close">Cancelar</button>
    <button class="btn btn-p" data-action="client-save" data-cid="${c.id}" style="margin-right:0;">Salvar alterações</button>`;
  const footPersona=`
    <button class="btn btn-o" data-action="client-modal-close">Cancelar</button>
    <button class="btn btn-p" data-action="client-save" data-cid="${c.id}" style="margin-right:0;">Salvar alterações</button>`;
  const footErp=`
    <button class="btn btn-o" data-action="client-modal-close">Cancelar</button>
    <button class="btn btn-p" data-action="client-save" data-cid="${c.id}" style="margin-right:0;">Salvar alterações</button>`;
  const footRel=`
    <button class="btn btn-o" data-action="client-modal-close">Cancelar</button>
    <button class="btn btn-p" data-action="client-save" data-cid="${c.id}" style="margin-right:0;">Salvar alterações</button>`;

        <div style="display:flex;align-items:center;gap:10px;">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div>
            <div class="mhead-t">${isNew?'Novo Cliente':esc(c.name||'Cliente')}</div>

    </div>
  </div>`;
}

// ── BIBLIOTECA DE ASSETS ─────────────────────────────────────────────────────
function renderAssets(){
  if(!S.assets)S.assets=[];
  const assets=S.assets;
  const q=(S.assets_q||'').toLowerCase();
  const filterTag=S.assets_tag||'';
  const filterType=S.assets_type||'all';

  // Coleta todas as tags existentes
  const allTags=[...new Set(assets.flatMap(a=>a.tags||[]))].sort();

  const filtered=assets.filter(a=>{
    if(filterTag&&!(a.tags||[]).includes(filterTag))return false;
    if(filterType==='image'&&!a.type.startsWith('image'))return false;
    if(filterType==='video'&&!a.type.startsWith('video'))return false;
    if(filterType==='file'&&(a.type.startsWith('image')||a.type.startsWith('video')))return false;
    if(q&&!(a.name||'').toLowerCase().includes(q)&&!(a.tags||[]).join(' ').toLowerCase().includes(q))return false;
    return true;
  });

  const fmtSize=b=>{if(!b)return'';if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB';};
  const isImg=a=>a.type&&a.type.startsWith('image');
  const isVid=a=>a.type&&a.type.startsWith('video');

  const assetCard=a=>`<div class="asset-card" data-asset-id="${a.id}" style="background:var(--s1);border:1px solid var(--b);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:default;">
    <div style="height:120px;background:var(--s2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;">
      ${isImg(a)&&a.dataUrl?`<img src="${a.dataUrl}" alt="${esc(a.name)}" style="width:100%;height:100%;object-fit:cover;">`
        :isVid(a)?`<div style="font-size:32px;color:var(--t3);">▶</div>`
        :`<div style="font-size:32px;color:var(--t3);">📄</div>`}
      <div class="asset-hover-actions" style="position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;gap:8px;">
        <button data-asset-copy="${a.id}" style="background:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;" title="Copiar URL">Copiar</button>
        <button data-asset-del="${a.id}" style="background:#ef4444;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;">Excluir</button>
      </div>
    </div>
    <div style="padding:8px 10px;flex:1;display:flex;flex-direction:column;gap:4px;">
      <div style="font-size:11px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${esc(a.name)}">${esc(a.name)}</div>
      <div style="font-size:10px;color:var(--t3);">${fmtSize(a.size)}${a.uploadedAt?' · '+new Date(a.uploadedAt).toLocaleDateString('pt-BR'):''}</div>
      ${(a.tags||[]).length?`<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:2px;">${(a.tags||[]).map(t=>`<span style="background:var(--ac)18;color:var(--ac);border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700;">${esc(t)}</span>`).join('')}</div>`:''}
    </div>
  </div>`;

  return`<div style="height:100%;display:flex;flex-direction:column;overflow:hidden;">
    <div style="padding:14px 20px 10px;background:var(--s1);border-bottom:1px solid var(--b);flex-shrink:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div style="font-size:15px;font-weight:800;color:var(--t1);">Biblioteca de Assets</div>
      <input id="assets-search" type="text" placeholder="Buscar por nome ou tag…" value="${esc(S.assets_q||'')}" style="background:var(--s2);border:1px solid var(--b);border-radius:7px;color:var(--t1);padding:6px 11px;font-size:12px;font-family:inherit;outline:none;width:220px;">
      <div style="display:flex;gap:4px;">
        ${[['all','Todos'],['image','Imagens'],['video','Vídeos'],['file','Arquivos']].map(([v,l])=>`<button data-assets-type="${v}" style="background:${filterType===v?'var(--ac)':'var(--s2)'};color:${filterType===v?'#fff':'var(--t2)'};border:1px solid ${filterType===v?'var(--ac)':'var(--b)'};border-radius:6px;padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;">${l}</button>`).join('')}
      </div>
      <label style="margin-left:auto;background:var(--ac);color:#fff;border-radius:7px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Upload
        <input id="assets-upload-input" type="file" multiple accept="image/*,video/*,.pdf,.zip,.psd,.ai,.svg,.mp4,.mov" style="display:none;">
      </label>
    </div>
    ${allTags.length?`<div style="padding:8px 20px;background:var(--s1);border-bottom:1px solid var(--b);display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;">
      <button data-assets-tag="" style="background:${!filterTag?'var(--ac)':'var(--s2)'};color:${!filterTag?'#fff':'var(--t2)'};border:1px solid ${!filterTag?'var(--ac)':'var(--b)'};border-radius:20px;padding:3px 11px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;">Todas</button>
      ${allTags.map(t=>`<button data-assets-tag="${esc(t)}" style="background:${filterTag===t?'var(--ac)':'var(--s2)'};color:${filterTag===t?'#fff':'var(--t2)'};border:1px solid ${filterTag===t?'var(--ac)':'var(--b)'};border-radius:20px;padding:3px 11px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;">${esc(t)}</button>`).join('')}
    </div>`:''}
    <div style="flex:1;overflow-y:auto;padding:20px;">
      ${filtered.length===0?`<div style="text-align:center;padding:60px 20px;color:var(--t3);">
        <div style="font-size:40px;margin-bottom:12px;opacity:.3;">🗂</div>
        <div style="font-size:14px;font-weight:700;color:var(--t2);margin-bottom:6px;">${assets.length===0?'Nenhum asset ainda':'Nenhum resultado'}</div>
        <div style="font-size:12px;">${assets.length===0?'Clique em Upload para adicionar imagens, vídeos ou arquivos.':'Tente outros filtros ou termos de busca.'}</div>
      </div>`:`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;" id="assets-grid">
        ${filtered.map(assetCard).join('')}
      </div>`}
    </div>
    ${S.assets_tag_modal?`<div class="overlay" style="z-index:800;">
      <div class="modal" style="max-width:360px;width:100%;">
        <div class="mhead"><span style="font-size:14px;font-weight:800;">Adicionar tags ao asset</span></div>
        <div class="mbody" style="padding:18px 20px;">
          <div style="font-size:12px;font-weight:600;color:var(--t2);margin-bottom:8px;">Tags (separadas por vírgula)</div>
          <input id="asset-tags-input" type="text" value="${esc((S.assets_tag_modal.tags||[]).join(', '))}" placeholder="ex: campanha-verao, logo, produto" style="width:100%;background:var(--s2);border:1px solid var(--b);border-radius:7px;color:var(--t1);padding:8px 11px;font-size:12px;font-family:inherit;outline:none;">
        </div>
        <div class="mfoot" style="display:flex;gap:8px;justify-content:flex-end;">
          <button data-action="asset-tags-cancel" class="btn" style="background:var(--s2);border:1px solid var(--b);color:var(--t2);">Cancelar</button>
          <button data-action="asset-tags-save" class="btn btn-primary">Salvar</button>
        </div>
      </div>
    </div>`:''}
  </div>`;
}

function socMain(){
  const v=S.social_view;
  const views=[{id:'dashboard',label:'Dashboard'},{id:'schedule',label:'Programar'},{id:'calendar',label:'Calendário'}];
  return`<div style="display:flex;align-items:center;padding:0 20px;background:var(--s1);border-bottom:1px solid var(--b);flex-shrink:0;height:42px;gap:0;">
    ${views.map(vi=>`<button data-soc-view="${vi.id}" style="padding:0 15px;height:100%;border:none;background:none;color:${v===vi.id?'var(--ac)':'var(--t3)'};font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid ${v===vi.id?'var(--ac)':'transparent'};font-family:inherit;transition:.12s;">${esc(vi.label)}</button>`).join('')}
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
      ${v==='schedule'?`<button data-action="open-claude-import" style="background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;border-radius:7px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;">✦ Importar do Claude</button>`:''}
      <span style="font-size:11px;color:var(--t3);">${S.social_accounts.length} conta${S.social_accounts.length!==1?'s':''} conectada${S.social_accounts.length!==1?'s':''}</span>
      <button data-action="soc-open-profiles" style="background:var(--ac);color:#fff;border:none;border-radius:7px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;">👤 Perfis</button>

  <div style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;">
    ${v==='dashboard'?socDashboard():v==='schedule'?socSchedule():v==='calendar'?socCalendar():v==='competitors'?socCompetitors():socAnalytics()}

  ${socConnectModal()}
  ${renderSocialProfilesPanel()}`;
}

let _emojiPickerTarget = null;
let _emojiPickerCat = 'Documentos';

function openEmojiPicker(btn, inputEl){
  // close existing
  document.querySelectorAll('.emoji-picker').forEach(el=>el.remove());
  _emojiPickerTarget = inputEl;
  _emojiPickerCat = Object.keys(EMOJI_CATS)[0];
  const picker = document.createElement('div');
  picker.className = 'emoji-picker';
  picker.id = 'emoji-picker';
  renderEmojiPickerContent(picker);
  // position below btn
  const rect = btn.getBoundingClientRect();
  picker.style.top = (rect.bottom + 4) + 'px';
  picker.style.left = Math.min(rect.left, window.innerWidth - 320) + 'px';
  picker.style.position = 'fixed';
  picker.style.zIndex = '9999';
  document.body.appendChild(picker);
  // close on outside click — ignore clicks whose target was removed from DOM (picker re-render)
  setTimeout(()=>{
    document.addEventListener('click', function handler(e){
      if(!document.body.contains(e.target))return; // target detached = was inside picker during re-render
      if(!picker.contains(e.target)&&e.target!==btn){picker.remove();document.removeEventListener('click',handler);}
    });
  }, 10);
}

function renderEmojiPickerContent(picker){
  const cats = [...Object.keys(EMOJI_CATS), 'Serviços'];
  const isServices = _emojiPickerCat === 'Serviços';
  const emojis = isServices ? [] : (EMOJI_CATS[_emojiPickerCat] || []);
  picker.innerHTML = `
    <div class="emoji-picker-cats">
      ${cats.map(c=>`<button class="emoji-cat-btn${c===_emojiPickerCat?' on':''}" onclick="window._setEmojiCat('${c}')">${c}</button>`).join('')}
    </div>
    <div class="emoji-grid" style="${isServices?'grid-template-columns:repeat(6,1fr);gap:6px;':''}">
      ${isServices
        ? ICON_SERVICES.map(s=>`<button class="emoji-opt" style="flex-direction:column;height:44px;width:44px;gap:2px;" title="${s.label}" onclick="window._pickEmoji('${s.val}')"><img src="${s.val.slice(4)}" style="width:22px;height:22px;object-fit:contain;"><span style="font-size:8px;color:var(--t3);line-height:1;">${s.label}</span></button>`).join('')
        : emojis.map(e=>`<button class="emoji-opt" onclick="window._pickEmoji('${e}')">${e}</button>`).join('')
      }
    </div>`;
}

window._setEmojiCat = function(cat){
  _emojiPickerCat = cat;
  const picker = document.getElementById('emoji-picker');
  if(picker) renderEmojiPickerContent(picker);
};
window._pickEmoji = function(emoji){
  if(_emojiPickerTarget){
    _emojiPickerTarget.value = emoji;
    _emojiPickerTarget.dispatchEvent(new Event('input'));
    // update the visible emoji button
    const btn = _emojiPickerTarget.previousElementSibling;
    if(btn && btn.classList.contains('emoji-btn')) btn.textContent = emoji;
  }
  document.getElementById('emoji-picker')?.remove();
  _emojiPickerTarget = null;
};

function csvEscape(v){if(v==null)return'';const s=String(v);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;}
function downloadCSV(filename, rows){
  const csv=rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const bom='﻿'; // BOM para Excel reconhecer UTF-8
  const blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);
}

function fmtComments(comments){
  if(!comments?.length)return'';
  return comments.map(cm=>{
    const replies=(cm.replies||[]).map(r=>`  ↩ ${r.userName||'?'}: ${r.text}`).join('\n');
    return`[${new Date(cm.ts).toLocaleDateString('pt-BR')} ${cm.userName||'?'}] ${cm.text}${replies?'\n'+replies:''}`;
  }).join('\n---\n');
}

function fmtApproval(approval){
  if(!approval)return'';
  const status=approval.status==='approved'?'Aprovado':'Recusado';
  return`${status} por ${approval.by} em ${new Date(approval.ts).toLocaleDateString('pt-BR')}${approval.comment?' — '+approval.comment:''}`;
}

function projColor(p){const custom=(S.custom_projects||[]).find(x=>x.name===p);if(custom)return{bg:custom.bg,color:custom.color};return PROJ_COLORS[p]||{bg:'#ede9fe',color:'#6d28d9'};}
function getProjPrefix(proj){
  if(!proj)return'';
  if(PROJ_PREFIX[proj])return PROJ_PREFIX[proj];
  // projetos customizados: primeiras letras maiúsculas
  const custom=(S.custom_projects||[]).find(x=>x.name===proj);
  if(custom){
    const words=proj.split(/\s+/).filter(Boolean);
    return'#'+(words.length===1?proj.slice(0,3):words.map(w=>w[0]).join('')).toUpperCase();
  }
  return'#'+proj.slice(0,3).toUpperCase();
}
function getNextProjCode(proj){
  if(!proj)return'';
  const prefix=getProjPrefix(proj);
  const existing=(S.cards||[]).filter(c=>c.project===proj&&c.title&&c.title.startsWith(prefix));
  const nums=existing.map(c=>{const m=c.title.match(/\.(\d+)/);return m?parseInt(m[1]):0;});
  const next=Math.max(0,...nums)+1;
  return prefix+'.'+String(next).padStart(2,'0')+' | ';
}

function bind(){
  const r=document.getElementById('root');

  // ── Tip tooltips ──
  const tipEl=document.getElementById('tip-popup');
  if(tipEl){
    document.querySelectorAll('.tip').forEach(t=>{
      t.addEventListener('mouseenter',e=>{
        tipEl.textContent=t.dataset.tip||'';
        tipEl.style.display='block';
        const rect=t.getBoundingClientRect();
        let top=rect.top-tipEl.offsetHeight-10;
        let left=rect.left+rect.width/2-tipEl.offsetWidth/2;
        if(top<8)top=rect.bottom+8;
        if(left<8)left=8;
        if(left+tipEl.offsetWidth>window.innerWidth-8)left=window.innerWidth-tipEl.offsetWidth-8;
        tipEl.style.top=top+'px';
        tipEl.style.left=left+'px';
      });
      t.addEventListener('mouseleave',()=>{tipEl.style.display='none';});
    });
  }

  // Dismiss startup alert
  const dismissAlert=r.querySelector('[data-action="dismiss-startup-alert"]');
  if(dismissAlert)dismissAlert.addEventListener('click',()=>{S.startup_alert_dismissed=true;render();});

  // Pipeline tabs — reset alert dismiss when switching to content
  r.querySelectorAll('[data-pipe]').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.pipe==='content')S.startup_alert_dismissed=false;
    if(b.dataset.pipe==='portal')S.news_popup=true;
    if(b.dataset.pipe==='portal-dist')S.news_dist_popup=true;
    S.pipe=b.dataset.pipe;render();
  }));

  // View toggle
  r.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
    if(S.pipe==='content')S.view=b.dataset.view;else S.view2=b.dataset.view;render();
  }));

  // New button
  r.querySelectorAll('[data-action="new"]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    if(S.pipe==='content'){
      S.modal={open:true,id:null,defStatus:b.dataset.st||'ideas',tab:'basic'};
    }else{
      S.modal2={open:true,id:null,defStatus:b.dataset.st2||'triage',tab:'form',attachmentName:''};
    }
    render();
  }));

  // Filters P1
  let _f1Debounce=null;
  r.querySelectorAll('[data-f1]').forEach(el=>{
    const isSearch=el.dataset.f1==='search';
    el.addEventListener(isSearch?'input':'change',()=>{
      S.filters[el.dataset.f1]=el.value;
      if(isSearch){
        // Debounce 300ms para busca por texto — evita re-render a cada tecla
        clearTimeout(_f1Debounce);
        _f1Debounce=setTimeout(render,300);
      } else {
        render();
      }
    });
  });
  r.querySelectorAll('[data-action="clr1"]').forEach(el=>el.addEventListener('click',()=>{S.filters={search:'',project:'',type:'',funnel:'',channel:'',status:'',responsible:''};render();}));

  // Filters P2
  let _f2Debounce=null;
  r.querySelectorAll('[data-f2]').forEach(el=>{
    const isSearch=el.dataset.f2==='search';
    el.addEventListener(isSearch?'input':'change',()=>{
      S.filters2[el.dataset.f2]=el.value;
      if(isSearch){
        clearTimeout(_f2Debounce);
        _f2Debounce=setTimeout(render,300);
      } else {
        render();
      }
    });
  });
  r.querySelectorAll('[data-action="clr2"]').forEach(el=>el.addEventListener('click',()=>{S.filters2={search:'',unit:'',orderType:'',status:'',responsible2:''};render();}));

  // Sort P1
  r.querySelectorAll('[data-sort1]').forEach(th=>th.addEventListener('click',()=>{
    const f=th.dataset.sort1;
    if(S.sort.field===f)S.sort.dir=S.sort.dir==='asc'?'desc':'asc';else{S.sort.field=f;S.sort.dir='asc';}
    render();
  }));

  // Sort P2
  r.querySelectorAll('[data-sort2]').forEach(th=>th.addEventListener('click',()=>{
    const f=th.dataset.sort2;
    if(S.sort2.field===f)S.sort2.dir=S.sort2.dir==='asc'?'desc':'asc';else{S.sort2.field=f;S.sort2.dir='asc';}
    render();
  }));

  // Card / row click — P1
  r.querySelectorAll('[data-cpipe="1"]').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('[data-action]'))return;
    S.modal={open:true,id:el.dataset.cid,tab:'basic'};render();
  }));

  // Card / row click — P2
  r.querySelectorAll('[data-cpipe="2"]').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('[data-action]'))return;
    S.modal2={open:true,id:el.dataset.rid,tab:'view',attachmentName:''};render();
  }));

  // Responsible chips — content card
  const addRespBtn=r.querySelector('#add-resp-c1-btn');
  const addRespDd=r.querySelector('#add-resp-c1-dd');
  if(addRespBtn&&addRespDd){
    addRespBtn.addEventListener('click',e=>{e.stopPropagation();addRespDd.style.display=addRespDd.style.display==='block'?'none':'block';});
    document.addEventListener('click',function closeDD(e){if(!addRespDd.contains(e.target)&&e.target!==addRespBtn){addRespDd.style.display='none';}},{once:false});
    // search filter

    r.querySelectorAll('.resp-opt-c1').forEach(el=>{
      el.addEventListener('mouseover',()=>el.style.background='var(--s2)');
      el.addEventListener('mouseout',()=>el.style.background='none');
      el.addEventListener('click',()=>{
        const name=el.dataset.n;
        const chips=r.querySelector('#resp-chips-c1');
        if(!chips)return;
        const existing=[...chips.querySelectorAll('[data-name]')].map(x=>x.dataset.name);
        if(existing.includes(name))return;
        // check hidden checkbox
        const cb=[...r.querySelectorAll('#resp-hidden-checks input[type=checkbox]')].find(c=>c.value===name);
        if(cb)cb.checked=true;
        // build chip

  function initColDrag(tableId, storageKey){
    const tbl=document.getElementById(tableId);
    if(!tbl)return;
    const uid=(AUTH.session&&AUTH.session.email)||'default';
    const key=storageKey+'-'+uid;
    const ths=[...tbl.querySelectorAll('thead th[data-col-key]')];
    let dragIdx=null;
    ths.forEach((th,i)=>{
      th.addEventListener('dragstart',e=>{
        dragIdx=i;
        e.dataTransfer.effectAllowed='move';
        th.style.opacity='.4';
      });
      th.addEventListener('dragend',()=>{
        th.style.opacity='1';
        ths.forEach(t=>t.style.outline='');
      });
      th.addEventListener('dragover',e=>{
        e.preventDefault();
        ths.forEach(t=>t.style.outline='');
        if(i!==dragIdx)th.style.outline='2px solid var(--ac)';
      });
      th.addEventListener('dragleave',()=>th.style.outline='');
      th.addEventListener('drop',e=>{
        e.preventDefault();
        th.style.outline='';
        if(dragIdx===null||dragIdx===i)return;
        // reorder all rows
        const rows=[...tbl.querySelectorAll('tbody tr')];
        const allThs=[...tbl.querySelectorAll('thead tr th')];
        // move header
        const thead=tbl.querySelector('thead tr');
        const moved=allThs[dragIdx];
        if(dragIdx<i)thead.insertBefore(moved,allThs[i].nextSibling);
        else thead.insertBefore(moved,allThs[i]);
        // move each body cell
        rows.forEach(row=>{
          const cells=[...row.children];
          if(!cells[dragIdx])return;
          const mc=cells[dragIdx];
          if(dragIdx<i)row.insertBefore(mc,cells[i].nextSibling);
          else row.insertBefore(mc,cells[i]);
        });
        // save new order
        const newOrder=[...tbl.querySelectorAll('thead th[data-col-key]')].map(t=>t.dataset.colKey);
        try{localStorage.setItem(key,JSON.stringify(newOrder));}catch(e){}
        dragIdx=null;
      });
    });
  }
